<template id="hook-template">
  <div
    data-composition-id="hook"
    data-start="0"
    data-duration="3.00"
    data-width="1080"
    data-height="1920"
  >
    <div class="h-kicker">UNIT PRICE SHOWDOWN</div>

    <div class="h-stack">
      <div class="h-store h-store-a">DOLLAR TREE</div>
      <div class="h-vs">VS</div>
      <div class="h-store h-store-b">WALMART</div>
    </div>

    <div class="h-sub">Same shopping list.<br />Sticker price isn't the answer.</div>

    <div class="h-whip"></div>

    <style>
      @import url("assets/brand-tokens.css");

      [data-composition-id="hook"] {
        position: absolute;
        inset: 0;
        overflow: hidden;
        font-family: var(--font-ui);
        color: var(--text);
      }
      [data-composition-id="hook"] .h-kicker {
        position: absolute;
        top: 470px;
        left: 0;
        right: 0;
        text-align: center;
        font-family: var(--font-mono);
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 0.36em;
        color: var(--accent);
        text-shadow: 0 0 26px rgba(251, 191, 36, 0.5);
      }
      [data-composition-id="hook"] .h-stack {
        position: absolute;
        top: 620px;
        left: 60px;
        right: 60px;
        text-align: center;
      }
      [data-composition-id="hook"] .h-store {
        font-size: 128px;
        font-weight: 900;
        letter-spacing: -0.045em;
        line-height: 1.04;
      }
      [data-composition-id="hook"] .h-store-a {
        color: var(--side-a);
        text-shadow: 0 0 60px rgba(34, 197, 94, 0.45);
      }
      [data-composition-id="hook"] .h-store-b {
        color: var(--side-b);
        text-shadow: 0 0 60px rgba(59, 130, 246, 0.45);
      }
      [data-composition-id="hook"] .h-vs {
        font-family: var(--font-mono);
        font-size: 54px;
        font-weight: 700;
        color: var(--text-dim);
        margin: 26px 0;
        letter-spacing: 0.1em;
      }
      [data-composition-id="hook"] .h-sub {
        position: absolute;
        top: 1180px;
        left: 80px;
        right: 80px;
        text-align: center;
        font-size: 46px;
        font-weight: 600;
        line-height: 1.45;
        color: var(--text-muted);
      }
      /* Whip streak covers the cut out of the hook and into the first card. */
      [data-composition-id="hook"] .h-whip {
        position: absolute;
        top: 0;
        left: -40%;
        width: 60%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.9),
          transparent
        );
        filter: blur(30px);
        opacity: 0;
        z-index: 50;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const root = "[data-composition-id='hook']";

        // Kicker sets the frame before either brand name exists.
        tl.from(root + " .h-kicker",
          { y: -26, opacity: 0, duration: 0.4, ease: "expo.out" }, 0.05);

        // The two stores land as separate hits with the VS between them — one
        // idea per beat, so the eye reads a matchup rather than a paragraph.
        tl.from(root + " .h-store-a",
          { x: -90, opacity: 0, filter: "blur(18px)", duration: 0.46, ease: "power4.out" }, 0.3);
        tl.from(root + " .h-vs",
          { scale: 0, opacity: 0, duration: 0.3, ease: "back.out(2.6)" }, 0.62);
        tl.from(root + " .h-store-b",
          { x: 90, opacity: 0, filter: "blur(18px)", duration: 0.46, ease: "power4.out" }, 0.82);

        tl.from(root + " .h-sub",
          { y: 30, opacity: 0, duration: 0.44, ease: "power3.out" }, 1.35);

        // Whip out — fires at 2.72 so it is mid-flight when the first item card
        // takes over at master 3.00.
        tl.set(root + " .h-whip", { xPercent: 0, opacity: 0 }, 2.72);
        tl.to(root + " .h-whip",
          { xPercent: 280, opacity: 1, duration: 0.28, ease: "power3.in" }, 2.72);

        // Duration anchor (Render Contract rule 7).
        tl.to({}, { duration: 3.0 }, 0);
        window.__timelines["hook"] = tl;
      })();
    </script>
  </div>
</template>
