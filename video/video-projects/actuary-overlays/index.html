<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Actuary Overlays</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
    </style>
  </head>
  <body>
    <!--
      This project has no single "video" — it is a set of independent overlay
      cards, each rendered on its own with:

        npx hyperframes render -c compositions/<name>.html --format webm \
            --output renders/<name>.webm

      WebM carries the alpha channel; the cards are then composited onto the
      cut episode by video-use's render.py via the EDL's `overlays` list.

      The CLI requires an index.html for the project to be valid, so this is a
      deliberately empty placeholder. Do not build anything here.
    -->
    <div id="root" data-composition-id="actuary-overlays" data-start="0" data-duration="1.00" data-width="1920" data-height="1080"></div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 1.0 }, 0);
      window.__timelines["actuary-overlays"] = tl;
    </script>
  </body>
</html>
