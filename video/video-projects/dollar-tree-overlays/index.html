<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Dollar Tree Overlays</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
    </style>
  </head>
  <body>
    <!--
      Like actuary-overlays, this project is a set of independent cards rather
      than one video. Render each on its own, alpha intact:

        npx hyperframes render -c compositions/<name>.html --format mov \
            --output renders/<name>.mov

      ProRes 4444 (yuva444p12le) carries alpha; WebM comes out opaque here, so
      check pix_fmt before compositing. The cards are then burned onto the cut
      with video/tools/composite_overlays.py.

      The CLI needs an index.html for the project to validate. This is a
      deliberately empty placeholder — build nothing here.
    -->
    <div id="root" data-composition-id="dollar-tree-overlays" data-start="0" data-duration="1.00" data-width="1920" data-height="1080"></div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 1.0 }, 0);
      window.__timelines["dollar-tree-overlays"] = tl;
    </script>
  </body>
</html>
