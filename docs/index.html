<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Anyone</title>
</head>
<body>
<style>
  /* Light is the base palette; both dark paths redefine tokens only. */
  :root {
    --bg: #F1F3F4;
    --surface: #FFFFFF;
    --surface-2: #E6EAEB;
    --ink: #151F1E;
    --ink-2: #47585A;
    --ink-3: #77898C;
    --rule: #D2DADC;
    --accent: #BE3A1C;
    --accent-soft: #F9E7E2;
    --d-light: #6B7B7E;
    --d-medium: #16645F;
    --d-probing: #BE3A1C;
    --shadow: 0 1px 2px rgba(21, 31, 30, .06), 0 8px 24px -16px rgba(21, 31, 30, .3);

    --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-read: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

    --step-0: .875rem;
    --step-1: 1rem;
    --step-2: 1.1875rem;
    --step-3: 1.5rem;
    --step-4: 2rem;
    --rail: 16.5rem;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101817;
      --surface: #172120;
      --surface-2: #1F2C2B;
      --ink: #E8EDEC;
      --ink-2: #A6B6B5;
      --ink-3: #718281;
      --rule: #2A3837;
      --accent: #F2765A;
      --accent-soft: #331A14;
      --d-light: #8A9A9C;
      --d-medium: #4FB5AC;
      --d-probing: #F2765A;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
    }
  }

  :root[data-theme="dark"] {
    --bg: #101817;
    --surface: #172120;
    --surface-2: #1F2C2B;
    --ink: #E8EDEC;
    --ink-2: #A6B6B5;
    --ink-3: #718281;
    --rule: #2A3837;
    --accent: #F2765A;
    --accent-soft: #331A14;
    --d-light: #8A9A9C;
    --d-medium: #4FB5AC;
    --d-probing: #F2765A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
  }

  * { box-sizing: border-box; }

  /* Components below set display, which would otherwise beat the [hidden]
     attribute's own display:none. */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: var(--step-1);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 2px;
  }

  /* ---------------------------------------------------------- masthead */

  .masthead {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: .5rem 1.25rem;
    padding: .875rem clamp(1rem, 3vw, 2rem);
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
  }

  .wordmark {
    display: flex;
    align-items: baseline;
    gap: .5rem;
    font-size: var(--step-2);
    font-weight: 620;
    letter-spacing: -.015em;
    margin: 0;
  }

  /* The on-air lamp: the one decorative element, and it earns its place by
     doubling as the live result count. */
  .lamp {
    align-self: center;
    width: .5rem;
    height: .5rem;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .masthead .tagline {
    font-size: var(--step-0);
    color: var(--ink-3);
    margin: 0;
  }

  /* Controls travel as one group so they never orphan onto their own line. */
  .masthead .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .5rem .75rem;
    margin-left: auto;
  }

  .count {
    font-family: var(--font-mono);
    font-size: var(--step-0);
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* ------------------------------------------------------------ controls */

  select, input[type="search"], button {
    font: inherit;
    font-size: var(--step-0);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 5px;
    padding: .375rem .625rem;
  }

  select { cursor: pointer; }

  input[type="search"] { width: 100%; }

  .btn {
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: .375rem;
    white-space: nowrap;
  }

  .btn:hover { background: var(--surface-2); }

  .btn[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--surface);
  }

  .modes { display: flex; gap: .25rem; }

  /* ------------------------------------------------------------- layout */

  .shell {
    display: grid;
    grid-template-columns: var(--rail) minmax(0, 1fr);
    gap: clamp(1rem, 3vw, 2.5rem);
    max-width: 78rem;
    margin: 0 auto;
    padding: 1.5rem clamp(1rem, 3vw, 2rem) 5rem;
    align-items: start;
  }

  /* Brief mode drops the filter rail, so the reading column reclaims the width. */
  .shell.no-rail {
    grid-template-columns: minmax(0, 1fr);
    max-width: 60rem;
  }

  .rail {
    position: sticky;
    top: 4.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    max-height: calc(100vh - 6rem);
    overflow-y: auto;
    padding-right: .25rem;
  }

  .facet { display: flex; flex-direction: column; gap: .5rem; }

  .facet h2 {
    font-size: .6875rem;
    font-weight: 640;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--ink-3);
    margin: 0;
  }

  .chips { display: flex; flex-wrap: wrap; gap: .3125rem; }

  .chip {
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: .75rem;
    padding: .1875rem .5rem;
    border: 1px solid var(--rule);
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink-2);
  }

  .chip:hover { border-color: var(--ink-3); }

  .chip[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--surface);
  }

  /* Depth is the field that changes how you use a question, so it carries
     color everywhere it appears. */
  .chip.depth[aria-pressed="true"] { background: var(--tone); border-color: var(--tone); }
  .chip.depth { --tone: var(--d-light); }
  .chip.depth[data-value="medium"] { --tone: var(--d-medium); }
  .chip.depth[data-value="probing"] { --tone: var(--d-probing); }

  /* -------------------------------------------------------------- cards */

  .results { display: flex; flex-direction: column; gap: 1.5rem; min-width: 0; }

  .stage { display: flex; flex-direction: column; gap: .625rem; }

  .stage > header {
    display: flex;
    align-items: baseline;
    gap: .625rem;
    padding-bottom: .375rem;
    border-bottom: 1px solid var(--rule);
  }

  .stage h2 {
    margin: 0;
    font-size: var(--step-0);
    font-weight: 640;
    letter-spacing: .02em;
    text-transform: uppercase;
  }

  .stage .hint {
    font-size: .75rem;
    color: var(--ink-3);
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
  }

  .card {
    display: grid;
    grid-template-columns: 1.75rem minmax(0, 1fr) auto;
    gap: .25rem .625rem;
    padding: .875rem 1rem;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--tone);
    border-radius: 7px;
    box-shadow: var(--shadow);
    --tone: var(--d-light);
  }

  .card[data-depth="medium"] { --tone: var(--d-medium); }
  .card[data-depth="probing"] { --tone: var(--d-probing); }

  .card .seq {
    grid-row: 1 / span 3;
    font-family: var(--font-mono);
    font-size: .75rem;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    padding-top: .1875rem;
  }

  .card .q {
    font-family: var(--font-read);
    font-size: var(--step-2);
    line-height: 1.4;
    margin: 0;
    text-wrap: pretty;
  }

  .card .meta {
    grid-column: 2;
    display: flex;
    flex-wrap: wrap;
    gap: .375rem .625rem;
    font-family: var(--font-mono);
    font-size: .6875rem;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: .05em;
  }

  .card .meta .depth { color: var(--tone); font-weight: 600; }

  .card .notes {
    grid-column: 2;
    display: flex;
    flex-direction: column;
    gap: .375rem;
    margin-top: .25rem;
    font-size: var(--step-0);
    color: var(--ink-2);
  }

  .card .why { margin: 0; }

  .card ul { margin: 0; padding-left: 1.125rem; display: flex; flex-direction: column; gap: .1875rem; }
  .card li { margin: 0; }
  .card li::marker { color: var(--ink-3); }

  .warn {
    display: flex;
    gap: .5rem;
    padding: .4375rem .625rem;
    background: var(--accent-soft);
    border-radius: 5px;
    color: var(--ink);
    font-size: var(--step-0);
  }

  .warn b { color: var(--accent); font-weight: 640; }

  .copy {
    grid-row: 1;
    grid-column: 3;
    align-self: start;
    cursor: pointer;
    background: none;
    border: 0;
    padding: .1875rem .375rem;
    font-family: var(--font-mono);
    font-size: .6875rem;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: .05em;
  }

  .copy:hover { color: var(--accent); }

  /* ------------------------------------------------------------ profile */

  .profile {
    display: flex;
    flex-direction: column;
    gap: .875rem;
    padding: 1.125rem 1.25rem;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 7px;
    box-shadow: var(--shadow);
  }

  .profile h2 {
    margin: 0;
    font-size: var(--step-3);
    letter-spacing: -.015em;
    text-wrap: balance;
  }

  .profile dl { margin: 0; display: flex; flex-direction: column; gap: .75rem; }

  .profile dt {
    font-size: .6875rem;
    font-weight: 640;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--ink-3);
    margin-bottom: .1875rem;
  }

  .profile dd { margin: 0; font-size: var(--step-0); color: var(--ink-2); }

  .profile dd.landmines { color: var(--ink); }

  /* Two classes, so this beats the `.profile dl` flex-column rule above. */
  .profile .vocab {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: .25rem .875rem;
    padding-top: .75rem;
    border-top: 1px solid var(--rule);
    font-family: var(--font-mono);
    font-size: .75rem;
  }

  .profile .vocab dt {
    text-transform: none;
    letter-spacing: 0;
    color: var(--accent);
    margin: 0;
    font-weight: 400;
  }

  .profile .vocab dd { color: var(--ink-2); }

  /* ------------------------------------------------------------- beats */

  .beat { grid-template-columns: 1.75rem minmax(0, 1fr); --tone: var(--d-medium); }

  .beat .eyebrow {
    grid-column: 2;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .375rem;
    font-family: var(--font-mono);
    font-size: .6875rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink-3);
  }

  /* Spine beats are what the series requires of every episode. The rest are
     the ones to drop when the recording runs long. */
  .beat.is-spine { --tone: var(--accent); }

  .spine-chip {
    padding: .0625rem .375rem;
    border: 1px solid var(--accent);
    border-radius: 999px;
    color: var(--accent);
    letter-spacing: .04em;
  }

  .profile dd.promise {
    font-family: var(--font-read);
    font-size: var(--step-2);
    line-height: 1.45;
    color: var(--ink);
    text-wrap: pretty;
  }

  .profile .avoid b { color: var(--accent); }
  .profile li b { font-weight: 640; }
  .profile li i { color: var(--ink-3); font-style: normal; font-size: .8125rem; }

  .beat .title {
    grid-column: 2;
    margin: 0 0 .375rem;
    font-size: var(--step-2);
    font-weight: 620;
    letter-spacing: -.01em;
  }

  .flavors {
    grid-column: 2;
    display: flex;
    flex-direction: column;
    gap: .375rem;
    margin-bottom: .5rem;
  }

  .flavor {
    display: grid;
    grid-template-columns: 5.25rem minmax(0, 1fr);
    gap: .625rem;
    align-items: baseline;
  }

  .flavor .level {
    font-family: var(--font-mono);
    font-size: .6875rem;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--ink-3);
    padding: .0625rem .25rem;
    border: 1px solid var(--rule);
    border-radius: 3px;
    text-align: center;
  }

  /* The safe default when the guest's situation is unconfirmed. */
  .flavor[data-level="experience"] .level {
    color: var(--d-medium);
    border-color: var(--d-medium);
  }

  .flavor .q { font-size: var(--step-1); }

  .beat .q { font-family: var(--font-read); line-height: 1.4; margin: 0; text-wrap: pretty; }

  .tone-note {
    display: flex;
    flex-direction: column;
    gap: .1875rem;
    padding: .5rem .75rem;
    border-left: 2px solid var(--d-medium);
    background: var(--surface-2);
    border-radius: 0 5px 5px 0;
    font-size: var(--step-0);
  }

  .tone-note b {
    font-family: var(--font-mono);
    font-size: .6875rem;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--d-medium);
  }

  .empty {
    padding: 3rem 1rem;
    text-align: center;
    color: var(--ink-3);
    font-size: var(--step-0);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 1.5rem;
    transform: translateX(-50%);
    padding: .5rem 1rem;
    background: var(--ink);
    color: var(--bg);
    border-radius: 999px;
    font-size: var(--step-0);
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
  }

  .toast.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  @media (max-width: 60rem) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    .rail { position: static; max-height: none; }
  }
</style>

<header class="masthead">
  <h1 class="wordmark"><span class="lamp" aria-hidden="true"></span> Ask Anyone</h1>
  <p class="tagline">Interview questions that land on any profession</p>
  <div class="controls">
    <label class="count" for="industry">Guest works in</label>
    <select id="industry"></select>
    <label class="count" for="role">as</label>
    <select id="role"></select>
    <div class="modes" role="group" aria-label="View">
      <button class="btn" type="button" id="mode-browse" aria-pressed="true">Browse</button>
      <button class="btn" type="button" id="mode-brief" aria-pressed="false">Brief</button>
      <button class="btn" type="button" id="mode-arc" aria-pressed="false">Arc</button>
    </div>
    <label class="count" for="anchoring" id="anchoring-label">Anchoring</label>
    <select id="anchoring"></select>
    <button class="btn" type="button" id="copy-all">Copy Markdown</button>
    <span class="count" id="count"></span>
  </div>
</header>

<div class="shell">
  <aside class="rail" id="rail">
    <div class="facet">
      <h2><label for="search">Search</label></h2>
      <input type="search" id="search" placeholder="money, failure, tacit…" autocomplete="off">
    </div>
    <div class="facet">
      <h2>Depth</h2>
      <div class="chips" id="facet-depth"></div>
    </div>
    <div class="facet">
      <h2>Stage</h2>
      <div class="chips" id="facet-arc"></div>
    </div>
    <div class="facet">
      <h2>Theme</h2>
      <div class="chips" id="facet-theme"></div>
    </div>
    <div class="facet">
      <h2>Scope</h2>
      <div class="chips">
        <button class="chip" type="button" id="only-industry" aria-pressed="false">Industry-specific only</button>
        <button class="chip" type="button" id="reset">Clear filters</button>
      </div>
    </div>
  </aside>

  <main class="results" id="results"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  const DATA = {"questions":[{"id":"u-open-01","text":"Walk me through yesterday. Not a typical day - yesterday specifically, from the moment you started working.","theme":"craft","arc":"opener","depth":"light","industries":["universal"],"lands_because":"Nobody has a rehearsed answer for a specific day. It produces texture, names, and small problems - which is the raw material for every follow-up in the episode.","followups":["What was the hardest twenty minutes of that?","Was that a normal day or were you dealing with something unusual?"],"tags":["specificity","warm","no-prep-needed"],"pack":"Openers"},{"id":"u-open-02","text":"What is the first thing you look at when you start work?","theme":"craft","arc":"opener","depth":"light","industries":["universal"],"lands_because":"Every profession has an instrument panel - a board, a queue, a chart, a market, a forecast. Naming it hands the audience the guest's frame of reference in one sentence.","followups":["What are you hoping not to see there?"],"tags":["ritual","concrete"],"pack":"Openers"},{"id":"u-open-03","text":"If I shadowed you for a week, what would surprise me most?","theme":"myths","arc":"opener","depth":"light","industries":["universal"],"lands_because":"Invites the guest to compare their reality against a civilian's expectation, which is exactly the gap the episode exists to close.","followups":["Is that surprising to people inside your field too, or just outsiders?"],"tags":["gap","audience-bridge"],"pack":"Openers"},{"id":"u-open-04","text":"What did you do this week that nobody outside your field would even recognize as work?","theme":"invisible","arc":"opener","depth":"light","industries":["universal"],"lands_because":"Surfaces the unglamorous substrate of the job early, and signals to the guest that you are interested in the real thing rather than the highlight reel.","followups":["How much of the job is that?"],"tags":["invisible-labor","signals-seriousness"],"pack":"Openers"},{"id":"u-open-05","text":"How do you describe your job to someone inside your field, versus how you describe it at a party?","theme":"myths","arc":"opener","depth":"light","industries":["universal"],"lands_because":"The distance between the two answers is usually the whole story, and the guest gets to be funny about it. Low risk, high yield.","followups":["Which one is closer to true?"],"tags":["identity","humor"],"pack":"Openers"},{"id":"u-open-06","text":"What is a tool you touch every single day that most people have never heard of?","theme":"craft","arc":"opener","depth":"light","industries":["universal"],"lands_because":"Objects and systems are easy to talk about and hard to be evasive about. Works equally for a torque wrench, a claims platform, a mixing desk, or a scheduling system.","followups":["Is it good? Would you design it differently?","What did people use before it?"],"tags":["objects","universally-answerable"],"pack":"Openers"},{"id":"u-open-07","text":"What time of year is hardest in your world, and what happens then?","theme":"craft","arc":"opener","depth":"light","industries":["universal"],"lands_because":"Nearly every profession has a crunch - harvest, close, Q4, testing season, storm season, camp, deployment workup. Asking about it shows you know work has a calendar.","followups":["What does the rest of your life look like during that stretch?"],"tags":["seasonality","crunch"],"pack":"Openers"},{"id":"u-open-08","text":"When you meet someone else who does what you do, what do you ask them?","theme":"craft","arc":"opener","depth":"light","industries":["universal"],"lands_because":"Hands you the insider question for free. Often the best question of the interview is the one they just told you they ask.","followups":["Ask me nothing - just tell me what a good answer to that sounds like."],"tags":["meta","question-mining","host-favorite"],"pack":"Openers"},{"id":"u-orig-01","text":"What did you think this job was, before you did it?","theme":"origin","arc":"warmup","depth":"medium","industries":["universal"],"lands_because":"Everyone was wrong about their own field once, and the shape of that wrongness is a fast route into what the job actually is.","followups":["When did you find out otherwise?"],"tags":["misconception","reliable"],"pack":"Origin & Path In"},{"id":"u-orig-02","text":"Did you choose this, or did it accumulate?","theme":"origin","arc":"warmup","depth":"medium","industries":["universal"],"lands_because":"Gives permission to skip the tidy origin myth. Most careers are drift plus one or two decisive accidents, and guests are usually relieved to be allowed to say so.","followups":["What was the accident?"],"tags":["anti-narrative","honest"],"pack":"Origin & Path In"},{"id":"u-orig-03","text":"Who was the first person you watched up close who was genuinely good at this?","theme":"origin","arc":"warmup","depth":"medium","industries":["universal"],"lands_because":"Craft transmits through people, not curricula. This produces a character, a scene, and an implicit definition of excellence all at once.","followups":["What did they do that you did not understand at the time?","Do you do it their way now, or did you break from it?"],"tags":["mentorship","character","story-generator"],"pack":"Origin & Path In"},{"id":"u-orig-04","text":"What did you have to unlearn from your training?","theme":"origin","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Every field has a gap between how it teaches and how it operates. Naming the gap is insider knowledge the guest can offer without betraying anyone.","followups":["Is the training still teaching that?"],"tags":["training-gap","expertise"],"pack":"Origin & Path In"},{"id":"u-orig-05","text":"Was there a point where you could have left and did not? What held you?","theme":"origin","arc":"deep","depth":"probing","industries":["universal"],"lands_because":"Reframes commitment as a decision rather than a destiny. Often the most emotionally honest moment available in the first half of an interview.","followups":["Do you think you made the right call?"],"avoid_if":"The guest has just described a current crisis - it will read as a suggestion that they quit.","tags":["commitment","vulnerable"],"pack":"Origin & Path In"},{"id":"u-orig-06","text":"Is the door into your field in the same place it was when you came through it?","theme":"change","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Credentialing, apprenticeship, and hiring norms have shifted in nearly every industry. Experienced guests have strong, specific opinions about this and rarely get asked.","followups":["Would you get hired today with the resume you had?","Is the new path better or just longer?"],"tags":["access","generational","strong-opinions"],"pack":"Origin & Path In"},{"id":"u-orig-07","text":"What did the first year cost you that nobody warned you about?","theme":"personal","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Specific, bounded, and usually never asked. Produces concrete detail about hazing, hours, money, or the body without requiring the guest to indict anyone.","followups":["Do people entering now still pay that?"],"tags":["entry-cost","candid"],"pack":"Origin & Path In"},{"id":"u-craft-01","text":"What separates someone with five years in from someone with twenty? Be specific - what can the twenty-year person actually do?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Forces expertise into observable behavior instead of adjectives. The demand for specificity is doing the work - without it you get 'experience' and 'judgment' and nothing else.","followups":["Can that be taught, or does it only come from repetition?","Is there anything the five-year person does better?"],"tags":["expertise","flagship","always-works"],"pack":"Craft & Expertise"},{"id":"u-craft-02","text":"What can you tell in the first ten minutes of a {work_unit} that a novice could not tell in a week?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Rapid pattern recognition is the signature of expertise in every field. Fill the slot from the industry profile - case, job, matter, load, story, service - and it sounds native.","followups":["What are you actually looking at when you make that read?"],"tags":["pattern-recognition","slotted","flagship"],"pack":"Craft & Expertise"},{"id":"u-craft-03","text":"What part of your job could you do exhausted, and what part genuinely requires you to be sharp?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Separates automated skill from live cognition, which is a distinction professionals feel acutely and are almost never invited to describe.","followups":["What happens when you have to do the sharp part while exhausted anyway?"],"tags":["automaticity","fatigue","underasked"],"pack":"Craft & Expertise"},{"id":"u-craft-04","text":"What is the hardest thing in your field to teach?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Points straight at the tacit core of the craft. Guests who train others have thought about this constantly and have examples ready.","followups":["How do you try anyway?","Who taught it to you well?"],"tags":["tacit-knowledge","teaching","flagship"],"pack":"Craft & Expertise"},{"id":"u-craft-05","text":"What is a rule everyone is taught that good people in your field break?","theme":"craft","arc":"deep","depth":"probing","industries":["universal"],"lands_because":"Gets at the difference between procedure and practice. The guest has to trust you before answering honestly, so place it after they have warmed up.","followups":["How do you know when you have earned the right to break it?","What happens to someone who breaks it too early?"],"avoid_if":"The guest works under a regulator or licensing body and the honest answer could expose them. Offer the escape hatch: 'or a rule you would keep but that people argue about.'","tags":["heterodoxy","trust-required","high-yield"],"pack":"Craft & Expertise"},{"id":"u-craft-06","text":"Teach me one thing from your field I could actually use tomorrow.","theme":"craft","arc":"core","depth":"light","industries":["universal"],"lands_because":"Turns the guest into a teacher, which is a comfortable and generous posture, and gives the audience a concrete takeaway to remember the episode by.","followups":["What do people usually get wrong when they try that?"],"tags":["takeaway","generous","audience-gift"],"pack":"Craft & Expertise"},{"id":"u-craft-07","text":"How do you know when a {work_unit} is finished? Who actually decides?","theme":"judgment","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Completion is contested in almost every profession - good enough versus perfect, and whether the decision belongs to the practitioner, the client, or the clock.","followups":["When was the last time you disagreed with that call?"],"tags":["standards","slotted","authority"],"pack":"Craft & Expertise"},{"id":"u-craft-08","text":"What do you notice about your {customer} that they have no idea you are noticing?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Every professional reads their counterpart for signals - a patient's gait, a client's hesitation, a buyer's questions, a room's energy. It feels like letting the audience behind the glass.","followups":["What does the signal usually mean?"],"tags":["reading-people","slotted","behind-the-curtain"],"pack":"Craft & Expertise"},{"id":"u-craft-09","text":"Is there a piece of your work you are quietly proud of that nobody would ever notice?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Invisible excellence is nearly universal - the clean wire run behind the drywall, the paragraph nobody had to reread, the handoff that prevented an incident. Warm and revealing at once.","followups":["Would another professional notice?"],"tags":["pride","warm","invisible-labor"],"pack":"Craft & Expertise"},{"id":"u-craft-10","text":"What does your field consider a good day, and do you agree with that definition?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"lands_because":"The second half is the whole question. It opens a gap between institutional metrics and personal standards without asking the guest to attack their employer.","followups":["What would your definition be?"],"tags":["metrics","values","safe-dissent"],"pack":"Craft & Expertise"},{"id":"u-judg-01","text":"Tell me about a call you had to make without enough information.","theme":"judgment","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Universal condition of professional work, and it lets the guest look competent while being honest about uncertainty. A reliable story generator.","followups":["What would you have needed to know to be sure?","Did you ever find out whether you were right?"],"tags":["uncertainty","story-generator","flagship"],"pack":"Judgment & Failure"},{"id":"u-judg-02","text":"What is a tradeoff you make constantly that would alarm an outsider?","theme":"judgment","arc":"deep","depth":"probing","industries":["universal"],"lands_because":"Every field rations something - time, attention, risk, care - and practitioners normalize it. Naming it out loud is genuinely revealing and often the clip that travels.","followups":["Is that the right tradeoff? What would it take to change it?"],"avoid_if":"You have not yet established that you understand the constraints they work under. Without that, the answer becomes a confession they will regret.","tags":["rationing","high-yield","trust-required"],"pack":"Judgment & Failure"},{"id":"u-judg-03","text":"What is more dangerous in your work - moving too fast or moving too slow? Has your answer changed over your career?","theme":"judgment","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Forces a real position rather than a both-sides answer, and the career-arc half invites reflection instead of defensiveness.","followups":["What changed your mind?"],"tags":["tempo","forces-position"],"pack":"Judgment & Failure"},{"id":"u-judg-04","text":"What does your gut tell you that you have learned to override? And what have you learned to trust?","theme":"judgment","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Intuition calibration is the interior experience of getting good at something, and the two-part structure keeps it from becoming a platitude about trusting yourself.","followups":["What taught you the difference?"],"tags":["intuition","calibration"],"pack":"Judgment & Failure"},{"id":"u-judg-05","text":"Who do you call when you are stuck?","theme":"people","arc":"core","depth":"light","industries":["universal"],"lands_because":"Small, easy, and it maps the informal expertise network that every profession runs on and no org chart shows.","followups":["What do they have that you do not?"],"tags":["networks","easy","warm"],"pack":"Judgment & Failure"},{"id":"u-fail-01","text":"What is a mistake you made early that you now watch for in other people?","theme":"failure","arc":"core","depth":"medium","industries":["universal"],"lands_because":"The safest possible entry into failure. It is framed as mentorship, it is safely in the past, and it almost always yields a real story rather than a sanitized one.","followups":["What did it cost at the time?"],"tags":["failure-entry","safe","always-works"],"pack":"Judgment & Failure"},{"id":"u-fail-02","text":"How does your field handle error? Is there a formal process, or does it just get absorbed?","theme":"failure","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Structural rather than personal, so it is easy to answer honestly - and the answers vary enormously. Aviation and medicine have formal review; most fields absorb error silently, and that contrast is itself the story.","followups":["Does the process work?","What happens to the person who made the error?"],"tags":["systems","structural","comparative"],"pack":"Judgment & Failure"},{"id":"u-fail-03","text":"Tell me about a near-miss - something that almost went badly and did not.","theme":"failure","arc":"deep","depth":"medium","industries":["universal"],"lands_because":"Near-misses carry the dramatic weight of failure without the shame of it, so guests tell them freely. Often the best story in the episode.","followups":["What caught it?","Did anything change afterward, or did everyone just move on?"],"tags":["story-generator","drama","safe"],"pack":"Judgment & Failure"},{"id":"u-fail-04","text":"When something goes wrong in your work, who finds out and who does not?","theme":"failure","arc":"deep","depth":"probing","industries":["universal"],"lands_because":"Goes at disclosure norms rather than at the guest personally. Reveals the accountability structure of an entire industry in one answer.","followups":["Should that be different?"],"tags":["disclosure","accountability","structural"],"pack":"Judgment & Failure"},{"id":"u-fail-05","text":"What is the cost of being wrong in your job, and who actually pays it?","theme":"failure","arc":"deep","depth":"probing","industries":["universal"],"lands_because":"The second clause is the sharp one. In some fields the practitioner pays; in others a patient, a client, a homeowner, or a taxpayer does. It surfaces the moral weight of the work directly.","followups":["Does that asymmetry change how carefully you work?"],"avoid_if":"The guest is currently facing litigation, an investigation, or a public incident.","tags":["stakes","moral-weight","high-yield"],"pack":"Judgment & Failure"},{"id":"u-fail-06","text":"Is there one you are still carrying?","theme":"failure","arc":"deep","depth":"probing","industries":["universal"],"lands_because":"Short, quiet, and unguarded. It works only as a follow-on, after the guest has already told you a failure story and found that you handled it well.","followups":[],"avoid_if":"Never open with this, and never ask it of a guest who has stayed guarded. If they deflect, let it go on the first deflection - pushing here costs you the rest of the interview.","tags":["deep","one-shot","handle-with-care"],"pack":"Judgment & Failure"},{"id":"u-ppl-01","text":"Who actually holds power in your organization, versus who is on the org chart?","theme":"people","arc":"deep","depth":"probing","industries":["universal"],"lands_because":"Every workplace has a shadow hierarchy - the scheduler, the senior tech, the office manager, the one partner everyone defers to. Naming it is insider knowledge that costs the guest nothing if kept general.","followups":["How did they get that power?"],"avoid_if":"The guest is a current executive at a named employer and the answer would identify a specific person.","tags":["hierarchy","shadow-power","high-yield"],"pack":"People, Power & Money"},{"id":"u-ppl-02","text":"What earns respect from your peers that would mean nothing to an outsider?","theme":"people","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Status systems are field-specific and invisible from outside. This is one of the fastest ways to make an audience feel like they understand a profession's internal culture.","followups":["And what impresses outsiders that your peers would roll their eyes at?"],"tags":["status","culture","flagship"],"pack":"People, Power & Money"},{"id":"u-ppl-03","text":"Who is the person everyone relies on who has no title reflecting it?","theme":"invisible","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Generous rather than critical - the guest gets to give credit publicly. Almost always produces a specific, vivid character.","followups":["What happens the week they are out?"],"tags":["credit","warm","character"],"pack":"People, Power & Money"},{"id":"u-ppl-04","text":"What is the split in your field that nobody outside knows about?","theme":"people","arc":"deep","depth":"probing","industries":["universal"],"lands_because":"Every profession has internal factions - methodological, generational, or regional - that are invisible externally and deeply felt internally. Guests enjoy explaining these.","followups":["Which side are you on?","What is the best argument for the other side?"],"tags":["factions","insider","debate"],"pack":"People, Power & Money"},{"id":"u-ppl-05","text":"Are the people who get promoted in your field the people who are best at the work?","theme":"people","arc":"deep","depth":"probing","industries":["universal"],"lands_because":"Almost universally answered 'no', and the explanation of what promotion actually selects for is where the interesting material is.","followups":["What does it select for instead? Is that entirely wrong?"],"tags":["advancement","candid","reliable-no"],"pack":"People, Power & Money"},{"id":"u-ppl-06","text":"What do you do when a {customer} wants something you believe is wrong for them?","theme":"ethics","arc":"core","depth":"medium","industries":["universal"],"lands_because":"The client-versus-judgment conflict exists for doctors, lawyers, contractors, designers, advisors, and agents alike. The slot makes it native to any of them.","followups":["Who wins, usually? Has that changed as you got more senior?"],"tags":["slotted","conflict","always-works"],"pack":"People, Power & Money"},{"id":"u-ppl-07","text":"What did a mentor tell you that turned out to be wrong?","theme":"people","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Lets the guest be independent-minded without disloyalty, and usually marks a real inflection point in how they think.","followups":["Was it wrong then, or did the field change under it?"],"tags":["mentorship","inflection"],"pack":"People, Power & Money"},{"id":"u-money-01","text":"Who pays for your work, and how does that shape it?","theme":"money","arc":"core","depth":"medium","industries":["universal"],"lands_because":"The single most clarifying question you can ask about any profession. The payer determines the incentives, and the incentives determine the work - in insurance, philanthropy, journalism, medicine, and research alike.","followups":["If a different party paid, what would change first?"],"tags":["incentives","flagship","clarifying"],"pack":"People, Power & Money"},{"id":"u-money-02","text":"What is the incentive in your field that produces the worst behavior?","theme":"money","arc":"deep","depth":"probing","industries":["universal"],"lands_because":"Structural framing lets a guest criticize their industry without naming a villain. Almost everyone has a ready answer they rarely get invited to give.","followups":["Does anyone benefit from keeping it that way?","Have you ever felt it pull on you?"],"tags":["incentives","critique","high-yield"],"pack":"People, Power & Money"},{"id":"u-money-03","text":"What do people in your job get paid for that is not actually the hard part?","theme":"money","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Exposes the mismatch between billable, visible work and the work that actually requires skill. Surgeons, consultants, designers, and mechanics all feel this and describe it differently.","followups":["What would it look like to pay for the hard part instead?"],"tags":["pricing","mismatch","underasked"],"pack":"People, Power & Money"},{"id":"u-money-04","text":"Is there part of your job that is economically irrational and you do it anyway?","theme":"money","arc":"deep","depth":"medium","industries":["universal"],"lands_because":"Where professional identity and economics come apart. The answer is usually the part of the job the guest cares about most, which makes it a doorway to something sincere.","followups":["What would have to change for you to stop?"],"tags":["values","sincere","identity"],"pack":"People, Power & Money"},{"id":"u-money-05","text":"What did you not understand about the money side of this when you started?","theme":"money","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Safe framing - past tense, self-directed - for a subject most guests are wary of. Works especially well with anyone who runs their own shop, practice, farm, or studio.","followups":["Who explained it to you, in the end?"],"tags":["business-literacy","safe-entry","self-employed"],"pack":"People, Power & Money"},{"id":"u-chg-01","text":"What has changed in your field in the last five years that people outside have not noticed at all?","theme":"change","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Rewards insider knowledge and produces genuinely new information for the audience. The 'not noticed' clause pushes past the obvious headline change.","followups":["Was it an improvement?"],"tags":["insider","news-value","flagship"],"pack":"Change & Ethics"},{"id":"u-chg-02","text":"What arrived in your field with enormous noise and turned out not to matter? And what arrived quietly and changed everything?","theme":"change","arc":"core","depth":"medium","industries":["universal"],"lands_because":"The two-part structure produces a real assessment rather than hype or dismissal, and it works in any field with a technology or methodology cycle - which is all of them.","followups":["What is being loud right now, and which category is it in?"],"tags":["hype-cycle","assessment","flagship"],"pack":"Change & Ethics"},{"id":"u-chg-03","text":"Is the work itself getting better or worse to do? Separate that from whether it pays better.","theme":"change","arc":"deep","depth":"medium","industries":["universal"],"lands_because":"The instruction to separate the two is what makes it good. Autonomy, pace, surveillance, and documentation load have moved independently of compensation in most fields, and guests feel that acutely.","followups":["What specifically made it worse? Or better?"],"tags":["autonomy","quality-of-work","high-yield"],"pack":"Change & Ethics"},{"id":"u-chg-04","text":"What is a rule, standard, or regulation that quietly reshaped your daily work?","theme":"change","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Regulation is invisible from outside and enormous from inside - a building code revision, a documentation requirement, a safety standard, a disclosure rule. Asking about it signals you know work has a legal substrate.","followups":["Was it a good rule badly implemented, or just a bad rule?"],"tags":["regulation","structural","signals-seriousness"],"pack":"Change & Ethics"},{"id":"u-chg-05","text":"What will someone entering your field in ten years never have to learn?","theme":"future","arc":"closer","depth":"medium","industries":["universal"],"lands_because":"Forward-looking and concrete rather than speculative. It also quietly surfaces what the guest thinks is being lost, without requiring nostalgia.","followups":["Does it matter that they will not know it?"],"tags":["succession","forward-looking"],"pack":"Change & Ethics"},{"id":"u-chg-06","text":"What is being lost as your field modernizes that is actually worth keeping?","theme":"change","arc":"deep","depth":"medium","industries":["universal"],"lands_because":"Gives permission for a conservative answer without making the guest sound like a reactionary. Frequently the most heartfelt moment in a change conversation.","followups":["Is anyone trying to keep it?"],"avoid_if":"The guest is a reformer or technologist whose whole position is that the old way was bad - it will read as a setup.","tags":["loss","heartfelt","nuance"],"pack":"Change & Ethics"},{"id":"u-eth-01","text":"Where is the gray zone in your work?","theme":"ethics","arc":"deep","depth":"probing","industries":["universal"],"lands_because":"Open enough that the guest chooses the terrain, which makes it far more answerable than a specific accusation. Nearly every profession has one and can describe it if asked neutrally.","followups":["How do you decide, in the moment?","Do your colleagues draw the line in the same place?"],"tags":["ethics-entry","open","safe-framing"],"pack":"Change & Ethics"},{"id":"u-eth-02","text":"What pressure exists in your field to cut a corner, and what does the corner actually look like?","theme":"ethics","arc":"deep","depth":"probing","industries":["universal"],"lands_because":"Asks about the structure of the pressure rather than the guest's compliance with it, so it can be answered without self-incrimination. The concrete second half prevents an abstract dodge.","followups":["Who notices when someone does?"],"avoid_if":"The guest is personally under scrutiny for exactly this.","tags":["pressure","structural","high-yield"],"pack":"Change & Ethics"},{"id":"u-eth-03","text":"Have you ever refused to do something? What happened?","theme":"ethics","arc":"deep","depth":"probing","industries":["universal"],"lands_because":"Casts the guest as the person with a line rather than the person being investigated, which is why it produces real answers where a direct ethics question produces none.","followups":["What did it cost you?"],"tags":["integrity","flattering-framing","story-generator"],"pack":"Change & Ethics"},{"id":"u-eth-04","text":"Who checks you?","theme":"ethics","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Three words, and it maps the entire oversight structure of a profession - board, regulator, inspector, editor, peer review, or nobody at all. The 'nobody' answers are the interesting ones.","followups":["Is that enough?","When did that check last actually catch something?"],"tags":["oversight","short","flagship"],"pack":"Change & Ethics"},{"id":"u-eth-05","text":"What is entirely legal and standard in your field that you think should not be?","theme":"ethics","arc":"deep","depth":"probing","industries":["universal"],"lands_because":"Invites reform-minded criticism rather than confession, so guests answer it willingly. Frequently generates the most quotable line of an episode.","followups":["What stops it from changing?"],"tags":["reform","quotable","high-yield"],"pack":"Change & Ethics"},{"id":"u-myth-01","text":"What do outsiders get most wrong about your work?","theme":"myths","arc":"core","depth":"light","industries":["universal"],"lands_because":"The most dependable question in the database. Every professional has this answer loaded and slightly irritated, and irritation makes for good audio.","followups":["Where do you think that idea came from?"],"tags":["dependable","easy","always-works"],"pack":"Myths, Invisible Work & Personal Cost"},{"id":"u-myth-02","text":"What does the film or television version of your job get wrong?","theme":"myths","arc":"warmup","depth":"light","industries":["universal"],"lands_because":"Fun, low-stakes, and reliably specific. Also works as a warmup before the harder version - what the field gets wrong about itself.","followups":["Is there one that gets it right?"],"tags":["fun","warmup","pop-culture"],"pack":"Myths, Invisible Work & Personal Cost"},{"id":"u-myth-03","text":"What does your own field tell the public about itself that is not quite true?","theme":"myths","arc":"deep","depth":"probing","industries":["universal"],"lands_because":"The hard version of the myth question, aimed inward instead of outward. Ask it right after the television version, while the guest is already in a debunking posture.","followups":["Why does the field need that story?"],"avoid_if":"The guest holds a public-facing or communications role for their industry - they cannot answer it honestly and will resent being asked.","tags":["self-critique","high-yield","sequenced"],"pack":"Myths, Invisible Work & Personal Cost"},{"id":"u-myth-04","text":"What question do you get constantly that tells you the person does not understand your job?","theme":"myths","arc":"warmup","depth":"light","industries":["universal"],"lands_because":"Doubles as reconnaissance - it tells you exactly which questions to avoid for the rest of the interview, and guests appreciate being asked by someone who clearly does not want to be that person.","followups":["What is the question they should be asking instead?"],"tags":["reconnaissance","meta","host-favorite"],"pack":"Myths, Invisible Work & Personal Cost"},{"id":"u-myth-05","text":"What is a compliment you get that is not really a compliment?","theme":"myths","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Sharp and specific. 'You must be so patient', 'you must have a gift', 'it must be so rewarding' - each one carries a misconception the guest can unpack.","followups":["What would an actual compliment be?"],"tags":["sharp","underasked"],"pack":"Myths, Invisible Work & Personal Cost"},{"id":"u-inv-01","text":"What share of your time is the thing people think your job is?","theme":"invisible","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Asking for a number forces precision, and the number is usually shockingly low. What fills the remainder is the actual subject of the episode.","followups":["What fills the rest?"],"tags":["quantified","invisible-labor","flagship"],"pack":"Myths, Invisible Work & Personal Cost"},{"id":"u-inv-02","text":"What is the unglamorous work that determines whether everything else succeeds?","theme":"invisible","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Preparation, maintenance, documentation, and follow-through are the hidden load-bearing structure of every profession, and practitioners are gratified when someone asks about them.","followups":["Does anyone measure or reward it?"],"tags":["maintenance","invisible-labor"],"pack":"Myths, Invisible Work & Personal Cost"},{"id":"u-inv-03","text":"What is in your job that is not in your job description?","theme":"invisible","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Catches the emotional labor, the mediation, the improvised social work that has crept into teaching, nursing, service, retail, and public-facing roles everywhere.","followups":["When did that become part of the job?"],"tags":["scope-creep","emotional-labor"],"pack":"Myths, Invisible Work & Personal Cost"},{"id":"u-pers-01","text":"What does this work cost you?","theme":"personal","arc":"deep","depth":"probing","industries":["universal"],"lands_because":"Direct, quiet, and unavoidable. Works only late, and works best when you then say nothing and let the pause run.","followups":["Is it worth it? Ask yourself honestly."],"avoid_if":"The guest has stayed formal throughout. A guarded guest will give you a platitude and you will have spent the question.","tags":["deep","silence-after","handle-with-care"],"pack":"Myths, Invisible Work & Personal Cost"},{"id":"u-pers-02","text":"Can a person do this job for thirty years? What happens to the ones who try?","theme":"personal","arc":"deep","depth":"probing","industries":["universal"],"lands_because":"The displacement onto 'the ones who try' lets the guest speak honestly about attrition, injury, and burnout without being asked to confess their own state.","followups":["What do the ones who last do differently?"],"tags":["sustainability","displaced","safe-framing"],"pack":"Myths, Invisible Work & Personal Cost"},{"id":"u-pers-03","text":"How do you come down after a hard day?","theme":"personal","arc":"core","depth":"medium","industries":["universal"],"lands_because":"Humane, easy, and it reveals the intensity of the work indirectly - the elaborateness of the ritual tells you what they are decompressing from.","followups":["Did anyone teach you that, or did you work it out?"],"tags":["warm","easy","humane"],"pack":"Myths, Invisible Work & Personal Cost"},{"id":"u-pers-04","text":"Would you want your kid to do this?","theme":"personal","arc":"closer","depth":"probing","industries":["universal"],"lands_because":"Compresses an entire assessment of a profession's future, dignity, and cost into one answer, and guests cannot give a talking point to it.","followups":["What would you want them to know first?"],"tags":["compressed","revealing","closer"],"pack":"Myths, Invisible Work & Personal Cost"},{"id":"u-pers-05","text":"When did you last finish a day and feel genuinely good about it?","theme":"personal","arc":"closer","depth":"medium","industries":["universal"],"lands_because":"Ends on something true and positive without being saccharine, and the specificity of the answer often summarizes everything the guest values about the work.","followups":["What made that one different?"],"tags":["warm","closer","summarizing"],"pack":"Myths, Invisible Work & Personal Cost"},{"id":"u-close-01","text":"What is a question you wish people asked you about your work?","theme":"craft","arc":"closer","depth":"medium","industries":["universal"],"lands_because":"Hands the guest the microphone and frequently produces the best two minutes of the episode. It also stocks your database - whatever they name, add it.","followups":["So answer it."],"tags":["question-mining","flagship","database-feeder"],"pack":"Closers & Pivots"},{"id":"u-close-02","text":"If you could change one thing about your field, what would it be?","theme":"future","arc":"closer","depth":"medium","industries":["universal"],"lands_because":"Standard but effective. It works better if you follow immediately with the constraint question, which is what turns an easy wish into a real analysis.","followups":["What is actually stopping that?"],"tags":["reform","standard","needs-followup"],"pack":"Closers & Pivots"},{"id":"u-close-03","text":"What are you still trying to get better at?","theme":"craft","arc":"closer","depth":"medium","industries":["universal"],"lands_because":"Works on the most senior guest in any field, and the answer is almost always more specific and more humble than expected.","followups":["How do you practice that?"],"tags":["humility","warm","always-works"],"pack":"Closers & Pivots"},{"id":"u-close-04","text":"Who should I talk to next, and what should I ask them?","theme":"craft","arc":"closer","depth":"light","industries":["universal"],"lands_because":"Books your next guest and writes the first question for that episode. The second clause is the valuable half - do not drop it.","followups":[],"tags":["booking","operational","database-feeder"],"pack":"Closers & Pivots"},{"id":"u-close-05","text":"What should someone who wants your job know that nobody tells them?","theme":"future","arc":"closer","depth":"medium","industries":["universal"],"lands_because":"Directs the guest's expertise at a real audience member rather than at the abstract public, which tends to make the advice concrete instead of inspirational.","followups":["What would you tell them not to worry about?"],"tags":["advice","concrete","audience-gift"],"pack":"Closers & Pivots"},{"id":"u-piv-01","text":"Let me ask that a different way - give me one specific instance.","theme":"craft","arc":"pivot","depth":"light","industries":["universal"],"lands_because":"The workhorse pivot. Abstraction is where evasion lives; a demand for one instance dissolves it without any confrontation.","followups":["When was that? Who else was in the room?"],"tags":["pivot","specificity","essential"],"pack":"Closers & Pivots"},{"id":"u-piv-02","text":"That is the answer you would give publicly. What is the more complicated one?","theme":"craft","arc":"pivot","depth":"probing","industries":["universal"],"lands_because":"Names the talking point without accusing the guest of dishonesty, and offers complexity as a flattering alternative. Delivered warmly, it usually works.","followups":[],"avoid_if":"You have used it once already in the episode, or the guest is genuinely constrained by legal or regulatory limits rather than being evasive.","tags":["pivot","unsticks","use-once","tone-dependent"],"pack":"Closers & Pivots"},{"id":"u-piv-03","text":"Who would disagree with what you just said, and what is their best argument?","theme":"judgment","arc":"pivot","depth":"medium","industries":["universal"],"lands_because":"Introduces conflict without you having to supply it, and asking for the opponent's *best* argument produces a much better answer than asking for the disagreement alone.","followups":["Where do they have a point?"],"tags":["pivot","steelman","conflict"],"pack":"Closers & Pivots"},{"id":"u-piv-04","text":"Can you put a number on that?","theme":"craft","arc":"pivot","depth":"light","industries":["universal"],"lands_because":"Converts vague scale claims - a lot, very fast, huge - into something the audience can hold. Five words and it sharpens any answer.","followups":["Is that typical, or was that an unusual one?"],"tags":["pivot","quantify","essential"],"pack":"Closers & Pivots"},{"id":"u-piv-05","text":"You said {phrase} - what does that actually look like on a Tuesday?","theme":"craft","arc":"pivot","depth":"light","industries":["universal"],"lands_because":"Takes jargon the guest used without noticing and grounds it in observable behavior. Fill the slot with their own words - the echo is what makes it land.","followups":[],"tags":["pivot","jargon","slotted","essential"],"pack":"Closers & Pivots"},{"id":"u-piv-06","text":"What am I not asking about that I should be?","theme":"craft","arc":"pivot","depth":"medium","industries":["universal"],"lands_because":"Works as a mid-episode reset when a line of questioning is not producing, and often redirects to the thing the guest actually came to talk about.","followups":["Take me into that."],"tags":["pivot","reset","question-mining"],"pack":"Closers & Pivots"},{"id":"aim-01","text":"When someone on your team uses AI on a {work_unit}, do you know? Is there a norm, or has everyone quietly decided for themselves?","theme":"people","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Disclosure norms are mostly unwritten, and the honest answer is usually 'I don't really know', which is a far more interesting starting point than any policy discussion.","followups":["Do you want to know, or is it better for you if you do not?","Has anyone told you after the fact?"],"tags":["ai","disclosure","flagship","slotted"],"pack":"AI & the Person in the Middle"},{"id":"aim-02","text":"Who on your team can now produce more than you can meaningfully review?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Names the review bottleneck, which is the most concrete and least discussed operational change AI has made to management. Output scaled; verification did not.","followups":["What do you do about it - trust, sample, or slow them down?","Has something gotten through that should not have?"],"tags":["ai","review-bottleneck","flagship","underasked"],"pack":"AI & the Person in the Middle"},{"id":"aim-03","text":"The work you used to hand a junior so they would learn from it - how much of that is gone, and what are you giving them instead?","theme":"people","arc":"deep","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"The apprenticeship pipeline ran on exactly the tasks AI now absorbs. Every thoughtful manager has noticed this and very few have been asked about it, so the answer tends to be unrehearsed.","followups":["How will someone become senior without that ladder?","Is anyone above you thinking about this, or is it landing entirely on you?"],"tags":["ai","apprenticeship","flagship","high-yield"],"pack":"AI & the Person in the Middle"},{"id":"aim-04","text":"What was the first thing you stopped doing yourself?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Small, concrete, and easy to answer honestly. The thing a manager handed over first says a lot about what they considered beneath their judgment - and sometimes they regret it.","followups":["Do you miss it? Did you lose anything by handing it over?"],"tags":["ai","concrete","easy"],"pack":"AI & the Person in the Middle"},{"id":"aim-05","text":"Have you used AI to write a performance review, or part of one? Where is your line?","theme":"ethics","arc":"deep","depth":"probing","industries":["universal"],"roles":["middle-manager"],"lands_because":"The sharpest live ethical question in management right now. It puts a real, specific decision in front of the guest rather than a policy abstraction, and there is no consensus answer to hide behind.","followups":["Would you tell the person you had?","Where else does that line sit - a reference, a layoff note, a condolence?"],"avoid_if":"The guest is currently in an HR dispute, or is speaking on behalf of an employer with a stated policy they would have to defend.","tags":["ai","ethics","flagship","high-yield"],"pack":"AI & the Person in the Middle"},{"id":"aim-06","text":"When AI-assisted work turns out to be wrong, who is accountable - the person who shipped it, you, or nobody?","theme":"failure","arc":"deep","depth":"probing","industries":["universal"],"roles":["middle-manager"],"lands_because":"Accountability has not been renegotiated even though the work has changed. The 'or nobody' option is what makes the question honest, and guests often pause on it.","followups":["Has that actually happened to you?","Did the answer hold up when it did?"],"tags":["ai","accountability","high-yield"],"pack":"AI & the Person in the Middle"},{"id":"aim-07","text":"What are you now expected to deliver faster because someone above you saw a demo?","theme":"change","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Names the expectation gap between executive demo and daily reality, which is the most consistently felt pressure in the middle. Guests recognize themselves immediately.","followups":["How do you manage that upward?","What did the demo leave out?"],"tags":["ai","expectation-gap","flagship"],"pack":"AI & the Person in the Middle"},{"id":"aim-08","text":"Are you measured on AI adoption? What does that number make you do that you would not otherwise?","theme":"money","arc":"deep","depth":"probing","industries":["universal"],"roles":["middle-manager"],"lands_because":"Adoption metrics create theater - seats filled, tools opened, usage logged - and the second clause invites the guest to describe the theater without having to denounce anyone.","followups":["Does the metric track anything you actually care about?"],"tags":["ai","incentives","metrics","high-yield"],"pack":"AI & the Person in the Middle"},{"id":"aim-09","text":"What did you have to stop doing to make room for the rollout work nobody budgeted for?","theme":"invisible","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Evaluation, training, policy interpretation, and hand-holding all landed on managers as unfunded work. Naming it as a tradeoff rather than a complaint gets a specific answer.","followups":["Who noticed that you stopped?"],"tags":["ai","invisible-labor","unfunded"],"pack":"AI & the Person in the Middle"},{"id":"aim-10","text":"Has anyone on your team asked you directly whether their job is safe? What did you say, and what were you actually thinking?","theme":"personal","arc":"deep","depth":"probing","industries":["universal"],"roles":["middle-manager"],"lands_because":"The two-part ending is the whole question. It separates what the manager was permitted to say from what they believed, which is the exact position of being in the middle.","followups":["Were you able to tell them the truth?"],"avoid_if":"The guest's organization is mid-layoff or has announced one. Ask it in the past tense about a previous role instead.","tags":["ai","emotional-labor","flagship","silence-after"],"pack":"AI & the Person in the Middle"},{"id":"aim-11","text":"You are being asked to champion the thing most often named as the reason there will be fewer managers. How do you hold both of those at once?","theme":"personal","arc":"deep","depth":"probing","industries":["universal"],"roles":["middle-manager"],"lands_because":"States the central contradiction of the role out loud. Ask it plainly and late; it produces either the most honest answer of the episode or a deflection that is itself revealing.","followups":["Do you believe the flattening argument?"],"avoid_if":"Early in the interview, or with a guest who has stayed in corporate-communications mode - you will get a talking point and spend the question for nothing.","tags":["ai","contradiction","flagship","handle-with-care"],"pack":"AI & the Person in the Middle"},{"id":"aim-12","text":"What can you no longer estimate?","theme":"judgment","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Five words, and it goes straight at a real breakage: generation got faster while review, integration, and correction did not, so the old estimates stopped working.","followups":["What do you tell people when they ask how long it will take?","Have you been badly wrong yet?"],"tags":["ai","estimation","short","flagship"],"pack":"AI & the Person in the Middle"},{"id":"aim-13","text":"How do you evaluate someone whose output is leveraged? Is the work theirs?","theme":"judgment","arc":"deep","depth":"probing","industries":["universal"],"roles":["middle-manager"],"lands_because":"Performance management has not caught up with leveraged output, and managers are improvising an answer privately. Asking makes them articulate a standard they have never written down.","followups":["Has that created a fairness problem between two people on your team?","What are you actually rewarding now?"],"tags":["ai","evaluation","fairness","high-yield"],"pack":"AI & the Person in the Middle"},{"id":"aim-14","text":"What has AI made worse in a way nobody wants to say out loud in a meeting?","theme":"change","arc":"deep","depth":"probing","industries":["universal"],"roles":["middle-manager"],"lands_because":"The 'in a meeting' clause gives explicit permission for the unsanctioned answer, which is what gets past the official optimism most organizations require.","followups":["What happens to the person who does say it?"],"tags":["ai","candid","permission-giving","high-yield"],"pack":"AI & the Person in the Middle"},{"id":"aim-15","text":"What does your team bring to you now that they used to solve themselves? Or is it the other way around?","theme":"people","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Escalation patterns are a sensitive instrument for what has actually changed in a team's confidence and autonomy, and the two-way framing avoids assuming the direction.","followups":["What does that tell you about how they are using it?"],"tags":["ai","autonomy","diagnostic"],"pack":"AI & the Person in the Middle"},{"id":"aim-16","text":"Where has this made your job more human rather than less?","theme":"change","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"A genuine question, not a softener - if administrative load actually dropped, the freed time went somewhere, and where it went is worth knowing. It also keeps the episode from being one-note.","followups":["Did that time really go to your people, or did it get filled?"],"tags":["ai","balance","sincere"],"pack":"AI & the Person in the Middle"},{"id":"aim-17","text":"What are you protecting your team from that they do not know about?","theme":"invisible","arc":"deep","depth":"probing","industries":["universal"],"roles":["middle-manager"],"lands_because":"The buffering function is the least visible and most defining part of being in the middle, and almost nobody asks about it directly.","followups":["What does it cost you to absorb that?"],"tags":["ai","buffering","the-middle","flagship"],"pack":"AI & the Person in the Middle"},{"id":"aim-18","text":"In five years, is there still a job that looks like yours?","theme":"future","arc":"closer","depth":"probing","industries":["universal"],"roles":["middle-manager"],"lands_because":"Direct, personal, and unanswerable with a platitude. A strong closer because it asks the guest to apply everything they have just said to themselves.","followups":["What would you tell someone about to take their first management job?"],"tags":["ai","closer","personal"],"pack":"AI & the Person in the Middle"},{"id":"ail-01","text":"What do managers ask you when there is no executive in the room?","theme":"people","arc":"core","depth":"medium","industries":["universal"],"roles":["ai-leader"],"lands_because":"Asks for observed reality rather than advice, and the framing quietly acknowledges that people say different things in different rooms. Almost always produces something specific.","followups":["What do they ask when an executive is in the room?","Which question do you find hardest to answer honestly?"],"tags":["ai","observation","flagship","high-yield"],"pack":"AI Leaders & Adoption Owners"},{"id":"ail-02","text":"What is your adoption metric, and what behavior does it produce that you do not want?","theme":"money","arc":"deep","depth":"probing","industries":["universal"],"roles":["ai-leader"],"lands_because":"Every adoption program has a number, and every number is gamed. Asking the owner of the metric to name its distortion is a real test of how honestly they hold their own program.","followups":["What would you measure instead if you could?","Does anyone above you want the honest number?"],"tags":["ai","metrics","incentives","flagship"],"pack":"AI Leaders & Adoption Owners"},{"id":"ail-03","text":"Tell me about a rollout that failed. Was it the tool or the organization?","theme":"failure","arc":"core","depth":"medium","industries":["universal"],"roles":["ai-leader"],"lands_because":"Concrete and past-tense, so it is safe to answer, and the either/or forces a diagnosis rather than a vague lesson-learned. Most honest answers are 'the organization', which opens everything else.","followups":["What did you do differently the next time?","Did anyone tell you it would fail beforehand?"],"tags":["ai","failure","diagnosis","flagship"],"pack":"AI Leaders & Adoption Owners"},{"id":"ail-04","text":"Where are you the source of the pressure managers feel, rather than the relief from it?","theme":"people","arc":"deep","depth":"probing","industries":["universal"],"roles":["ai-leader"],"lands_because":"Names the asymmetry that most interviews with AI leaders politely skip. Asked without hostility it is a serious question about their role, and a guest with self-awareness will meet it.","followups":["What have you changed because of that?"],"avoid_if":"You have not yet established that you take their work seriously - cold, it reads as an accusation rather than a question.","tags":["ai","asymmetry","flagship","trust-required"],"pack":"AI Leaders & Adoption Owners"},{"id":"ail-05","text":"What can you not promise them?","theme":"ethics","arc":"deep","depth":"probing","industries":["universal"],"roles":["ai-leader"],"lands_because":"Six words. It goes at the honesty of the whole adoption pitch - job security, quality, time savings - and there is no comfortable way to give a non-answer.","followups":["Do you say that part out loud in the town hall?"],"tags":["ai","short","honesty","flagship"],"pack":"AI Leaders & Adoption Owners"},{"id":"ail-06","text":"Who in the organization loses if this works exactly as you intend?","theme":"ethics","arc":"deep","depth":"probing","industries":["universal"],"roles":["ai-leader"],"lands_because":"Success, not failure, is the interesting case. It forces the guest to describe the intended consequences of their own program, which the optimistic framing usually leaves unsaid.","followups":["Is that being planned for, or just allowed to happen?"],"tags":["ai","consequences","sharp","high-yield"],"pack":"AI Leaders & Adoption Owners"},{"id":"ail-07","text":"What did you believe about this eighteen months ago that you no longer believe?","theme":"change","arc":"core","depth":"medium","industries":["universal"],"roles":["ai-leader"],"lands_because":"Updating publicly is high-status among serious practitioners and impossible for a hype merchant, so the answer tells you immediately which kind of guest you have.","followups":["What changed your mind - a result, or a person?"],"tags":["ai","calibration","guest-test","flagship"],"pack":"AI Leaders & Adoption Owners"},{"id":"ail-08","text":"What do you tell a manager whose team's AI-assisted work is genuinely faster and genuinely worse?","theme":"judgment","arc":"core","depth":"medium","industries":["universal"],"roles":["ai-leader"],"lands_because":"A specific, common, and uncomfortable case. Granting that both halves are true removes the escape route of disputing the premise.","followups":["Who gets to decide that the tradeoff is not worth it?"],"tags":["ai","quality","concrete","high-yield"],"pack":"AI Leaders & Adoption Owners"},{"id":"ail-09","text":"Tell me about a team that came out of a rollout more capable, and one that came out more afraid. What was actually different between them?","theme":"people","arc":"core","depth":"medium","industries":["universal"],"roles":["ai-leader"],"lands_because":"The paired structure is doing the work. Asking only about the good case invites a best-practices answer; requiring both forces a comparison grounded in two real teams.","followups":["Was the difference the manager, or something above the manager?","Could you tell in advance which it would be?"],"tags":["ai","paired","flagship","high-yield"],"pack":"AI Leaders & Adoption Owners"},{"id":"ail-10","text":"What is a manager now expected to be good at that was not part of the job three years ago?","theme":"change","arc":"core","depth":"medium","industries":["universal"],"roles":["ai-leader"],"lands_because":"Asks for an observed shift in the role rather than a recommended skill, which routes around the generic 'prompting and AI literacy' answer that the advice framing always produces.","followups":["Is anyone actually training them in that?","What did the job stop requiring?"],"tags":["ai","role-shift","anti-platitude","flagship"],"pack":"AI Leaders & Adoption Owners"},{"id":"ail-11","text":"What are you personally uncertain about that your position makes it hard to say publicly?","theme":"ethics","arc":"deep","depth":"probing","industries":["universal"],"roles":["ai-leader"],"lands_because":"Acknowledges the institutional constraint on the guest instead of pretending it is not there, which is often exactly what lets them set it aside for a moment.","followups":[],"avoid_if":"The guest is a vendor or is being media-trained for a launch. Save it for someone who has already been candid once.","tags":["ai","constraint","deep","handle-with-care"],"pack":"AI Leaders & Adoption Owners"},{"id":"ail-12","text":"How much of your job is the technology, and how much is managing people's fear?","theme":"invisible","arc":"core","depth":"medium","industries":["universal"],"roles":["ai-leader"],"lands_because":"Most people in these roles will say the split surprised them, and it reframes the whole conversation as being about organizations rather than tools.","followups":["Were you prepared for that part? Who trains you for it?"],"tags":["ai","emotional-labor","reframe"],"pack":"AI Leaders & Adoption Owners"},{"id":"wfl-01","text":"Where does AI actually live in your team's day - a separate window they go to, or inside the tool they already work in? What changed when it moved?","theme":"change","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager","ai-leader"],"lands_because":"Establishes the whole distinction in one question, in concrete terms the guest can answer from observation. The 'what changed' half is where the real material is - usage stops being voluntary and starts being ambient.","followups":["Did people notice the difference, or did it just become the tool?","Which one produces better work?"],"tags":["ai","workflow","embedded-ai","flagship"],"pack":"From Chat to Workflow"},{"id":"wfl-02","text":"When AI showed up inside a tool your team depends on, who chose how it behaves? Could you change it if you wanted to?","theme":"people","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager","ai-leader"],"lands_because":"Configuration is a management act that has quietly been assigned to IT, procurement, or a vendor's default. Most managers have never been asked whether they hold that lever, and discovering they do not is the point.","followups":["Who would you have to ask?","Has a default ever produced something you would not have approved?"],"tags":["ai","workflow","configuration","authority","flagship"],"pack":"From Chat to Workflow"},{"id":"wfl-03","text":"Did you make a step faster, or did you redesign the process? Be honest about which one you actually did.","theme":"judgment","arc":"deep","depth":"probing","industries":["universal"],"roles":["middle-manager","ai-leader"],"lands_because":"The central question of the whole subject, and the invitation to honesty is what makes it answerable. Almost everyone did the first thing while describing it as the second, and a good guest will admit it.","followups":["What stopped you from going further?","What would redesigning it actually have required?"],"tags":["ai","workflow","redesign","flagship","high-yield"],"pack":"From Chat to Workflow"},{"id":"wfl-04","text":"What step in your workflow exists only because the next step used to be expensive?","theme":"craft","arc":"deep","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"A genuinely structural question that works in any field - the pre-check before the costly run, the summary written so someone else need not read the whole thing. Naming one is the moment a guest sees their process as changeable rather than given.","followups":["Is that step still earning its place?","Who would object if you removed it?"],"tags":["ai","workflow","structural","flagship","underasked"],"pack":"From Chat to Workflow"},{"id":"wfl-05","text":"What does your team still do in a chat window that should be part of the workflow? Why has it not moved?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Points directly at the gap between individual habit and team process. The 'why not' half usually surfaces the real obstacle - nobody owns the process, or nobody has the authority to change the tool.","followups":["What would it take to move it?"],"tags":["ai","workflow","embedded-ai","flagship"],"pack":"From Chat to Workflow"},{"id":"wfl-06","text":"When the tool got faster, where did the work pile up instead?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Bottlenecks move, they do not disappear, and the place the queue reappeared - review, approval, a single person, a downstream team - is the most useful thing a manager can tell you.","followups":["Did anyone plan for that, or did you discover it?","Is the new bottleneck a person?"],"tags":["ai","workflow","bottleneck","flagship","high-yield"],"pack":"From Chat to Workflow"},{"id":"wfl-07","text":"If you could delete one handoff in your team's process, which one? Is that actually possible now?","theme":"change","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Handoffs are where time and context are lost in every industry. The second clause turns a complaint into a live design question, which is the shift you want the audience to make.","followups":["Whose job exists because of that handoff?"],"tags":["ai","workflow","handoffs","redesign"],"pack":"From Chat to Workflow"},{"id":"wfl-08","text":"Has the AI inside a tool you depend on changed unde
