-labor"],"pack":"Public Sector & Government"},{"id":"gov-06","text":"Why did you stay in public service?","theme":"personal","arc":"closer","depth":"medium","industries":["public-sector"],"lands_because":"Career civil servants have absorbed years of public contempt for their work. Asking sincerely, at the end, usually produces something genuinely moving.","followups":["What would it take for you to leave?"],"tags":["closer","sincere","warm"],"pack":"Public Sector & Government"},{"id":"re-01","text":"How many people can kill a deal, and which one usually does?","theme":"craft","arc":"core","depth":"medium","industries":["real-estate"],"lands_because":"Frames the job as chain management rather than salesmanship, which is accurate and immediately signals you understand the work.","followups":["Tell me about one that died at the eleventh hour."],"tags":["deal-mechanics","flagship","story-generator"],"pack":"Real Estate & Development"},{"id":"re-02","text":"How long does the paperwork take compared to the building?","theme":"invisible","arc":"core","depth":"medium","industries":["real-estate"],"lands_because":"Entitlement, zoning, financing, and approvals routinely dwarf construction timelines, and almost nobody outside the industry knows that.","followups":["What is the single longest thing you have waited on?"],"tags":["entitlement","signals-homework"],"pack":"Real Estate & Development"},{"id":"re-03","text":"What do you know about a property in the first five minutes that the listing will never say?","theme":"craft","arc":"core","depth":"medium","industries":["real-estate"],"lands_because":"Rapid assessment is real expertise here - drainage, orientation, deferred maintenance, the neighbors - and it makes great concrete audio.","followups":["What do buyers fixate on that does not matter?"],"tags":["assessment","vivid","audience-gift"],"pack":"Real Estate & Development"},{"id":"re-04","text":"Whose interests are you actually representing, and does the client understand that?","theme":"ethics","arc":"deep","depth":"probing","industries":["real-estate"],"lands_because":"Agency, dual agency, and commission incentives are structurally confusing to consumers, and a straight answer here is a real public service.","followups":["How does the commission structure pull on that?"],"tags":["agency","incentives","high-yield"],"pack":"Real Estate & Development"},{"id":"re-05","text":"What have you built or sold that you would not want to live in or next to?","theme":"ethics","arc":"deep","depth":"probing","industries":["real-estate"],"lands_because":"Personal-stake framing gets past the standard defense of the product. It is sharp, so save it for a guest who has been genuinely candid.","followups":["What would you have changed if the numbers had allowed?"],"avoid_if":"The guest is currently marketing that specific project.","tags":["sharp","candor-required","quality"],"pack":"Real Estate & Development"},{"id":"re-06","text":"What do people blame developers for that is actually a zoning or financing constraint?","theme":"myths","arc":"core","depth":"medium","industries":["real-estate"],"lands_because":"Lets a developer redirect blame toward structure rather than defend themselves, which produces a far more informative answer about how housing actually gets built.","followups":["And what do developers actually deserve blame for?"],"tags":["myth-correction","balanced","housing"],"pack":"Real Estate & Development"},{"id":"ret-01","text":"You are converting cash into a bet on what people will want months from now. How do you make that call?","theme":"judgment","arc":"core","depth":"medium","industries":["retail-ecommerce"],"lands_because":"Frames buying as the forecasting problem it actually is. Buyers rarely get treated as the risk-takers they are and respond well to it.","followups":["What did you get badly wrong, and what did you learn from it?"],"tags":["buying","forecasting","flagship"],"pack":"Retail & E-commerce"},{"id":"ret-02","text":"What happens to the inventory that does not sell?","theme":"money","arc":"core","depth":"medium","industries":["retail-ecommerce"],"lands_because":"Markdowns, liquidation, returns processing, and destruction are the industry's least examined and most consequential machinery.","followups":["How much of your margin does that quietly eat?"],"tags":["markdowns","underasked"],"pack":"Retail & E-commerce"},{"id":"ret-03","text":"What does a great store manager do that would not show up in any report?","theme":"craft","arc":"core","depth":"medium","industries":["retail-ecommerce"],"lands_because":"Treats store operations as skilled work - scheduling, training, de-escalation, floor sense - which the industry's own corporate side often fails to do.","followups":["Does the company know who those people are?"],"tags":["store-ops","respect","invisible-labor"],"pack":"Retail & E-commerce"},{"id":"ret-04","text":"What did you learn about your customers from returns that you never learned from sales?","theme":"craft","arc":"core","depth":"medium","industries":["retail-ecommerce"],"lands_because":"Returns are a rich and under-discussed data source, and the operational cost of them is a story in itself.","followups":["What have you changed because of it?"],"tags":["returns","underasked","data"],"pack":"Retail & E-commerce"},{"id":"ret-05","text":"What does the platform you sell on take from you, and what do you get for it?","theme":"money","arc":"deep","depth":"probing","industries":["retail-ecommerce"],"lands_because":"Marketplace and ad-spend dependency is the defining economic condition for most sellers, and the honest accounting is rarely offered publicly.","followups":["What happens to your business if those terms change?"],"tags":["platform-dependency","economics","high-yield"],"pack":"Retail & E-commerce"},{"id":"ret-06","text":"What have you watched customer behavior do in the last few years that surprised you?","theme":"change","arc":"core","depth":"medium","industries":["retail-ecommerce"],"lands_because":"Frontline retail is a genuine sensor for economic and social change, and operators notice patterns long before they appear in the data.","followups":["Do you think that is permanent?"],"tags":["consumer-behavior","sensor"],"pack":"Retail & E-commerce"},{"id":"sci-01","text":"What has not worked, and how long have you been at it?","theme":"failure","arc":"core","depth":"medium","industries":["science-research"],"lands_because":"Failure is the daily condition of research and asking about it directly is a relief rather than an insult. It also produces a real sense of scientific time.","followups":["How do you decide when to abandon a line of work?"],"tags":["failure","flagship","honest"],"pack":"Science & Research"},{"id":"sci-02","text":"How much of your week is science, and how much is applying for the ability to do science?","theme":"invisible","arc":"core","depth":"medium","industries":["science-research"],"lands_because":"The grant-writing load is enormous, universally resented, and rarely visible to the public. Naming it earns immediate credibility.","followups":["What is your funding hit rate?"],"tags":["grants","signals-homework","high-yield"],"pack":"Science & Research"},{"id":"sci-03","text":"What does your field reward that is not the same as what is true?","theme":"ethics","arc":"deep","depth":"probing","industries":["science-research"],"lands_because":"Novelty over replication, positive results over null results, volume over care. Researchers discuss this constantly among themselves and welcome an outsider who already knows.","followups":["Have you felt that pull on your own work?"],"tags":["incentives","structural","flagship"],"pack":"Science & Research"},{"id":"sci-04","text":"What is a result in your field that you privately doubt?","theme":"judgment","arc":"deep","depth":"probing","industries":["science-research"],"lands_because":"Gets at the informal reputational knowledge - whose data holds up - that never appears in the literature. Handle carefully; let them keep it general.","followups":["What would it take to settle it?"],"avoid_if":"The guest would have to name a specific rival or lab. Offer them the general version first.","tags":["replication","sharp","handle-with-care"],"pack":"Science & Research"},{"id":"sci-05","text":"How do you talk about uncertainty to people who want a yes or a no?","theme":"craft","arc":"core","depth":"medium","industries":["science-research"],"lands_because":"Science communication under pressure is a skill scientists have had to develop recently and painfully. It is timely without being political.","followups":["When did that go badly for you?"],"tags":["communication","timely"],"pack":"Science & Research"},{"id":"sci-06","text":"What question in your field would you most want answered, even if someone else answered it?","theme":"future","arc":"closer","depth":"medium","industries":["science-research"],"lands_because":"The 'even if someone else' clause moves past career positioning to genuine curiosity, and closes the episode on what drew them in.","followups":["What is standing in the way of it?"],"tags":["closer","curiosity","warm"],"pack":"Science & Research"},{"id":"trd-01","text":"How much of the job is the physical work, and how much is figuring out what is actually wrong?","theme":"craft","arc":"core","depth":"medium","industries":["skilled-trades"],"lands_because":"Reframes the trade as diagnostic work, which is how tradespeople see themselves and how outsiders almost never do. It changes the whole tenor of the interview.","followups":["What is the hardest diagnosis you have made?"],"tags":["diagnosis","reframe","flagship"],"pack":"Skilled Trades & Construction"},{"id":"trd-02","text":"What is the worst thing you have opened up a wall and found?","theme":"craft","arc":"warmup","depth":"light","industries":["skilled-trades"],"lands_because":"Every tradesperson has this story and enjoys telling it. Perfect early-episode material, and it establishes the improvisation the job requires.","followups":["Who did that, and were they licensed?"],"tags":["story-generator","fun","warmup"],"pack":"Skilled Trades & Construction"},{"id":"trd-03","text":"How do you price a job when you cannot know what you will find?","theme":"money","arc":"core","depth":"medium","industries":["skilled-trades"],"lands_because":"Bidding under uncertainty is the central business risk of the trades, and it is a genuinely interesting decision problem that nobody asks about.","followups":["When did you last eat a mistake on a bid?"],"tags":["pricing","business","underasked"],"pack":"Skilled Trades & Construction"},{"id":"trd-04","text":"What do you see on a job that tells you who worked on it before you, and what they were like?","theme":"craft","arc":"core","depth":"medium","industries":["skilled-trades"],"lands_because":"Reading another tradesperson's work is a form of connoisseurship, and hearing it described makes the audience see a building differently forever.","followups":["What will the next person say about your work?"],"tags":["connoisseurship","vivid","flagship"],"pack":"Skilled Trades & Construction"},{"id":"trd-05","text":"What is the code requirement you follow that customers fight you on?","theme":"ethics","arc":"core","depth":"medium","industries":["skilled-trades"],"lands_because":"Puts the guest in the position of the professional defending a standard against pressure, which is both accurate and flattering.","followups":["What happens when they go find someone who will?"],"tags":["standards","pressure","customer-conflict"],"pack":"Skilled Trades & Construction"},{"id":"trd-06","text":"What does this work do to a body over twenty years, and what are you doing about it?","theme":"personal","arc":"deep","depth":"probing","industries":["skilled-trades"],"lands_because":"The physical cost is universal in the trades and rarely discussed with outsiders. The second clause keeps it from being pitying.","followups":["Do the younger guys listen?"],"tags":["physical-cost","candid","sustainability"],"pack":"Skilled Trades & Construction"},{"id":"spt-01","text":"What does the work look like on a Tuesday in the off-season?","theme":"craft","arc":"core","depth":"medium","industries":["sports"],"lands_because":"Moves straight past the game to the repetition that actually constitutes the profession, which is what athletes and coaches mostly do and rarely get asked about.","followups":["What is the most tedious part that matters most?"],"tags":["preparation","anti-highlight","flagship"],"pack":"Sports & Athletics"},{"id":"spt-02","text":"What do you see on film that a knowledgeable fan watching the same play would miss?","theme":"craft","arc":"core","depth":"medium","industries":["sports"],"lands_because":"Specifying a knowledgeable fan raises the bar and produces genuine technical detail rather than a generic answer about hard work.","followups":["Teach me what to look for next time I watch."],"tags":["technical","audience-gift","flagship"],"pack":"Sports & Athletics"},{"id":"spt-03","text":"How do you manage knowing the career has a fixed end?","theme":"personal","arc":"deep","depth":"probing","industries":["sports"],"lands_because":"Career brevity shapes everything - money, injury decisions, identity - and athletes think about it constantly while mostly being asked about the next game.","followups":["What are you building for after?"],"tags":["career-length","identity","high-yield"],"pack":"Sports & Athletics"},{"id":"spt-04","text":"What is the injury decision you have made that you would make differently now?","theme":"judgment","arc":"deep","depth":"probing","industries":["sports"],"lands_because":"Playing through injury sits at the intersection of pressure, money, and medical advice. It is honest and concrete without requiring the guest to blame anyone.","followups":["Who was in your ear at the time?"],"avoid_if":"The guest is currently in a contract negotiation or dealing with an active injury.","tags":["injury","pressure","candid"],"pack":"Sports & Athletics"},{"id":"spt-05","text":"What does the locker room know about a teammate that the coaching staff does not?","theme":"people","arc":"deep","depth":"medium","industries":["sports"],"lands_because":"Information asymmetry inside a team is real and fascinating, and it can be answered in general terms without betraying anyone.","followups":["Should the staff know?"],"tags":["team-dynamics","insider"],"pack":"Sports & Athletics"},{"id":"spt-06","text":"What do you understand about the business of this sport now that you did not at the start?","theme":"money","arc":"core","depth":"medium","industries":["sports"],"lands_because":"Contracts, agents, media obligations, and revenue structures are a genuine education athletes acquire the hard way, and it moves the interview off the field.","followups":["What do you tell younger players about it?"],"tags":["business","candid"],"pack":"Sports & Athletics"},{"id":"tech-01","text":"What is the oldest system you depend on, and what happens when it finally goes?","theme":"craft","arc":"core","depth":"medium","industries":["technology"],"lands_because":"Legacy dependency is the actual condition of the industry and almost never the subject of an interview. It produces both a great story and a real insight.","followups":["Does anyone still understand it?"],"tags":["legacy","underasked","flagship"],"pack":"Technology"},{"id":"tech-02","text":"Walk me through an incident. Not the postmortem version - what the first twenty minutes actually felt like.","theme":"failure","arc":"core","depth":"medium","industries":["technology"],"lands_because":"Rejecting the sanitized postmortem is what unlocks it. Incident response is genuinely dramatic and technologists rarely get asked for the experience rather than the writeup.","followups":["Who was in the channel, and who should have been?","What did the postmortem leave out?"],"tags":["incidents","drama","anti-narrative"],"pack":"Technology"},{"id":"tech-03","text":"What technical decision are you living with that you would make differently now?","theme":"judgment","arc":"core","depth":"medium","industries":["technology"],"lands_because":"Technical debt as autobiography. Engineers are unusually honest about this because owning a bad call is high-status among peers.","followups":["Was it wrong then, or only wrong later?"],"tags":["tech-debt","honest","reliable"],"pack":"Technology"},{"id":"tech-04","text":"What does your team spend time on that produces no visible output but would be catastrophic to stop?","theme":"invisible","arc":"core","depth":"medium","industries":["technology"],"lands_because":"Names the maintenance and reliability work that never appears in a roadmap or a launch post, which is most of what keeps software alive.","followups":["How do you justify that work upward?"],"tags":["maintenance","invisible-labor"],"pack":"Technology"},{"id":"tech-05","text":"Where in your work does the current wave of AI tooling actually help, and where does it quietly create work?","theme":"change","arc":"core","depth":"medium","industries":["technology"],"lands_because":"The two-sided framing gets past both boosterism and dismissal to a practitioner's real ledger, which is what listeners actually want.","followups":["What has it changed about how you hire or train juniors?"],"tags":["ai","balanced","current"],"pack":"Technology"},{"id":"tech-06","text":"Who in your organization can veto an engineering decision, and should they be able to?","theme":"people","arc":"deep","depth":"probing","industries":["technology"],"lands_because":"Gets at the real authority structure between engineering, product, security, and legal - the source of most of the frustration and most of the interesting stories.","followups":["Tell me about a time that veto was right."],"tags":["authority","org-dynamics"],"pack":"Technology"}],"profiles":[{"slug":"healthcare","label":"Healthcare & Medicine","vocabulary":{"craft":"clinical practice","work_unit":"case","peer":"colleague","customer":"patient","bad_outcome":"adverse event","crunch":"bad night in the ED"},"status_axis":"Specialty prestige, procedural skill, and how calm you are in a code. Publishing matters in academic settings and almost nowhere else.","earns_trust":"Knowing that documentation and prior authorization eat more of the day than medicine does. Distinguishing what the clinician controls from what the system imposes.","landmines":["Asking for a specific patient story without noting that they should keep it de-identified.","Treating 'burnout' as a personal resilience failure rather than a workload and autonomy problem.","Assuming doctors set prices or control billing."],"also_called":["encounter","consult","the unit","attending","resident"]},{"slug":"law","label":"Law","vocabulary":{"craft":"practice","work_unit":"matter","peer":"opposing counsel","customer":"client","bad_outcome":"adverse ruling","crunch":"week before trial"},"status_axis":"Firm tier and partnership track in private practice; trial record in litigation; clerkships early on. Public-interest lawyers run an entirely different status game.","earns_trust":"Understanding that most litigation never reaches trial and most transactional work is risk allocation, not argument. Knowing privilege limits what they can tell you.","landmines":["Asking them to comment on a live matter.","Conflating 'defended someone guilty' with a moral failure - it is the job and they have answered it a thousand times.","Assuming every lawyer goes to court."],"also_called":["case","deal","the bench","associate","partner","discovery"]},{"slug":"finance","label":"Finance & Insurance","vocabulary":{"craft":"the book","work_unit":"deal","peer":"the desk","customer":"client","bad_outcome":"blowup","crunch":"quarter close"},"status_axis":"P&L attribution and proximity to risk-taking. Being right when consensus was wrong is the currency; being right with consensus counts for little.","earns_trust":"Asking about process rather than picks. Recognizing compliance constraints on what they can say about positions or clients.","landmines":["Asking for stock tips or current positioning - it can be a regulatory problem, not just a dodge.","Treating all of finance as one job. A claims adjuster, a quant, and a CFP share almost nothing.","Assuming high pay means the work is easy or the person is unserious."],"also_called":["position","trade","mandate","counterparty","drawdown","market dislocation"]},{"slug":"technology","label":"Technology","vocabulary":{"craft":"engineering","work_unit":"project","peer":"teammate","customer":"user","bad_outcome":"outage","crunch":"launch week"},"status_axis":"Scope of systems owned and technical judgment respected by peers. Titles are noisy across companies and everyone knows it.","earns_trust":"Asking about maintenance, migration, and legacy systems rather than only about the new and shiny.","landmines":["Assuming everyone in tech is a startup founder or wants to be.","Asking 'how do I learn to code' as a substitute for a real question.","Treating the last eighteen months of AI news as the whole of the field."],"also_called":["ticket","sprint","service","on-call","incident","postmortem"]},{"slug":"manufacturing","label":"Manufacturing","vocabulary":{"craft":"the process","work_unit":"run","peer":"operator","customer":"buyer","bad_outcome":"line-down","crunch":"changeover"},"status_axis":"Being the person who can actually fix the machine. Tenure on a specific line is real authority regardless of title.","earns_trust":"Knowing that yield, takt time, and scrap are the daily scoreboard, and that a plant runs on relationships between the floor and the office.","landmines":["Nostalgia framing - treating manufacturing as a museum piece rather than a live, automated, technical field.","Assuming offshoring is a simple cost decision.","Talking to a plant manager as if they set the product roadmap."],"also_called":["lot","batch","the line","the OEM","recall","scrap","takt time","launch build"]},{"slug":"skilled-trades","label":"Skilled Trades & Construction","vocabulary":{"craft":"the trade","work_unit":"job","peer":"crew member","customer":"homeowner","bad_outcome":"callback","crunch":"hard deadline"},"status_axis":"Clean work that holds up, and the ability to solve a problem nobody else on site can. License level and years in matter; formal education does not.","earns_trust":"Asking about the parts of the job that are diagnosis rather than labor. Acknowledging the body cost and the business side of running a small shop.","landmines":["Framing the trades as a fallback for people who could not do college.","Assuming the work is unskilled repetition rather than constant improvisation against old buildings.","Asking for free advice about your own house instead of asking about their work."],"also_called":["punch list","the crew","the GC","the inspector","rough-in","warranty call"]},{"slug":"agriculture","label":"Agriculture & Food Production","vocabulary":{"craft":"the operation","work_unit":"season","peer":"neighbor","customer":"buyer","bad_outcome":"lost crop","crunch":"harvest"},"status_axis":"Land stewardship over generations, and yields nobody had to bail you out for. Debt discipline is quietly the whole game.","earns_trust":"Understanding that they are price takers, not price setters, and that weather, commodity markets, and input costs are three separate risks.","landmines":["Casual moralizing about industrial versus organic without knowing their economics.","Assuming farming is low-technology.","Treating subsidies as a handout without asking how the program actually works."],"also_called":["field","herd","the co-op","the processor","calving","planting window"]},{"slug":"education","label":"Education","vocabulary":{"craft":"teaching","work_unit":"unit","peer":"colleague","customer":"student","bad_outcome":"losing a kid","crunch":"testing season"},"status_axis":"Respect from other teachers, which is earned by classroom management and results with hard students - not by administration's metrics.","earns_trust":"Distinguishing the teaching from the paperwork, the policy, and the parenting the job now absorbs.","landmines":["'Those who can't do, teach' energy in any form.","Assuming test scores measure the thing they care about.","Asking a teacher to speak for all of education policy."],"also_called":["lesson","semester","the department","families","IEP","the first three weeks"]},{"slug":"hospitality","label":"Hospitality & Food Service","vocabulary":{"craft":"service","work_unit":"service","peer":"line cook","customer":"guest","bad_outcome":"comped table","crunch":"a Saturday double"},"status_axis":"Consistency under volume. Anyone can cook one great plate; running four hundred covers without a miss is the flex.","earns_trust":"Knowing the margins are thin, the labor math is brutal, and the romantic chef narrative is mostly a media product.","landmines":["Asking about their 'passion for food' as an opener - it is the most exhausted question in the industry.","Ignoring the back-of-house, or ignoring the front-of-house.","Assuming a full restaurant means a profitable one."],"also_called":["shift","cover","the pass","front of house","back of house","a full book"]},{"slug":"logistics","label":"Logistics & Supply Chain","vocabulary":{"craft":"the network","work_unit":"load","peer":"carrier","customer":"shipper","bad_outcome":"missed delivery window","crunch":"peak season"},"status_axis":"Knowing where the real constraint is before anyone else does, and having the relationships to get capacity when there is none.","earns_trust":"Understanding that the job is exception handling, not planning, and that most of the system runs on phone calls and trust.","landmines":["Assuming 2020-21 was the first time supply chains were hard.","Treating drivers as interchangeable labor when talking to anyone who has driven.","Believing software solved this."],"also_called":["lane","shipment","the broker","the driver","dwell time","detention"]},{"slug":"energy","label":"Energy & Utilities","vocabulary":{"craft":"operations","work_unit":"project","peer":"lineman","customer":"ratepayer","bad_outcome":"unplanned outage","crunch":"storm restoration"},"status_axis":"Safety record and reliability. In this field, an uneventful career is the mark of excellence, which is hard to talk about on a podcast.","earns_trust":"Separating the engineering from the politics. Knowing that regulated utilities cannot simply choose what to build.","landmines":["Asking someone to defend or attack their entire sector as a proxy for climate politics.","Assuming the grid is a single thing rather than interconnections, markets, and regulators.","Underestimating how much of the job is permitting."],"also_called":["outage","the control room","offtaker","interconnection queue","peak load day"]},{"slug":"creative-arts","label":"Creative Arts","vocabulary":{"craft":"the work","work_unit":"piece","peer":"collaborator","customer":"audience","bad_outcome":"a piece that died","crunch":"deadline"},"status_axis":"Peer respect and the ability to keep making work. Commercial success is real but sits uneasily next to it.","earns_trust":"Asking about process and revision rather than inspiration. Taking the business side seriously - rights, royalties, and who owns what.","landmines":["'Where do you get your ideas' in any phrasing.","Assuming they can live on the art alone, or assuming they cannot.","Asking them to explain the meaning of a specific work as if there is an answer key."],"also_called":["record","project","commission","the client","the gallery","release week"]},{"slug":"media-journalism","label":"Media & Journalism","vocabulary":{"craft":"reporting","work_unit":"story","peer":"editor","customer":"reader","bad_outcome":"correction","crunch":"breaking news cycle"},"status_axis":"Scoops and sourcing. Being first and right. Beat expertise ages into authority.","earns_trust":"Understanding sourcing rules and why they will not burn one. Knowing the business model collapse is not an abstraction to them.","landmines":["Asking them to reveal a source, even hypothetically.","Treating 'the media' as a monolith with a single agenda.","Assuming reporters write their own headlines."],"also_called":["piece","the desk","subscriber","source","the spike","close"]},{"slug":"nonprofit","label":"Nonprofit & Social Impact","vocabulary":{"craft":"the program","work_unit":"program year","peer":"partner organization","customer":"participant","bad_outcome":"a program that did not move the needle","crunch":"reporting deadline"},"status_axis":"Proximity to the actual work versus proximity to the money - and the tension between the two is a live wire worth pulling.","earns_trust":"Knowing that funder priorities distort programs, and that overhead ratios are a bad metric everyone is forced to perform.","landmines":["Assuming low pay means the work is not professionalized.","Framing beneficiaries as passive recipients.","Treating impact measurement as simple."],"also_called":["grant cycle","the community served","the funder","the board","funding cliff"]},{"slug":"public-sector","label":"Public Sector & Government","vocabulary":{"craft":"administration","work_unit":"case","peer":"colleague","customer":"constituent","bad_outcome":"process failure","crunch":"end of fiscal year"},"status_axis":"Institutional memory and the ability to make the machine actually move. Career staff quietly outlast appointees and know it.","earns_trust":"Understanding that constraints are statutory, not chosen, and that 'why don't you just' has an answer that is usually a law.","landmines":["Lazy bureaucrat framing.","Asking a civil servant to comment on elected officials or partisan politics - many genuinely cannot.","Assuming they have discretion they do not have."],"also_called":["permit","docket","the agency","the regulated party","legislative session"]},{"slug":"retail-ecommerce","label":"Retail & E-commerce","vocabulary":{"craft":"merchandising","work_unit":"season","peer":"store manager","customer":"shopper","bad_outcome":"dead inventory","crunch":"Q4"},"status_axis":"A buyer's instinct that turns into sell-through. In stores, the manager who can run a holiday weekend without drama.","earns_trust":"Knowing inventory is the whole business - cash converted into guesses about the future - and that returns and shrink quietly eat margin.","landmines":["Retail apocalypse framing.","Assuming store work is unskilled.","Talking about brand while ignoring unit economics, or the reverse."],"also_called":["drop","assortment","the vendor","the buyer","stockout","shrink","sell-through"]},{"slug":"real-estate","label":"Real Estate & Development","vocabulary":{"craft":"the deal","work_unit":"transaction","peer":"broker","customer":"buyer","bad_outcome":"a deal that dies at closing","crunch":"closing"},"status_axis":"Deals closed and capital raised. In development, what you have actually built and whether it still stands up.","earns_trust":"Knowing that entitlement and financing take longer than construction, and that most of the work is managing a chain of people who can each kill the deal.","landmines":["Treating agents as glorified door openers.","Assuming developers control zoning or timelines.","Asking for market predictions as the main event."],"also_called":["project","the asset","tenant","investor","entitlement","capital call"]},{"slug":"science-research","label":"Science & Research","vocabulary":{"craft":"the science","work_unit":"study","peer":"collaborator","customer":"the field","bad_outcome":"a result that will not replicate","crunch":"grant deadline"},"status_axis":"Publication venue and citation, plus a quieter reputation for whose data holds up. Grant funding is survival and everyone knows the ratio.","earns_trust":"Understanding that most of research is failed experiments and grant writing, and that the incentive structure is a known and painful topic.","landmines":["Asking for certainty they will not give.","Treating one preprint as settled science.","Assuming a PI still does bench work."],"also_called":["experiment","paper","the lab","reviewer","the funder","submission window"]},{"slug":"sports","label":"Sports & Athletics","vocabulary":{"craft":"the game","work_unit":"season","peer":"teammate","customer":"the organization","bad_outcome":"injury","crunch":"the playoff run"},"status_axis":"Performance under scrutiny, and the locker-room read on whether you are a pro. Contracts are public and that shapes everything.","earns_trust":"Asking about preparation, film, and the boring repetition rather than only the highlight. Taking the labor and business side seriously.","landmines":["Asking an athlete to relive a career-defining failure without warning.","Treating the body as a machine and ignoring the career-length anxiety.","Assuming coaches control roster decisions."],"also_called":["game","camp","the staff","the fans","film session","the trade deadline"]},{"slug":"defense-military","label":"Defense & Military","vocabulary":{"craft":"the mission","work_unit":"deployment","peer":"unit member","customer":"the command","bad_outcome":"mission failure","crunch":"deployment workup"},"status_axis":"Competence under load and what you did for the people next to you. Rank is formal authority; reputation in the unit is the real one.","earns_trust":"Knowing the difference between what is classified, what is sensitive, and what is simply not yours to ask. Asking about the job, not the war stories.","landmines":["'Did you ever kill anyone.' Never.","Thank-you-for-your-service framing as a substitute for a real question.","Assuming combat arms is the whole military - most of it is logistics, maintenance, and administration."],"also_called":["operation","the unit","the taxpayer","casualty","rotation","field exercise"]}],"arcs":[{"arc":"ai-workflow-partner","title":"AI as a Workflow Partner","goal":"Leave a manager listening with the sense that the thing they hold - an accumulated feel for how the work actually goes, exercised daily and written down nowhere - is the scarce input that makes any of this work, and that they are the natural architect of it rather than its subject.","audience":"Managers in any field whose judgment has been exercised constantly and solicited rarely.","runs":"About seventy minutes at seventeen beats. For a forty-five minute cut, drop the beats carrying no spine theme - first-thing-that-stuck, where-it-falls-down, the-team-conversation and where-the-work-piled-up - which leaves the four required themes intact.","house_rules":["Open on the week, not on the technology. If the first question contains the word AI, the listener braces.","Assume competence in the premise. Ask how they decided, not whether they have considered it.","Push every abstract answer down to one task. A platform is not a story; 'I stopped writing the Friday roll-up' is.","When they name an unwritten rule, slow down and get it said precisely. That sentence is the thesis of the show made concrete.","Take the honest limits beat seriously. An unqualified pitch costs the audience's trust for everything after it.","Never ask how to make a team feel supported - it produces a change-management answer. Ask what the team actually said.","No catch-up urgency, and no deficit framing. The listener finishes thinking 'I could try that on Monday', never 'I am already too far behind.'"],"anchoring":{"$comment":"The four flavors of every beat, ordered by how much they presuppose about the guest's current situation. This is the axis that makes an arc survive a guest whose circumstances turned out to be different from what you were told.","current":"Assumes they are in the seat right now and can speak freely about it. Most vivid, most fragile - it breaks if they have left, are between roles, or cannot discuss a current employer.","experience":"Draws on their own history without requiring a current employer. Still personal and specific. The safe default when you are not certain, and the flavor to reach for mid-interview when something surprises you.","observed":"About what they have watched others do. Works for consultants, vendors, advisors, and anyone who has just moved on. Requires no personal exposure at all.","general":"Principle only. Works even when the guest cannot discuss any specifics for legal or professional reasons. Least vivid - do not run a whole episode here."},"beats":[{"beat":"the-week","title":"The recognizable week","theme":"invisible","covers":[],"purpose":"Ground the episode in a working reality before any technology enters it, so the audience meets a peer rather than an evangelist.","listener_payoff":"Recognition. They hear their own week described by someone else.","keep_it_approachable":"No mention of AI in this question at all. The whole beat exists to establish that the guest has the same week the listener does.","flavors":{"current":"Walk me through last week. Where did the time actually go?","experience":"Think about a week when you were closest to the work. Where did the time actually go?","observed":"When you sit down with managers and map out their week, where does the time actually go?","general":"What does a manager's week actually consist of, once you strip out what the job description says?"},"followups":["How much of that was the work, and how much was moving the work along?","Which part of that would you hand to someone else tomorrow if you could?"],"if_it_stalls":"Pick one day. Tuesday. Start at the beginning of it."},{"beat":"first-thing-that-stuck","title":"The first thing that stuck","theme":"craft","covers":[],"purpose":"The concrete small win. One unglamorous task, handed over, and kept.","listener_payoff":"A specific first move they could picture themselves making.","keep_it_approachable":"Push until the answer is one task. If you get a platform, a strategy, or a maturity model, ask again. The distinction between 'tried' and 'never took back' is what separates real adoption from experimentation.","flavors":{"current":"What is the first thing you handed over and never took back?","experience":"What was the first thing you handed over that actually stuck?","observed":"When this works for someone, what is the thing that tends to stick?","general":"What is the first thing that usually sticks - not the first thing people try, the first thing that lasts?"},"followups":["How long before you stopped double-checking it?","What did you try before that, that did not stick?"],"if_it_stalls":"Not the impressive one. The boring one you would be slightly embarrassed to admit."},{"beat":"the-sentence-you-repeat","title":"The sentence you have said a hundred times","theme":"craft","covers":["natural-language-os"],"purpose":"Open the natural language idea from something they already do every week - the explanation they have given to every new person - rather than from anything that sounds technical.","listener_payoff":"The realization that they have been writing specifications for years and calling it explaining things.","keep_it_approachable":"The point they should arrive at is that the explanation is the configuration. Let them get there themselves; do not announce it. Use their words - explaining, telling, showing someone - never prompting.","flavors":{"current":"What is the thing you find yourself explaining over and over to people on your team?","experience":"What was the explanation you gave every new person - the one you could give in your sleep?","observed":"When someone new joins a team like the ones you work with, what is the thing they always have to be told?","general":"What is the explanation every newcomer in this kind of work needs, that is written down nowhere?"},"followups":["How long did it take you to work that out for yourself?","If a system absorbed that one explanation, what would change on Monday?"],"if_it_stalls":"What do you say in the handover, every single time, that is not in any document?"},{"beat":"who-writes-the-rules","title":"Who writes the rules","theme":"people","covers":["natural-language-os"],"purpose":"Name plainly that the people who configured the software have generally never done the job, and that the pen is moving.","listener_payoff":"Recognition of something they have felt for years and rarely heard said, followed by the case that it is changing.","keep_it_approachable":"Ask it evenly, not indignantly. Anger is not the register here - recognition is. Let the guest supply whatever feeling it carries.","flavors":{"current":"Who writes the rules the software follows in your organization? Have they ever done the job?","experience":"In the systems you have worked under, who wrote the rules? Had they done the work themselves?","observed":"Who typically writes the rules a team's software enforces, and how close are they to the work?","general":"Who has historically decided how work software behaves, and how close were they to the actual work?"},"followups":["What would you have changed, if anyone had asked you?","Is that changing? What would have to be true for the pen to move?"],"if_it_stalls":"Think about the last system that arrived fully formed. Who decided how it would work?"},{"beat":"the-rule-that-sounds-simple","title":"The rule that sounds simple","theme":"judgment","covers":["architecting-the-department"],"purpose":"Hard boundaries, arrived at from the direction of authorship rather than of risk. The difficulty in a control is never the engineering, it is stating the rule precisely enough to be enforced - and only someone who does the work can state it that precisely.","listener_payoff":"The realization that they are the only person in the building who can write the rule at the right altitude.","keep_it_approachable":"This subject curdles into a fear segment if you let it. Stay on authorship: rules written at a distance come out either too loose to help or so blunt they break the job, and the guest has lived both. Follow this beat straight into what cannot be undone - that is where the boundary actually belongs.","flavors":{"current":"What is a rule in your world that sounds obvious until you try to write it down exactly?","experience":"What was a rule that sounded obvious until someone tried to write it down exactly?","observed":"What kinds of rules do you watch teams get handed that turn out to be unwritable as stated?","general":"Which rules in this kind of work sound simple and turn out to be very hard to state precisely?"},"followups":["What are the exceptions that make it hard?","Has your team ever been handed a rule that was followed exactly and still produced the wrong outcome?","What can your team do that cannot be undone? Is that protected by a system, or by someone remembering?"],"if_it_stalls":"Take the last policy that came down from somewhere else. Where did it meet reality?"},{"beat":"how-technical-really","title":"How technical do you actually have to be","theme":"myths","covers":["customization-as-superpower"],"purpose":"Remove the perceived prerequisite. A large share of the audience has quietly disqualified themselves on the grounds that they are not technical.","listener_payoff":"Removal of the biggest self-disqualifier, stated as a fact rather than as encouragement.","keep_it_approachable":"If the guest is unusually technical, ask them to answer for someone who is not - otherwise this beat confirms the listener's fear. Deliver the answer as a finding, never as reassurance.","flavors":{"current":"How technical do you actually have to be to do what you are doing?","experience":"How technical did you have to become? What did you never learn and never needed?","observed":"Are the people getting the most out of this the technical ones, or is it something else?","general":"What does someone actually need to understand here, and what can they safely ignore?"},"followups":["What is the thing people believe they need to learn that they do not?","Who on a team usually turns out to be good at this? Is it who you would expect?"],"if_it_stalls":"Say I am a manager with no technical background at all. What is genuinely out of reach for me, and what is not?"},{"beat":"the-year-you-spent-learning-it","title":"The year you spent learning it","theme":"change","covers":["customization-as-superpower"],"purpose":"Recover the hidden cost of the turnkey era, so that the reversal is felt rather than asserted.","listener_payoff":"Permission to stop treating their own adaptation as free, and a measure of what the reversal is actually worth.","keep_it_approachable":"'Turnkey' is the word to put pressure on. It promised no learning curve and delivered a year of one. Naming that is not cynicism - it is accuracy the listener has earned.","flavors":{"current":"Think about the last big system you were handed. How much of that first year was you learning its language, rather than it learning yours?","experience":"The last big system you were handed - how much of the first year went into learning its language?","observed":"When a team is handed a new system, how much of the first year goes into learning its language?","general":"How much of a large software rollout is actually the users adapting themselves to the software?"},"followups":["Who paid for that time?","It was sold as turnkey. What did it actually turn out to require?"],"if_it_stalls":"How long before your team was as fast with it as they had been without it?"},{"beat":"the-workaround-is-a-spec","title":"The workaround is a specification","theme":"craft","covers":["customization-as-superpower"],"purpose":"Turn years of accommodation into an asset. Every workaround was a design decision made under constraint.","listener_payoff":"Their accumulated accommodation reframed as a written specification they already own.","keep_it_approachable":"Treat the workaround as competent engineering under constraint, because that is what it was. If the guest apologizes for it, say plainly that the failure was the software's.","flavors":{"current":"What workaround has your team built that everyone has stopped noticing is a workaround?","experience":"What was the workaround your team built and then treated as simply how things are done?","observed":"What workarounds do you find when you look closely at how a team actually works?","general":"What kinds of workarounds do teams build around their software, and then stop seeing?"},"followups":["What was the software refusing to do?","If you handed that workaround to someone as a specification, what would it say?"],"if_it_stalls":"What does a new person always get wrong, because the real process is not the documented one?"},{"beat":"where-it-falls-down","title":"Where it falls down","theme":"failure","covers":[],"purpose":"Honesty, which is what makes everything else credible. An unqualified pitch loses the room.","listener_payoff":"Permission to be skeptical - which, counterintuitively, lowers the barrier to trying it.","keep_it_approachable":"Ask for specifics inside their domain, not general AI criticism. 'It makes things up' helps nobody. 'It cannot read our older records' is useful.","flavors":{"current":"Where does it fall down in your work, specifically?","experience":"Where did it consistently fall down in the work you know best?","observed":"Where do you watch it fall down most often?","general":"What is it reliably bad at, in this kind of work?"},"followups":["Did you work around it, or stop using it there entirely?","How long did it take you to find that out?"],"if_it_stalls":"What did you have to stop trusting it with?"},{"beat":"teaching-the-micro-judgments","title":"The rule nobody wrote down","theme":"judgment","covers":["architecting-the-department"],"purpose":"The heart of the spine. Surface the undocumented judgment only they hold, and frame handing it over as teaching rather than automating.","listener_payoff":"The specific, sayable form of an expertise they did not know was transferable.","keep_it_approachable":"The answer to the opening question is the curriculum. When they name an unwritten rule, stop and get it stated precisely - that sentence is the whole thesis of the episode made concrete. Use teaching language throughout, never automating language.","flavors":{"current":"What would go wrong if someone followed your team's documented process exactly, to the letter?","experience":"What would have gone wrong if a new person had followed the documented process exactly?","observed":"What happens when someone follows a team's written process exactly, without the unwritten part?","general":"What is the distance between a team's documented process and what actually has to happen?"},"followups":["So what is the unwritten rule? Say it out loud.","How would you teach that to something that has never done the job?","How would you know if you had taught it wrong?"],"if_it_stalls":"What do you check that nobody ever told you to check?"},{"beat":"staffing-the-department","title":"Staffing the department","theme":"people","covers":["architecting-the-department"],"purpose":"Move from tool to organization. Ask them to design roles, which is a manager's native competence applied to a new kind of worker.","listener_payoff":"Their existing competence - designing roles and supervision - recognised as the skill this actually requires.","keep_it_approachable":"Keep it in the language of roles, supervision and trust rather than tools and integrations. They already know how to staff a team; this beat should feel like that, because it is.","flavors":{"current":"If you were staffing a small department to take on the parts of your team's work that are rules rather than judgment, what roles would you create?","experience":"If you were staffing a department to take the rule-shaped work off a team you have run, what roles would you create?","observed":"When teams do this well, what roles do they end up creating?","general":"If you were designing a set of specialised workers for this kind of work, how would you divide it up?"},"followups":["Which of those would you trust first, and which last?","Who supervises them - you, or someone on your team?","What would you call that person's job?"],"if_it_stalls":"Forget the technology. If I gave you three junior people tomorrow, what would you have them do?"},{"beat":"the-first-week","title":"The first week","theme":"people","covers":["management-redefined"],"purpose":"The core reframe of the whole subject - agents as something you onboard rather than install - reached through a thing the guest has done many times and does not think of as a skill.","listener_payoff":"The realization that the competence this needs is one they have already used dozens of times.","keep_it_approachable":"Do not say the word agent until they have described a real onboarding in detail. The last follow-up does the reframe for you, and it lands far harder coming from them than from you.","flavors":{"current":"You already know how to bring on someone who is quick, literal, and knows nothing about your business. What would their first week look like?","experience":"Think about the last person you onboarded who was fast but knew nothing about your world. What did their first week actually consist of?","observed":"When you watch a team bring on someone quick but green, what does the first week consist of?","general":"What does the first week look like for someone who is fast, literal, and knows nothing about the business?"},"followups":["What did you have to say out loud that you assumed everyone already knew?","Who checked their work, and for how long?","Now suppose that person never got discouraged and never got tired. What would you do differently?"],"if_it_stalls":"Day one, nine in the morning. What are you telling them?"},{"beat":"what-stays-with-a-person","title":"Where it should stop and find you","theme":"personal","covers":["architecting-the-department"],"purpose":"Answer the underlying fear by handing them the pen: they are not being told where the line is, they are the person who draws it.","listener_payoff":"The line is theirs to draw, which is a different feeling from being told the line exists.","keep_it_approachable":"This is the beat that speaks to the anxious listener. Ask it warmly and let the answer breathe - do not rush to the next question.","flavors":{"current":"What is the part of the work that should always come to a person - and how would the system know when it has hit that line?","experience":"What was the part that always had to come to a person? How would you describe that line to someone else?","observed":"Where do the teams you watch draw the line that a person has to be involved?","general":"What kinds of decisions should always stop and go find a person?"},"followups":["Is that a judgment, or a preference?","Who gets to move that line - you, or someone above you?"],"if_it_stalls":"What would you feel wrong about handing over, even if nobody would ever know?"},{"beat":"who-owns-it","title":"Who owns it","theme":"people","covers":["management-redefined"],"purpose":"Where the management shift becomes a question about authority, and where the reporting is unusually clear about what works.","listener_payoff":"A concrete argument they can make about where this should sit, and evidence behind it.","keep_it_approachable":"The reported pattern is that this fails when it lives entirely in the technical group and works when it sits with people answerable for whether the work is any good. Say that as a finding, flatly. Delivered as a rallying cry it becomes the flattery the series is supposed to avoid.","flavors":{"current":"If something does your team's work, who should own whether it does that work well - your team, or the people who built it?","experience":"When a system did your team's work, who owned whether it did it well?","observed":"Who tends to own the performance of these systems - the function whose work it is, or the technical group?","general":"Who should own whether an automated system does a job well - the function whose work it is, or the people who built it?"},"followups":["Who owns it in practice today?","What would change if it sat with you?","Who would you need on your side to make that argument?"],"if_it_stalls":"Put it the other way round. If it embarrassed your team on a Tuesday, who gets the call?"},{"beat":"the-team-conversation","title":"What the team actually said","theme":"people","covers":[],"purpose":"The people beat, asked for observed reality rather than best practice.","listener_payoff":"A realistic preview of the conversation they are quietly dreading.","keep_it_approachable":"Do not ask how to make a team feel supported - that phrasing contains its own answer and produces a change-management response. Ask what people actually said, including the unflattering parts.","flavors":{"current":"When you brought this to your team, what did they actually say?","experience":"When you brought this to a team, what did they actually say?","observed":"When a manager brings this to a team, what do people actually say?","general":"What does a team actually say when this arrives - not what the engagement survey says?"},"followups":["Who pushed back hardest, and were they right?","Did anyone ask you about their job? What did you tell them?"],"if_it_stalls":"What was the first objection, in the first meeting?"},{"beat":"where-the-work-piled-up","title":"Where the work piled up instead","theme":"craft","covers":[],"purpose":"Turn a tool conversation into a process conversation. One step got faster and the queue moved somewhere.","listener_payoff":"The insight that makes them look at their whole workflow rather than at a tool.","keep_it_approachable":"Keep it concrete - a named step, a named queue, a named person - or it drifts into consulting language.","flavors":{"current":"Once one step got faster, where did the work pile up instead?","experience":"When one step got faster, where did the work pile up?","observed":"When a team speeds up one step, where does the queue reappear?","general":"If one step in a process gets dramatically faster, what usually happens to the rest of it?"},"followups":["Is the new bottleneck a person?","Did anyone plan for that, or did you find it the hard way?"],"if_it_stalls":"Who is waiting on whom now, that was not waiting before?"},{"beat":"monday-morning","title":"Monday morning","theme":"future","covers":[],"purpose":"The takeaway close. One thing to try, and one thing not to start with.","listener_payoff":"A first step, and protection against the failure that would make them give up.","keep_it_approachable":"Insist on both halves. The 'do not start with' half is what stops a listener failing on their first attempt and concluding it is not for them.","flavors":{"current":"A manager listening wants to try one thing this week. Based on what is working for you now, what should it be - and what should they not start with?","experience":"Based on what actually worked for you, what should someone try first - and what should they not start with?","observed":"Based on what you have watched succeed and fail, what should someone try first - and what should they not start with?","general":"What should someone try first, and what should they not start with?"},"followups":["How long before they should expect it to feel worth it?","What should they do if the first attempt disappoints them?"],"if_it_stalls":"Name the specific task. Not the category - the task."}]}],"series":{"promise":"The thing you hold - an accumulated sense of how the work actually goes, exercised dozens of times a day and written down nowhere - is the scarce input that makes any of this work. You are the natural architect of it, not its subject.","listener":{"who":"A manager or senior practitioner in any field, responsible for delivery, holding a team below and executives above.","what_they_have_lived":"Their judgment has been exercised constantly and solicited rarely. They have watched decisions get made badly by people who did not ask them. They have been handed software configured by someone who has never done the job, and been told to adapt to it.","the_turn":"The bottleneck on useful AI in an organization is not the model. It is the tacit knowledge of how the work actually goes - the exceptions, the escalations, the 'we always check X before Y'. That knowledge lives in the middle. It has never been written down and nobody has ever asked for it. Now it is the input.","honesty_check":"This only works because it is true. The models are close to commodity; the judgment is not. Do not inflate it beyond that - the listener has a working detector for flattery, and using it costs more than it buys."},"voice":{"$comment":"Warmth belongs in the premise of a question, never in its content. A question that smuggles in the answer is a leading question no matter how kindly it is phrased - see 'invites' rule 1 against 'avoids' rule 6.","invites":["Assume competence in the premise. 'How did you decide where to draw that line' assumes they drew it. 'Have you thought about where to draw the line' assumes they have not.","Ask them to teach, not to justify. On this subject they are the expert in the room, and the questions should be shaped that way.","Put the agency in the verb. 'What would you build' rather than 'what will happen to you'. The listener is the subject of every sentence, never the object.","Use their vocabulary and ask them to define it. Never test whether they know yours.","Treat every workaround as a design decision made under constraint, because that is what it was.","State the case for their expertise once, plainly, early - then stop saying it and let the questions carry it."],"avoids":["Deficit framing. Struggling, behind, resistant, not started yet. The listener has heard enough of that from their own leadership.","Catch-up urgency. Urgency is the register of a vendor, not of a colleague.","Any construction implying the bar has been lowered for them - 'even you can', 'you do not need to be technical' said as reassurance rather than as fact.","Tech as the hero. The tool is not the protagonist of this show. The person configuring it is.","Passive constructions that make them the object. 'How is AI changing your job' happens to them; 'what have you changed' does not.","Flattery that is not load-bearing. Empowerment comes from an accurate account of what they hold, not from being told that they matter."],"avoid_patterns":{"$comment":"Case-insensitive substrings that validate.py flags in question text. Deliberately narrow - each one is deficit framing aimed at the guest rather than at a tool or a system.","struggling with":"Deficit framing. Ask what they decided, not what defeats them.","you struggle":"Deficit framing. Ask what they decided, not what defeats them.","falling behind":"Catch-up urgency. Not the register of this show.","behind the curve":"Catch-up urgency. Not the register of this show.","why haven't you":"Puts them on the defensive. Ask what they did instead.","why don't you just":"Implies the answer is obvious and they missed it.","do you even":"Condescending in every context.","resistant to":"Casts the guest or their team as the obstacle.","still doing it manually":"Implies they are late. They may simply be right.","failed to":"Ask what happened, not what they failed at."}},"spine":[{"theme":"natural-language-os","name":"The natural language operating system","reframe":"The interface to computing has become plain language, which means describing work precisely is now the act of configuring it. Managers have been writing specifications their whole careers and calling it explaining things to the new person.","why_it_empowers":"It converts a skill they already have and do not count as a skill into the core technical competence.","say":["describe","explain","the way you would tell a new person","the rule you say out loud"],"do_not_say":["prompt engineering","prompting","query","syntax"]},{"theme":"architecting-the-department","name":"Architecting an AI department","reframe":"The work is not using a tool. It is standing up a set of specialised workers and teaching them the micro-judgments that currently live only in the guest's head - what good enough means here, which exceptions matter, when to stop and come find a person.","why_it_empowers":"It casts them as the architect and the curriculum rather than the user. Designing roles and supervision is a competence they already have.","sub_topics":{"control-boundaries":"Probabilistic systems need hard edges. The same request produces slightly different results each run, which is fine for a draft and serious for a transaction, so the architecture is deterministic checks wrapped around the probabilistic part - the agent proposes, ordinary software verifies against the rule, and only then does anything execute. Reach this through authorship rather than through risk: the hard part is stating the rule precisely enough to enforce, and the only person who can do that is someone who does the work."},"say":["staffing","teaching","supervision","escalation","the rule nobody wrote down","proposes","checked before it goes out","cannot be undone"],"do_not_say":["automate","replace","deploy","headcount reduction","guardrails"]},{"theme":"customization-as-superpower","name":"Customization is the superpower","reframe":"Turnkey software was never turnkey. It demanded that users learn its vocabulary and bend their process around it, and that adaptation was unpaid and invisible. The direction has reversed, which means every workaround the team ever built is now a specification.","why_it_empowers":"It retroactively dignifies years of accommodation work and hands them the pen.","say":["shape it to you","the workaround","bend","the way your team actually does it"],"do_not_say":["power user","best practice","out of the box","adoption curve"]},{"theme":"management-redefined","name":"Management itself is being redefined","reframe":"The shift is from agents-as-tools to agents-as-teammates: things that get onboarded, taught, coached, escalated from and performance-managed, rather than installed. That makes running them a management job rather than a technical one, and a new role is forming around it. The reported pattern is that it fails when it is centralised in IT or hired for AI credentials, and works when it sits with people who already carry functional depth and accountability for whether the work is any good.","why_it_empowers":"It is the show's promise stated as an emerging job rather than as an aspiration. The people best positioned for it are the ones already answerable for whether the work is good - which is the listener, and which is not who most organizations would think to pick.","say":["teammate","onboarding","coaching","escalation path","who owns it","orchestration","answerable"],"do_not_say":["headcount","FTE","resource","replace","workforce reduction"]}]},"taxonomy":{"arc":{"opener":"First 5 minutes. Low stakes, high specificity. Gets the guest talking in concrete detail before they can retreat into talking points.","warmup":"Minutes 5-15. Establishes the world and its vocabulary for the audience. Still safe for the guest.","core":"The body of the episode. Substantive but not confrontational. Most questions live here.","deep":"Requires earned trust. Ask after the guest has relaxed and after you have demonstrated you understand their world.","pivot":"Redirects a stalled or evasive stretch. Use out of order, on demand.","closer":"Last 10 minutes. Wide aperture, forward-looking, or reflective. Gives the guest a good last taste."},"depth":{"light":"Answerable in a sentence or two. Low risk of an evasive answer.","medium":"Needs a story or a worked example. The guest has to think.","probing":"Touches ego, money, blame, or professional consensus. Can go wrong. Ask deliberately."},"theme":{"origin":"How they got here, the path in, the accident or intention of it.","craft":"The actual work. Skill, tools, taste, tacit knowledge, what mastery looks like from inside.","judgment":"Decision-making under uncertainty, tradeoffs, the calls that don't have a right answer.","failure":"Mistakes, near-misses, repair, and what the field does with its errors.","people":"Teams, hierarchy, mentorship, clients, status, who holds power and how.","money":"Compensation, incentives, business model, who pays and what that distorts.","change":"How the field is shifting - technology, regulation, demographics, expectations.","ethics":"The lines, the gray zones, the pressure to cross them.","myths":"What outsiders get wrong, what the field misrepresents about itself.","invisible":"The unglamorous, unrecorded, or unpaid labor the job actually consists of.","future":"Where it goes next, what the guest would change, advice and legacy.","personal":"Cost, identity, sustainability, the life around the work."},"industries":{"universal":"Written to land on any professional. The backbone of the database.","healthcare":"Clinicians, nurses, hospital administrators, public health, allied health.","law":"Litigators, transactional lawyers, judges, public defenders, in-house counsel.","finance":"Banking, investing, accounting, insurance underwriting, financial advising.","technology":"Software, hardware, IT, security, data, product.","manufacturing":"Factory operations, industrial engineering, quality, plant management.","skilled-trades":"Electricians, plumbers, welders, machinists, construction, HVAC.","agriculture":"Farming, ranching, agronomy, fisheries, food production.","education":"K-12 teaching, higher ed, administration, training, curriculum.","hospitality":"Restaurants, hotels, bars, catering, events, tourism.","logistics":"Freight, warehousing, supply chain, procurement, last-mile delivery.","energy":"Oil and gas, utilities, renewables, grid operations, nuclear.","creative-arts":"Musicians, writers, designers, filmmakers, visual artists, performers.","media-journalism":"Reporters, editors, producers, publishers, broadcast.","nonprofit":"Direct service, philanthropy, advocacy, community organizing.","public-sector":"Civil service, policy, regulators, municipal government, emergency services.","retail-ecommerce":"Store operations, merchandising, buying, DTC brands, marketplaces.","real-estate":"Brokerage, development, property management, appraisal, construction finance.","science-research":"Academic and industrial research, labs, R&D, clinical trials.","sports":"Athletes, coaches, trainers, scouts, front office, officials.","defense-military":"Active and veteran service members, defense contracting, intelligence."},"roles":{"middle-manager":"The person responsible for delivery, holding a team below and executives above. Has authority over the work but rarely over the constraints.","ai-leader":"Whoever owns AI strategy, adoption or enablement - director, head of AI, transformation lead. Adjacent authority rather than a manager in the middle, and often the source of the pressure managers feel.","individual-contributor":"A senior practitioner with no direct reports who now directs agents. Increasingly doing a version of management without the title, the training, or the authority that comes with it."}}};

  const ARC_ORDER = ["opener", "warmup", "core", "deep", "closer", "pivot"];

  const ANCHORING = ["current", "experience", "observed", "general"];

  const profiles = Object.fromEntries(DATA.profiles.map(p => [p.slug, p]));

  const state = {
    industry: "",
