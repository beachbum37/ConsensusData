r you without warning? What broke?","theme":"failure","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager","ai-leader"],"lands_because":"Embedded AI means a vendor can alter your process overnight. This risk is real, widely experienced, and almost never discussed publicly - it produces specific, vivid stories.","followups":["How did you find out?","What do you do differently now to protect against it?"],"tags":["ai","workflow","vendor-risk","underasked","high-yield"],"pack":"From Chat to Workflow"},{"id":"wfl-09","text":"Your workflow now has a shape somebody at a software vendor chose. How much of your process is still actually yours?","theme":"change","arc":"deep","depth":"probing","industries":["universal"],"roles":["middle-manager","ai-leader"],"lands_because":"States plainly what embedded AI does to organizational autonomy. Sharp but not hostile, and it gives a thoughtful guest room to describe a real loss of control.","followups":["Does that worry you, or is it a fair trade?"],"tags":["ai","workflow","vendor-risk","autonomy","high-yield"],"pack":"From Chat to Workflow"},{"id":"wfl-10","text":"What did you automate that you should have eliminated?","theme":"judgment","arc":"deep","depth":"medium","industries":["universal"],"roles":["middle-manager","ai-leader"],"lands_because":"The oldest and best process question, and AI has made it urgent again by lowering the cost of automating things that should not exist at all. Short, memorable, and it produces a real admission.","followups":["Why was it easier to automate than to kill?"],"tags":["ai","workflow","redesign","short","flagship"],"pack":"From Chat to Workflow"},{"id":"wfl-11","text":"Who in your organization is allowed to change how work flows? Has that list changed?","theme":"people","arc":"deep","depth":"probing","industries":["universal"],"roles":["middle-manager","ai-leader"],"lands_because":"Process authority is the real question underneath the whole subject. Managers are told to transform their workflow and frequently have no standing to change the tools that define it.","followups":["Where does your authority stop?"],"tags":["ai","workflow","authority","the-middle","high-yield"],"pack":"From Chat to Workflow"},{"id":"wfl-12","text":"What in your process is still built around a person being available?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Surfaces the human single points of failure - the approver, the one person who knows, the reviewer everything queues behind - which is exactly where workflow redesign either helps or quietly fails.","followups":["What happens when they are on leave?"],"tags":["ai","workflow","bottleneck","single-point-of-failure"],"pack":"From Chat to Workflow"},{"id":"wfl-13","text":"What would you have to stop doing for the workflow to be genuinely different rather than just faster?","theme":"judgment","arc":"deep","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Redesign is subtraction, and this frames it that way. It pushes past the additive instinct - buy the tool, add the step - that most transformation efforts never escape.","followups":["Who would have to agree?"],"tags":["ai","workflow","redesign","subtraction"],"pack":"From Chat to Workflow"},{"id":"wfl-14","text":"What is the smallest change you made to how work moves that had the biggest effect?","theme":"craft","arc":"core","depth":"light","industries":["universal"],"roles":["middle-manager"],"lands_because":"Concrete, positive, and easy to answer. Gives the audience a portable example, which is what actually moves people to try something on Monday.","followups":["How did you know to try that?"],"tags":["ai","workflow","audience-gift","easy"],"pack":"From Chat to Workflow"},{"id":"wfl-15","text":"If you rebuilt your team's workflow from scratch tomorrow, what would you not rebuild?","theme":"future","arc":"closer","depth":"medium","industries":["universal"],"roles":["middle-manager","ai-leader"],"lands_because":"A closer that asks for subtraction rather than vision, so the answer stays specific. It also sends the audience away with the right question rather than the right answer.","followups":["What is stopping you from removing it now?"],"tags":["ai","workflow","closer","redesign"],"pack":"From Chat to Workflow"},{"id":"agm-01","text":"If your contributors are now directing agents, they are doing a version of your job. What do you know about delegation that they are about to learn the hard way?","theme":"people","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"The bridge between the two halves of the subject, and it casts the manager as the person who already holds the scarce skill rather than the person being automated. Guests light up at it.","followups":["What did that cost you to learn?","Is anyone teaching them, or are they just finding out?"],"tags":["ai","agents","delegation","flagship","high-yield"],"pack":"Everyone Becomes a Manager"},{"id":"agm-02","text":"What did you learn in your first year of managing people that transfers to this, and what does not transfer at all?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"The two-part structure prevents a glib answer in either direction. The non-transferable half is the more interesting one - motivation, growth, and loyalty have no analogue, and naming that clarifies what management actually was.","followups":["So what is management, if you take the people part out?"],"tags":["ai","agents","delegation","flagship","clarifying"],"pack":"Everyone Becomes a Manager"},{"id":"agm-03","text":"How many things can one person actually supervise at once? Have you found the ceiling?","theme":"judgment","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager","individual-contributor"],"lands_because":"Span of control is a real, old, well-understood management constraint that nobody has re-derived for agents. Asking for the ceiling invites a number and a story about hitting it.","followups":["What happens to the quality at the top of that range?","Did you notice the ceiling before or after something went wrong?"],"tags":["ai","agents","span-of-control","quantified","flagship"],"pack":"Everyone Becomes a Manager"},{"id":"agm-04","text":"What does a good instruction look like now? Could you teach it to someone?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager","individual-contributor"],"lands_because":"Specifying precisely what you want has become load-bearing, and it is exactly the skill good managers already have. The teachability half tests whether the guest can articulate it or only do it.","followups":["What do people get wrong on their first try?","Is it the same skill as briefing a junior?"],"tags":["ai","agents","specification","tacit-knowledge"],"pack":"Everyone Becomes a Manager"},{"id":"agm-05","text":"When do you check the work, and when do you accept it? How did you calibrate that?","theme":"judgment","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager","individual-contributor"],"lands_because":"Trust calibration is the whole craft of supervision, human or otherwise. Asking how they calibrated forces a real account rather than a principle.","followups":["What did it take to stop checking everything?"],"tags":["ai","agents","trust","review","flagship"],"pack":"Everyone Becomes a Manager"},{"id":"agm-06","text":"Who on your team is excellent at the craft and bad at directing it? What happens to that person?","theme":"people","arc":"deep","depth":"probing","industries":["universal"],"roles":["middle-manager"],"lands_because":"The human cost of the shift, made specific. It is the question a manager has been privately worrying about, and asking it plainly usually produces the most honest moment in the conversation.","followups":["Is that a training problem or a temperament one?","Do you owe them a path, or does the organization?"],"avoid_if":"The guest is currently running a performance process on someone who fits that description.","tags":["ai","agents","human-cost","flagship","high-yield"],"pack":"Everyone Becomes a Manager"},{"id":"agm-07","text":"Delegation feels slower before it feels faster. How do you get someone through that valley?","theme":"people","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Names the specific reason people abandon delegation and revert to doing it themselves. Managers know this valley intimately from experience and can describe crossing it.","followups":["How long is the valley, honestly?"],"tags":["ai","agents","delegation","practical"],"pack":"Everyone Becomes a Manager"},{"id":"agm-08","text":"Are you hiring for craft or for direction?","theme":"people","arc":"deep","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Seven words that force a real position, and hiring is where a stated philosophy meets an actual decision. The answer tells you what the guest truly believes about the thesis.","followups":["Has your interview changed? What do you ask now?","Can you assess direction in an interview at all?"],"tags":["ai","agents","hiring","short","flagship"],"pack":"Everyone Becomes a Manager"},{"id":"agm-09","text":"How do you tell the difference between someone who directed the work well and someone who got lucky with a good tool?","theme":"judgment","arc":"deep","depth":"probing","industries":["universal"],"roles":["middle-manager"],"lands_because":"The evaluation problem stated precisely. It is unsolved in most organizations, and a manager improvising an answer live is genuinely interesting listening.","followups":["Does your performance process have any idea how to handle that?"],"tags":["ai","agents","evaluation","fairness","high-yield"],"pack":"Everyone Becomes a Manager"},{"id":"agm-10","text":"An agent cannot be held accountable. Where does that leave the person who directed it?","theme":"ethics","arc":"deep","depth":"probing","industries":["universal"],"roles":["middle-manager","individual-contributor"],"lands_because":"Accountability cannot be delegated downward to something that cannot hold it, which means it concentrates on the human director. Most organizations have not said this out loud.","followups":["Is that fair, if they could not have caught the error?"],"tags":["ai","agents","accountability","high-yield"],"pack":"Everyone Becomes a Manager"},{"id":"agm-11","text":"What is the work you would never hand to an agent? Is that a judgment or a preference?","theme":"judgment","arc":"deep","depth":"medium","industries":["universal"],"roles":["middle-manager","individual-contributor"],"lands_because":"The second clause is the question. It asks the guest to examine whether their line is reasoned or protective, and the good ones will concede they are not sure.","followups":["Has that line moved in the last year? Which direction?"],"tags":["ai","agents","limits","self-examining","flagship"],"pack":"Everyone Becomes a Manager"},{"id":"agm-12","text":"Does the individual contributor ladder still mean anything?","theme":"change","arc":"deep","depth":"probing","industries":["universal"],"roles":["middle-manager","individual-contributor"],"lands_because":"The IC track was built as an alternative to management for people who wanted to keep doing the work. If directing agents is now the work, the premise of that ladder is in question.","followups":["What do you tell someone who took that track deliberately?"],"tags":["ai","agents","career-path","structural"],"pack":"Everyone Becomes a Manager"},{"id":"agm-13","text":"What happens to someone who refuses to work this way and is still genuinely very good?","theme":"people","arc":"deep","depth":"probing","industries":["universal"],"roles":["middle-manager"],"lands_because":"The 'still very good' clause removes the easy answer. It forces the guest to say whether excellence at the craft is now sufficient, which is the question their whole team is quietly asking.","followups":["Have you had that person? What did you do?"],"tags":["ai","agents","human-cost","sharp","high-yield"],"pack":"Everyone Becomes a Manager"},{"id":"agm-14","text":"If everyone becomes a manager, what is left that is distinctly yours?","theme":"personal","arc":"deep","depth":"probing","industries":["universal"],"roles":["middle-manager"],"lands_because":"Turns the thesis back on the guest. It is the direct answer to the flattening anxiety - either they can name what remains theirs, or the hesitation itself is the story.","followups":["Is that a comfortable answer or an uncomfortable one?"],"avoid_if":"Ask it late. Cold, it reads as a challenge to their job security rather than a real question.","tags":["ai","agents","the-middle","flagship","handle-with-care"],"pack":"Everyone Becomes a Manager"},{"id":"agm-15","text":"What should someone entering the workforce now learn first - the craft, or how to direct it?","theme":"future","arc":"closer","depth":"medium","industries":["universal"],"roles":["middle-manager","ai-leader","individual-contributor"],"lands_because":"A closer that makes the guest commit. It also connects back to the apprenticeship question - you cannot direct work you have never learned to judge, and most guests will say so.","followups":["Can you actually direct work you have never done yourself?"],"tags":["ai","agents","closer","apprenticeship","forces-position"],"pack":"Everyone Becomes a Manager"},{"id":"spn-01","text":"You have explained this job to every new person who ever joined. What is the part of that explanation that is written down nowhere?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager","individual-contributor"],"lands_because":"Starts from something they have done a hundred times rather than from anything technical, and the answer is the thing that now configures a system. They arrive at that themselves, which is the only way it lands.","followups":["How long did it take you to work that out for yourself?","Who else in the building could give that explanation?"],"tags":["ai","natural-language-os","spine","flagship"],"pack":"The Spine"},{"id":"spn-02","text":"Who writes the rules the software follows where you work? Have they ever done the job?","theme":"people","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Names something practitioners have felt for a whole career and rarely heard said out loud. Ask it evenly rather than indignantly and the guest supplies the feeling.","followups":["What would you have changed, if anyone had asked you?","What would have to be true for that to move?"],"tags":["ai","natural-language-os","spine","flagship","high-yield"],"pack":"The Spine"},{"id":"spn-03","text":"What is the difference between telling a person how to do this and telling a system?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager","individual-contributor"],"lands_because":"Invites a practitioner to compare two acts of instruction they can both speak to, and the differences they name are exactly the skill the subject requires.","followups":["Which one is harder? Which one did you get better at first?"],"tags":["ai","natural-language-os","spine"],"pack":"The Spine"},{"id":"spn-04","text":"What have you always wanted the software to do that you could never ask for, because there was no box for it?","theme":"change","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Every practitioner has a list. Being asked for it, possibly for the first time, is the entire emotional proposition of the show in one question.","followups":["Who did you ask, and what did they say?"],"tags":["ai","natural-language-os","spine","high-yield"],"pack":"The Spine"},{"id":"spn-05","text":"What would go wrong if someone followed your documented process exactly, to the letter?","theme":"judgment","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"The gap between the written process and the real one is where all the transferable judgment lives. This is the fastest route to it, and the answer is the curriculum.","followups":["So what is the unwritten rule? Say it out loud.","How would you teach that to something that has never done the job?"],"tags":["ai","architecting-the-department","spine","flagship","high-yield"],"pack":"The Spine"},{"id":"spn-06","text":"What do you check that nobody ever told you to check?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager","individual-contributor"],"lands_because":"Micro-judgment in its smallest and most concrete form. Short, easy to answer, and it produces exactly the kind of rule that is invisible until someone asks.","followups":["What happened the one time nobody checked?"],"tags":["ai","architecting-the-department","spine","short"],"pack":"The Spine"},{"id":"spn-07","text":"If you were staffing a department to take on the rule-shaped parts of your team's work, what roles would you create?","theme":"people","arc":"deep","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Job design is a competence they already have. Asking the question in the language of roles rather than tools puts them on ground where they are the expert.","followups":["Which would you trust first, and which last?","What would you call that person's job?"],"tags":["ai","architecting-the-department","spine","flagship"],"pack":"The Spine"},{"id":"spn-08","text":"What should always stop and come find a person - and how would you describe that line to someone else?","theme":"judgment","arc":"deep","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Answers the underlying anxiety by handing over the pen. They are not being told where the line sits; they are the one drawing it.","followups":["Is that a judgment or a preference?","Who gets to move that line - you, or someone above you?"],"tags":["ai","architecting-the-department","spine","flagship"],"pack":"The Spine"},{"id":"spn-09","text":"The last big system you were handed was sold as turnkey. How much of the first year went into learning its language rather than it learning yours?","theme":"change","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Recovers a cost everyone absorbed and nobody counted. Putting pressure on the word turnkey is accuracy rather than cynicism, and it makes the reversal something felt rather than asserted.","followups":["Who paid for that time?","How long before your team was as fast with it as they had been without it?"],"tags":["ai","customization-as-superpower","spine","high-yield"],"pack":"The Spine"},{"id":"spn-10","text":"What workaround has your team built that everyone has stopped noticing is a workaround?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager","individual-contributor"],"lands_because":"The workaround is a specification they already wrote. Treat it as competent engineering under constraint, because that is what it was.","followups":["What was the software refusing to do?","If you handed that to someone as a specification, what would it say?"],"tags":["ai","customization-as-superpower","spine","flagship"],"pack":"The Spine"},{"id":"spn-11","text":"What does your team do that no vendor would ever ship a feature for?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Locates the specificity that used to be a liability - too niche to be supported - and reframes it as the thing that can now be built. That inversion is the whole customization argument in one answer.","followups":["Is that a quirk, or is it the actual reason the work comes out well?"],"tags":["ai","customization-as-superpower","spine","high-yield"],"pack":"The Spine"},{"id":"spn-12","text":"If the tool could be shaped around your team instead of the other way round, what is the first thing you would change?","theme":"future","arc":"closer","depth":"medium","industries":["universal"],"roles":["middle-manager","individual-contributor"],"lands_because":"A closer that puts the agency in their verb. It asks what they would build rather than what will happen to them, which is the register the whole series runs in.","followups":["What is stopping you from doing that now?"],"tags":["ai","customization-as-superpower","spine","closer"],"pack":"The Spine"},{"id":"ctl-01","text":"Where in your work is a slightly different answer each time completely fine - and where is it a serious problem?","theme":"judgment","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager","individual-contributor"],"lands_because":"The whole subject rests on this one distinction, and a practitioner can draw it in their own domain immediately. A draft tolerates variation; a payment does not. Getting them to sort their own work into those two piles is the foundation for everything else.","followups":["What is the first thing on the second list?","Who decided which pile that belonged in?"],"tags":["ai","architecting-the-department","control-boundaries","flagship"],"pack":"Hard Boundaries"},{"id":"ctl-02","text":"What is a rule in your world that sounds obvious until you try to write it down exactly?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Stating a rule precisely enough to be enforced is the actual difficulty, and it is the part only someone who does the work can do. The answer doubles as proof of why they are the one who should be writing it.","followups":["What are the exceptions that make it hard?","Who would write that rule today if you did not?"],"tags":["ai","architecting-the-department","control-boundaries","flagship","high-yield"],"pack":"Hard Boundaries"},{"id":"ctl-03","text":"Has anyone handed your team a rule that was followed exactly and still produced the wrong outcome?","theme":"judgment","arc":"deep","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Rules written at a distance are usually too loose or too blunt, and everyone doing the work has an example. Framing it as the rule's failure rather than the team's keeps it honest and keeps the guest comfortable.","followups":["What would the rule have said if you had written it?","Did anyone go back and change it?"],"tags":["ai","architecting-the-department","control-boundaries","high-yield"],"pack":"Hard Boundaries"},{"id":"ctl-04","text":"When a control is set too tight, what does your team actually do?","theme":"people","arc":"deep","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Over-tight controls do not stop work, they push it somewhere unobserved. Practitioners know exactly where it goes, and the answer is the strongest possible argument for involving them in writing the boundary.","followups":["Does the person who set the control know that happens?","Is the workaround safer or less safe than the thing the rule was protecting against?"],"tags":["ai","architecting-the-department","control-boundaries","high-yield"],"pack":"Hard Boundaries"},{"id":"ctl-05","text":"What can your team do that cannot be undone?","theme":"judgment","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager","individual-contributor"],"lands_because":"Seven words, and it sorts every action by blast radius. Irreversibility is the cleanest test for where a hard boundary belongs, and it works identically for a refund, a discharge, a pour, a filing, or a send.","followups":["How is that protected today - a system, or a person remembering?","Has it ever gone wrong?"],"tags":["ai","architecting-the-department","control-boundaries","short","flagship"],"pack":"Hard Boundaries"},{"id":"ctl-06","text":"What would you want checked before one of those goes out - and who should be the one writing that check?","theme":"judgment","arc":"deep","depth":"medium","industries":["universal"],"roles":["middle-manager","ai-leader"],"lands_because":"This is the validation layer described in their own terms: something proposes, something else verifies, and only then does it happen. The second clause turns a technical pattern into a question about authority.","followups":["Is that check written down anywhere, or is it in someone's head?","What would it take for you to be the one who defines it?"],"tags":["ai","architecting-the-department","control-boundaries","flagship"],"pack":"Hard Boundaries"},{"id":"ctl-07","text":"Where does work pass from one person or system to another without anyone looking at it in between?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Handoffs are where controls belong and where they are usually missing. Asking about people and systems together lets a non-technical guest answer precisely, and the answer maps directly onto where agent-to-agent checks would go.","followups":["Was that always unchecked, or did the check get dropped at some point?","What would you want looked at there?"],"tags":["ai","architecting-the-department","control-boundaries","handoffs"],"pack":"Hard Boundaries"},{"id":"ctl-08","text":"If something went wrong at the start of that chain, how far would it travel before someone noticed?","theme":"failure","arc":"deep","depth":"medium","industries":["universal"],"roles":["middle-manager","ai-leader"],"lands_because":"Cascade made concrete and countable. It follows naturally from the handoff question and produces a specific number of steps rather than a general anxiety about automation.","followups":["Who is the person who usually catches it?","What would you want to stop it earlier?"],"tags":["ai","architecting-the-department","control-boundaries","cascade"],"pack":"Hard Boundaries"},{"id":"ctl-09","text":"What does your team already do to catch a bad instruction before anyone acts on it?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager","individual-contributor"],"lands_because":"Every team already runs informal controls - the second signature, the read-back, the pause before sending. Naming them establishes that the guest is not being asked to invent something foreign, only to make explicit what they already enforce.","followups":["Where did that habit come from - a rule, or something that went wrong once?","Which of those would survive if the work got faster?"],"tags":["ai","architecting-the-department","control-boundaries","existing-controls"],"pack":"Hard Boundaries"},{"id":"ctl-10","text":"How would you know if the system started behaving differently this month than it did last month?","theme":"change","arc":"deep","depth":"medium","industries":["universal"],"roles":["middle-manager","ai-leader"],"lands_because":"Conventional testing assumes stable behavior, and these systems are not stable - the model updates, the prompt changes, the data shifts underneath. In most organizations the detector is a person who notices something is off, and that person is usually the guest.","followups":["Would anyone tell you if the model underneath changed?","What was the last time you noticed something was off before anyone else did?"],"tags":["ai","architecting-the-department","control-boundaries","drift","high-yield"],"pack":"Hard Boundaries"},{"id":"ctl-11","text":"What arrives from outside your organization that everyone treats as trustworthy?","theme":"ethics","arc":"deep","depth":"medium","industries":["universal"],"roles":["middle-manager","ai-leader"],"lands_because":"Forms, emails, uploaded documents and supplier files are treated as neutral context and are the obvious way in for anything hostile. Asked plainly it is a boundary question, not a scare story, and the guest can answer it from their own inbox.","followups":["What happens to that document once it arrives?","Who checks it today, and what are they checking for?"],"tags":["ai","architecting-the-department","control-boundaries","inputs"],"pack":"Hard Boundaries"},{"id":"ctl-12","text":"If you were writing the rulebook for a system doing your team's work, what would the first three lines be?","theme":"future","arc":"closer","depth":"medium","industries":["universal"],"roles":["middle-manager","individual-contributor"],"lands_because":"A closer that hands them the pen on exactly the thing the episode argued they should hold. Asking for three lines rather than a philosophy forces the specificity that makes a rule enforceable.","followups":["Which of those would be hardest to write precisely?","What is stopping you from writing them now?"],"tags":["ai","architecting-the-department","control-boundaries","closer","flagship"],"pack":"Hard Boundaries"},{"id":"ctl-13","text":"Between something that only drafts and something that acts on its own, where is your team's work today? What would have to be true before you moved one step along?","theme":"judgment","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager","ai-leader"],"lands_because":"Gives the guest a ladder to place themselves on rather than a yes-or-no about autonomy, and the second half asks for their own preconditions - which is the same as asking what they would need to trust it.","followups":["What convinced you it was safe to take the last step?","Is anything running further along that ladder than you would have chosen?"],"tags":["ai","architecting-the-department","control-boundaries","autonomy-ladder","flagship"],"pack":"Hard Boundaries"},{"id":"ctl-14","text":"After something went wrong, what would you need to be able to reconstruct - and is any of that being kept today?","theme":"failure","arc":"deep","depth":"medium","industries":["universal"],"roles":["middle-manager","ai-leader"],"lands_because":"Turns audit trails into a practical question about their own investigations. Every manager has tried to reconstruct a decision after the fact and found the record thinner than they expected.","followups":["Where did the information it used come from - could you trace it back?","Who would ask you for that reconstruction?"],"tags":["ai","architecting-the-department","control-boundaries","provenance"],"pack":"Hard Boundaries"},{"id":"mgr-01","text":"You already know how to bring on someone who is quick, literal, and knows nothing about your business. What would their first week look like?","theme":"people","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Onboarding is something they have done many times, so the answer arrives without effort - and it is, in detail, the work of setting an agent up. Do not name the parallel; the follow-up does it for you.","followups":["What did you have to say out loud that you assumed everyone already knew?","Who checked their work, and for how long?","Now suppose that person never got discouraged and never got tired. What would you do differently?"],"tags":["ai","management-redefined","onboarding","flagship","high-yield"],"pack":"The Agent Manager"},{"id":"mgr-02","text":"If something does your team's work, who should own whether it does that work well - your team, or the people who built it?","theme":"people","arc":"deep","depth":"medium","industries":["universal"],"roles":["middle-manager","ai-leader"],"lands_because":"Where this sits is a question about authority, and it is the one place the reporting is unusually clear: centralising it away from the function is what makes agents succeed technically and fail in the work. The guest can argue for their own standing without it sounding self-serving.","followups":["Who owns it in practice today?","What would change if it sat with you?","Who would you need on your side to make that argument?"],"tags":["ai","management-redefined","ownership","flagship","high-yield"],"pack":"The Agent Manager"},{"id":"mgr-03","text":"What are you measured on today that would stop meaning anything if the work got done a different way?","theme":"money","arc":"deep","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Activity metrics - calls made, tickets closed, meetings booked - stop measuring anything useful once volume decouples from effort. Naming which of their own numbers goes hollow is concrete and slightly subversive.","followups":["What should replace it?","Who would have to agree to change that number?"],"tags":["ai","management-redefined","metrics","high-yield"],"pack":"The Agent Manager"},{"id":"mgr-04","text":"Who on your team would actually be good at directing this work? Would anyone above you think to pick them?","theme":"people","arc":"deep","depth":"probing","industries":["universal"],"roles":["middle-manager"],"lands_because":"The second sentence is the whole question. The people who turn out to be good at this tend to be the ones already answerable for whether the work is any good, and they are rarely who a selection process reaches for.","followups":["What is it about them that makes you say so?","What would you have to argue to get them picked?"],"tags":["ai","management-redefined","hiring","flagship","high-yield"],"pack":"The Agent Manager"},{"id":"mgr-05","text":"What would you put on a scorecard for work that is done well but not done by a person?","theme":"judgment","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager","ai-leader"],"lands_because":"Performance management is a competence they already hold, pointed at a new object. Asking for the scorecard rather than the philosophy forces the specificity that makes the answer useful.","followups":["Which of those could you actually see today?","What would you watch weekly, and what only quarterly?"],"tags":["ai","management-redefined","performance","concrete"],"pack":"The Agent Manager"},{"id":"mgr-06","text":"When something it did turned out to be wrong, how would you find out why?","theme":"failure","arc":"deep","depth":"medium","industries":["universal"],"roles":["middle-manager","ai-leader"],"lands_because":"Root-cause analysis is the least discussed and most defining part of the role. It also quietly surfaces whether anything is being recorded well enough to reconstruct what happened.","followups":["Is enough being kept today to answer that?","Who would you go to, and would they be able to tell you?"],"tags":["ai","management-redefined","root-cause","observability"],"pack":"The Agent Manager"},{"id":"mgr-07","text":"What does coaching look like when the thing you are coaching never gets discouraged?","theme":"people","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Tests the teammate metaphor at its edge, which is where the interesting answer lives. Good managers spend real effort on morale and timing, and finding that half of the craft does not apply is genuinely clarifying.","followups":["So what is left of coaching, once you take that part out?","Does that make it easier or just different?"],"tags":["ai","management-redefined","coaching","clarifying"],"pack":"The Agent Manager"},{"id":"mgr-08","text":"Where should a job like that report - into your function, into the technical group, or somewhere that does not exist yet?","theme":"people","arc":"deep","depth":"medium","industries":["universal"],"roles":["middle-manager","ai-leader"],"lands_because":"Reporting lines are where an org chart admits what it actually believes. Offering three options including 'somewhere that does not exist yet' gives permission for the honest answer.","followups":["What goes wrong with each of the other two?","Where does it sit in your organization today, if anywhere?"],"tags":["ai","management-redefined","org-design"],"pack":"The Agent Manager"},{"id":"mgr-09","text":"What would someone have to be fluent in to do that job well - and which of those do you already have?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager","individual-contributor"],"lands_because":"Asks them to build the job description and then audit themselves against it. The second clause is where the episode's argument becomes personal without anyone having to assert it.","followups":["Which one would take you longest to pick up?","Which of those is hardest to hire for?"],"tags":["ai","management-redefined","capabilities","flagship"],"pack":"The Agent Manager"},{"id":"mgr-10","text":"When it hands something back to a person, who exactly should it go to - and how would it know?","theme":"judgment","arc":"deep","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Routing is a real design problem that managers solve constantly for human queues and have never been asked to write down. The 'how would it know' half turns an org fact into a specification.","followups":["What happens today when nobody obvious owns it?","How long should it wait before escalating again?"],"tags":["ai","management-redefined","escalation","handoffs"],"pack":"The Agent Manager"},{"id":"mgr-11","text":"What does your team do that a system arriving out of the box would get wrong on day one?","theme":"craft","arc":"core","depth":"medium","industries":["universal"],"roles":["middle-manager"],"lands_because":"Draws the line between what can be taken as it comes and what needs the process rethought first. It also hands them a concrete list of the things only they can supply.","followups":["Is that a quirk of your organization, or is everyone in your field like that?","Who would have to be asked before that could be built in?"],"tags":["ai","management-redefined","customization-as-superpower","turnkey-boundary"],"pack":"The Agent Manager"},{"id":"mgr-12","text":"If an automated system told one of your customers something untrue, who in your organization would be answerable for it?","theme":"ethics","arc":"deep","depth":"probing","industries":["universal"],"roles":["middle-manager","ai-leader"],"lands_because":"Accountability has already been tested externally - a tribunal held an airline responsible for what its chatbot told a customer and rejected the argument that the bot was a separate entity. Most organizations have not worked out their internal answer, and the hesitation is itself informative.","followups":["Is that written down anywhere, or is it an assumption?","Would that person know it was them?"],"tags":["ai","management-redefined","accountability","high-yield"],"pack":"The Agent Manager"},{"id":"mgr-13","text":"If this became a real job title where you work within the year, what would it be called and who would be first?","theme":"future","arc":"closer","depth":"medium","industries":["universal"],"roles":["middle-manager","individual-contributor"],"lands_because":"Makes a broad prediction local and specific, and closes the episode on a named person in a real building rather than on a trend. Frequently the answer is the guest, said sideways.","followups":["Would you want it?","What would have to be true for that to be a good job rather than a thankless one?"],"tags":["ai","management-redefined","closer","flagship"],"pack":"The Agent Manager"},{"id":"ag-01","text":"What decision do you make each year that you will not know the result of for months?","theme":"judgment","arc":"core","depth":"medium","industries":["agriculture"],"lands_because":"Captures the extraordinary feedback delay of agricultural decisions, which is what makes the judgment so hard and so different from most professions.","followups":["What do you look at when you make that call?"],"tags":["long-feedback","flagship","decision-making"],"pack":"Agriculture & Food Production"},{"id":"ag-02","text":"You do not set your price. What does that do to how you run the operation?","theme":"money","arc":"core","depth":"medium","industries":["agriculture"],"lands_because":"Stating the price-taker reality up front proves you understand the economics, and it opens directly into hedging, contracts, and cost control.","followups":["How much of your risk management is marketing versus growing?"],"tags":["economics","signals-homework","flagship"],"pack":"Agriculture & Food Production"},{"id":"ag-03","text":"What technology on your operation would surprise people who think farming has not changed?","theme":"change","arc":"warmup","depth":"light","industries":["agriculture"],"lands_because":"Guidance systems, variable-rate application, moisture sensing, and genetics are all standard and all invisible to the public. Guests enjoy correcting the record.","followups":["What has it actually changed about your yields or your hours?"],"tags":["myth-correction","easy","warmup"],"pack":"Agriculture & Food Production"},{"id":"ag-04","text":"What year nearly ended it, and what got you through?","theme":"failure","arc":"deep","depth":"probing","industries":["agriculture"],"lands_because":"Nearly every multi-generation operation has one, and it carries drought, debt, markets, and family in a single story.","followups":["Who did not make it through that year?"],"tags":["survival","story-generator","emotional"],"pack":"Agriculture & Food Production"},{"id":"ag-05","text":"How do you make a decision whose payoff lands after you are gone?","theme":"judgment","arc":"deep","depth":"medium","industries":["agriculture"],"lands_because":"Soil, orchards, herd genetics, and succession all operate on generational time. This is a genuinely distinctive form of judgment worth a whole segment.","followups":["Is there a next generation? Do you want there to be?"],"tags":["generational","succession","distinctive"],"pack":"Agriculture & Food Production"},{"id":"ag-06","text":"What do people who write about food get wrong about how it is grown?","theme":"myths","arc":"core","depth":"medium","industries":["agriculture"],"lands_because":"Invites correction of the food-media narrative from someone with standing to do it, without you having to take a side on any of it.","followups":["Is there a criticism of your industry you think is fair?"],"tags":["myth-correction","balanced"],"pack":"Agriculture & Food Production"},{"id":"art-01","text":"What does the work look like on a bad day when you show up anyway?","theme":"craft","arc":"core","depth":"medium","industries":["creative-arts"],"lands_because":"Treats creative work as labor rather than as visitation, which is how working artists actually experience it and how interviewers rarely frame it.","followups":["Is the work from those days distinguishable later?"],"tags":["process","anti-romance","flagship"],"pack":"Creative Arts"},{"id":"art-02","text":"What did you cut from something you are proud of, and why?","theme":"judgment","arc":"core","depth":"medium","industries":["creative-arts"],"lands_because":"Editorial judgment is the least discussed and most decisive part of making anything. It gets a specific answer where questions about intention get abstraction.","followups":["Do you still have it? Do you look at it?"],"tags":["revision","judgment","specific"],"pack":"Creative Arts"},{"id":"art-03","text":"Who owns what you made, and did you understand the deal when you signed it?","theme":"money","arc":"deep","depth":"probing","industries":["creative-arts"],"lands_because":"Rights and ownership determine an artist's entire economic life and almost never come up in interviews. Guests frequently have a hard-won story here.","followups":["What do you tell people coming up about contracts?"],"tags":["rights","business","underasked","high-yield"],"pack":"Creative Arts"},{"id":"art-04","text":"What pays for the work? Be specific about the mix.","theme":"money","arc":"core","depth":"medium","industries":["creative-arts"],"lands_because":"Teaching, commissions, licensing, touring, day jobs, patronage - the real mix is far more interesting and useful than the myth of living off the art.","followups":["Has the mix changed? Which part is disappearing?"],"tags":["economics","honest","audience-gift"],"pack":"Creative Arts"},{"id":"art-05","text":"How do you tell the difference between criticism worth taking and criticism worth ignoring?","theme":"judgment","arc":"core","depth":"medium","industries":["creative-arts"],"lands_because":"A real working problem with a real technique behind it, and it avoids both the fragile-artist and impervious-genius stereotypes.","followups":["Whose note do you always take seriously?"],"tags":["criticism","practical"],"pack":"Creative Arts"},{"id":"art-06","text":"What has changed about reaching an audience, and what has that done to the work itself?","theme":"change","arc":"deep","depth":"medium","industries":["creative-arts"],"lands_because":"The second clause is the real question - platform incentives shaping form, length, and pacing is something artists feel keenly and discuss rarely.","followups":["Have you made something differently because of it?"],"tags":["platforms","incentives","high-yield"],"pack":"Creative Arts"},{"id":"def-01","text":"What was your actual job, day to day?","theme":"craft","arc":"opener","depth":"light","industries":["defense-military"],"lands_because":"Almost nobody asks. It treats service as a profession with a specialty rather than as a single undifferentiated experience, and it opens the whole conversation correctly.","followups":["What were you responsible for that would surprise a civilian?"],"tags":["opener","respectful","flagship"],"pack":"Defense & Military"},{"id":"def-02","text":"What were you responsible for at an age when your civilian peers were not responsible for anything?","theme":"people","arc":"core","depth":"medium","industries":["defense-military"],"lands_because":"The scale of early responsibility - equipment, budgets, people's lives - is one of the genuinely distinctive features of military service and is easy to speak about with pride.","followups":["Were you ready? Who made sure you were?"],"tags":["responsibility","distinctive"],"pack":"Defense & Military"},{"id":"def-03","text":"How did you learn to lead people who did not choose you?","theme":"people","arc":"core","depth":"medium","industries":["defense-military"],"lands_because":"Leadership under assigned authority is the military's deepest institutional expertise, and it transfers directly to a civilian audience.","followups":["What did you get wrong at first?"],"tags":["leadership","transferable","audience-gift"],"pack":"Defense & Military"},{"id":"def-04","text":"What broke down between the plan and the reality, and how did you handle it?","theme":"judgment","arc":"core","depth":"medium","industries":["defense-military"],"lands_because":"Gets operational judgment and improvisation without asking about combat. The guest controls how close to the line they go.","followups":["Who did you rely on when it did?"],"tags":["operations","guest-controls-depth"],"pack":"Defense & Military"},{"id":"def-05","text":"What did civilian employers completely fail to understand about what you had done?","theme":"change","arc":"deep","depth":"medium","industries":["defense-military"],"lands_because":"Translation failure in the transition is a widely shared and rarely aired frustration, and it is useful to a listening audience of hiring managers.","followups":["What should they have asked you?"],"tags":["transition","practical","high-yield"],"pack":"Defense & Military"},{"id":"def-06","text":"What do you miss, and what are you glad to be done with?","theme":"personal","arc":"closer","depth":"medium","industries":["defense-military"],"lands_because":"The two-sided structure allows both the loss of cohesion and the relief of leaving, which is exactly the ambivalence most veterans actually feel.","followups":["Have you found anything like it since?"],"tags":["closer","ambivalence","warm"],"pack":"Defense & Military"},{"id":"edu-01","text":"What can you tell about a class in the first week that shapes the whole year?","theme":"craft","arc":"core","depth":"medium","industries":["education"],"lands_because":"Classroom read is a real and highly developed skill, and asking about it treats teaching as expertise rather than as vocation.","followups":["What do you do differently once you know?"],"tags":["craft","expertise","flagship"],"pack":"Education"},{"id":"edu-02","text":"What is the difference between a lesson that works and the same lesson falling flat?","theme":"craft","arc":"core","depth":"medium","industries":["education"],"lands_because":"Same material, different outcome - it isolates the teaching itself from the curriculum, which is exactly the thing that is hard to name and rarely credited.","followups":["Can you feel it going wrong in real time? What do you do?"],"tags":["craft","tacit-knowledge"],"pack":"Education"},{"id":"edu-03","text":"How much of your job is teaching, and what is the rest?","theme":"invisible","arc":"core","depth":"medium","industries":["education"],"lands_because":"Opens onto documentation, meetings, behavior management, counseling, and family communication - the parts that expanded without anyone deciding they should.","followups":["When did the rest start growing?"],"tags":["scope-creep","invisible-labor"],"pack":"Education"},{"id":"edu-04","text":"What does a student learn from you that no test will ever pick up?","theme":"craft","arc":"deep","depth":"medium","industries":["education"],"lands_because":"Lets a teacher speak about what they actually value, in direct contrast to the measurement regime they work under, without asking them to attack it.","followups":["Does anyone in the building measure that?"],"tags":["values","measurement","safe-dissent"],"pack":"Education"},{"id":"edu-05","text":"What reform arrived with a mandate and a training day and then quietly disappeared?","theme":"change","arc":"deep","depth":"medium","industries":["education"],"lands_because":"Teachers have watched a decade of these and are rarely asked to evaluate them. The answers are specific, funny, and often furious.","followups":["Was any of it good? What should have survived?"],"tags":["reform-cycle","candid","high-yield"],"pack":"Education"},{"id":"edu-06","text":"Which student do you still think about?","theme":"personal","arc":"closer","depth":"probing","industries":["education"],"lands_because":"Almost always produces the emotional center of the episode. Place it late, ask it quietly, and do not fill the silence.","followups":[],"avoid_if":"Early in the interview, or with a guest who has stayed formal. It needs a warmed-up room.","tags":["emotional","closer","silence-after"],"pack":"Education"},{"id":"eng-01","text":"Walk me through a storm restoration from the moment the lights go out.","theme":"craft","arc":"core","depth":"medium","industries":["energy"],"lands_because":"Mutual aid, crew logistics, prioritization, and public pressure all in one operational story. It is the most vivid material this industry has.","followups":["How do you decide whose power comes back first?"],"tags":["operations","story-generator","vivid"],"pack":"Energy & Utilities"},{"id":"eng-02","text":"How much of a project is engineering, and how much is permitting and interconnection?","theme":"invisible","arc":"core","depth":"medium","industries":["energy"],"lands_because":"Permitting and interconnection queues dominate project timelines and are invisible to the public. Naming them proves you know where the bottleneck actually is.","followups":["What would it take to shorten that?"],"tags":["permitting","signals-homework","flagship"],"pack":"Energy & Utilities"},{"id":"eng-03","text":"What does the public misunderstand about how the grid actually stays balanced?","theme":"myths","arc":"core","depth":"medium","industries":["energy"],"lands_because":"Grid operators genuinely enjoy explaining this, and second-by-second balancing is a great piece of audience education.","followups":["What is the scariest hour you have watched on the board?"],"tags":["education","myth-correction"],"pack":"Energy & Utilities"},{"id":"eng-04","text":"You cannot simply build what you think is best - who has to approve it, and how does that change the engineering?","theme":"change","arc":"core","depth":"medium","industries":["energy"],"lands_because":"Acknowledges regulatory constraint up front, which frees the guest to describe how rate cases and commissions actually shape technical decisions.","followups":["What would you build if the constraint disappeared?"],"tags":["regulation","signals-homework"],"pack":"Energy & Utilities"},{"id":"eng-05","text":"In a field where success is nothing happening, how do you know when you have done well?","theme":"craft","arc":"deep","depth":"medium","industries":["energy"],"lands_because":"Names the central psychological oddity of reliability work. It is a distinctive question that yields something genuinely reflective.","followups":["Does anyone outside ever notice?"],"tags":["reliability","distinctive","reflective"],"pack":"Energy & Utilities"},{"id":"eng-06","text":"What does the energy transition look like from inside operations, as opposed to from a conference stage?","theme":"change","arc":"deep","depth":"medium","industries":["energy"],"lands_because":"Invites the operational reality - interconnection, materials, workforce, dispatchability - without asking the guest to take a political position.","followups":["What is harder than people think? What is easier?"],"tags":["transition","operational","depoliticized"],"pack":"Energy & Utilities"},{"id":"fin-01","text":"How do you tell the difference between being wrong and being early?","theme":"judgment","arc":"core","depth":"medium","industries":["finance"],"lands_because":"The defining epistemics of the job, and a question anyone who takes risk has genuinely wrestled with. It gets past compliance because it is about method, not positioning.","followups":["What is your actual rule for cutting a losing position?"],"tags":["calibration","flagship","compliance-safe"],"pack":"Finance & Insurance"},{"id":"fin-02","text":"What does your model not capture, and how do you account for that?","theme":"craft","arc":"core","depth":"medium","industries":["finance"],"lands_because":"Every quantitative professional knows the boundary of their model, and describing it is the most honest form of expertise they can offer publicly.","followups":["When did that gap last cost you?"],"tags":["models","limits","honest"],"pack":"Finance & Insurance"},{"id":"fin-03","text":"Who bears the risk when you are wrong - you, the firm, or the client?","theme":"money","arc":"deep","depth":"probing","industries":["finance"],"lands_because":"Goes directly at the asymmetry that defines the industry's reputation, framed structurally so it can be answered without self-indictment.","followups":["Should that be different?"],"tags":["risk-asymmetry","structural","high-yield"],"pack":"Finance & Insurance"},{"id":"fin-04","text":"What is the most consequential thing you have to explain to clients that they consistently do not want to believe?","theme":"people","arc":"core","depth":"medium","industries":["finance"],"lands_because":"Works for advisors, underwriters, and adjusters alike, and produces practical value for the audience without touching a specific recommendation.","followups":["What actually gets through to them?"],"tags":["client-communication","audience-gift"],"pack":"Finance & Insurance"},{"id":"fin-05","text":"What behavior does your compensation structure produce that nobody would defend in the abstract?","theme":"money","arc":"deep","depth":"probing","industries":["finance"],"lands_because":"Everyone in finance has an answer - quarter-end behavior, gathering assets over serving them, volume over quality - and the abstract framing makes it safe to give.","followups":["Has anyone tried to fix it?"],"avoid_if":"The guest currently sets compensation policy at a named firm.","tags":["incentives","critique","high-yield"],"pack":"Finance & Insurance"},{"id":"fin-06","text":"What did 2008, or the closest equivalent in your corner of the industry, actually teach you - as opposed to what everyone says it taught them?","theme":"failure","arc":"deep","depth":"medium","industries":["finance"],"lands_because":"The clause rejecting the received lesson is what makes it work. It forces past the rehearsed narrative into what the guest personally changed.","followups":["What do you do differently now, concretely?"],"tags":["crisis","anti-narrative"],"pack":"Finance & Insurance"},{"id":"hc-01","text":"How much of your day is medicine, and how much is documentation, coding, and prior authorization?","theme":"invisible","arc":"core","depth":"medium","industries":["healthcare"],"lands_because":"Names the administrative load without editorializing. It signals immediately that you know the clinical work is not the whole job, which is what most interviewers miss.","followups":["What would you do with that time back?"],"tags":["administrative-burden","signals-homework"],"pack":"Healthcare & Medicine"},{"id":"hc-02","text":"What do you know within thirty seconds of walking into a room that you would struggle to justify on the chart?","theme":"craft","arc":"core","depth":"medium","industries":["healthcare"],"lands_because":"Clinical gestalt is real, taught informally, and hard to document. Asking about the gap between knowing and charting is deeply insider.","followups":["Has it ever been wrong in a way that mattered?"],"tags":["gestalt","tacit-knowledge","flagship"],"pack":"Healthcare & Medicine"},{"id":"hc-03","text":"How does your institution handle it when something goes wrong - and what is the difference between the formal process and what actually happens?","theme":"failure","arc":"deep","depth":"probing","industries":["healthcare"],"lands_because":"Morbidity and mortality review is one of the few genuinely institutionalized error cultures in professional life, and the gap between its form and its practice is the interesting part.","followups":["Who supports the clinician afterward?"],"avoid_if":"The guest has a pending case or is speaking on behalf of an employer.","tags":["error-culture","structural","second-victim"],"pack":"Healthcare & Medicine"},{"id":"hc-04","text":"When a patient's insurance dictates a course you disagree with, what actually happens next?","theme":"ethics","arc":"deep","depth":"medium","industries":["healthcare"],"lands_because":"Concrete and procedural rather than a broad political question about healthcare, so it produces a real story instead of a position statement.","followups":["How often do you win those?"],"tags":["payer-conflict","concrete","high-yield"],"pack":"Healthcare & Medicine"},{"id":"hc-05","text":"What do you tell patients that is true but incomplete, and how do you decide where to stop?","theme":"ethics","arc":"deep","depth":"probing","industries":["healthcare"],"lands_because":"Communication calibration is a genuine daily ethical practice, not a scandal, and framing it that way gets an honest answer rather than a defensive one.","followups":["Who taught you how to do that? Anyone?"],"tags":["disclosure","communication","nuanced"],"pack":"Healthcare & Medicine"},{"id":"hc-06","text":"Who on the care team knows the most about what is actually happening with a patient?","theme":"people","arc":"core","depth":"medium","industries":["healthcare"],"lands_because":"The answer is usually the bedside nurse or a tech, and the hierarchy question underneath it is one clinicians enjoy being asked honestly.","followups":["Does the structure make it easy for them to say so?"],"tags":["hierarchy","nursing","credit"],"pack":"Healthcare & Medicine"},{"id":"hos-01","text":"Anyone can execute one perfect plate. What does it take to do four hundred without a miss?","theme":"craft","arc":"core","depth":"medium","industries":["hospitality"],"lands_because":"Names consistency under volume as the real skill, which is the industry's own definition of excellence and the opposite of the television version.","followups":["Where does it break down first when it breaks down?"],"tags":["consistency","flagship","signals-homework"],"pack":"Hospitality & Food Service"},{"id":"hos-02","text":"Take me through the ten minutes when a service starts going wrong.","theme":"failure","arc":"core","depth":"medium","industries":["hospitality"],"lands_because":"Time-bounded, high-adrenaline, and vivid on audio. Everyone in the industry has lived it and can narrate it beat by beat.","followups":["Who pulls it back - and is it always the same person?"],"tags":["drama","story-generator","audio-friendly"],"pack":"Hospitality & Food Service"},{"id":"hos-03","text":"A full dining room does not mean a profitable one. Where does the money actually go?","theme":"money","arc":"core","depth":"medium","industries":["hospitality"],"lands_because":"Leading with the correction proves you understand the economics, and operators are eager to explain food cost, labor, and rent to someone who will listen.","followups":["What is the decision you make purely for margin that you wish you did not?"],"tags":["economics","signals-homework","flagship"],"pack":"Hospitality & Food Service"},{"id":"hos-04","text":"What is the relationship between front of house and back of house really like?","theme":"people","arc":"core","depth":"medium","industries":["hospitality"],"lands_because":"The central social divide of a restaurant, including the pay asymmetry between tipped and non-tipped staff. Asking about both halves signals you know there are two.","followups":["Does the tipping structure make that worse?"],"tags":["org-dynamics","tipping","structural"],"pack":"Hospitality & Food Service"},{"id":"hos-05","text":"What has changed about staffing since 2020, and what did the industry learn or refuse to learn?","theme":"change","arc":"deep","depth":"medium","industries":["hospitality"],"lands_because":"Labor is the live issue in the industry, and the 'refuse to learn' clause invites a real assessment instead of a defensive one.","followups":["What are you doing differently as an employer?"],"tags":["labor","current","candid"],"pack":"Hospitality & Food Service"},{"id":"hos-06","text":"What is the guest behavior that never makes it into the review but shapes the whole night?","theme":"invisible","arc":"core","depth":"medium","industries":["hospitality"],"lands_because":"Flips the review-driven power dynamic and lets the guest speak from the other side of it, which is both cathartic and genuinely informative.","followups":["What does a genuinely good guest do?"],"tags":["power-flip","cathartic","audience-gift"],"pack":"Hospitality & Food Service"},{"id":"law-01","text":"How much of your work is arguing, and how much is predicting what the other side will do?","theme":"craft","arc":"core","depth":"medium","industries":["law"],"lands_because":"Corrects the courtroom-drama frame from inside. Most legal work is anticipation and risk allocation, and lawyers appreciate an interviewer who already suspects that.","followups":["When did you get good at the predicting part?"],"tags":["myth-correction","signals-homework"],"pack":"Law"},{"id":"law-02","text":"What do you know about a case in the first meeting that the client does not want to hear yet?","theme":"judgment","arc":"core","depth":"medium","industries":["law"],"lands_because":"Early case assessment is a real skill, and the tension between honest evaluation and client management is the daily texture of practice.","followups":["How do you eventually tell them?"],"tags":["client-management","assessment"],"pack":"Law"},{"id":"law-03","text":"What does the billable hour do to how you work?","theme":"money","arc":"deep","depth":"probing","industries":["law"],"lands_because":"The central economic distortion of private practice, felt by everyone in it, and rarely discussed with an outsider who understands it is a structural question rather than an accusation.","followups":["Have you worked under a different model? Was it better?"],"avoid_if":"The guest is a public defender, judge, or in-house counsel - use a workload or caseload question instead.","tags":["incentives","billable-hour","high-yield"],"pack":"Law"},{"id":"law-04","text":"What is the most common misconception your clients arrive with about how the law works?","theme":"myths","arc":"core","depth":"light","industries":["law"],"lands_because":"Easy, generous, and it lets the guest be useful to the audience. Also surfaces the gap between legal reality and public understanding, which is the point of the episode.","followups":["Where does that idea come from?"],"tags":["easy","audience-gift"],"pack":"Law"},{"id":"law-05","text":"Where is the line between zealous advocacy and something you would not do?","theme":"ethics","arc":"deep","depth":"probing","industries":["law"],"lands_because":"Uses the profession's own language, which signals you know the duty is real and not a loophole. That framing gets a considered answer instead of a defensive one.","followups":["Have you watched someone cross it?"],"tags":["ethics","native-vocabulary","flagship"],"pack":"Law"},{"id":"law-06","text":"What does the system do well that critics miss, and what do the critics get right?","theme":"change","arc":"deep","depth":"medium","industries":["law"],"lands_because":"The two-sided structure lets a lawyer defend the institution and criticize it in the same answer, which is where their actual view usually lives.","followups":["What reform would you actually support?"],"tags":["balanced","reform","nuance"],"pack":"Law"},{"id":"log-01","text":"How much of your job is executing the plan versus handling everything that breaks it?","theme":"craft","arc":"core","depth":"medium","industries":["logistics"],"lands_because":"Exception handling is the actual work, and framing it that way immediately separates you from interviewers who think supply chain is a spreadsheet.","followups":["What broke this week?"],"tags":["exception-handling","flagship","signals-homework"],"pack":"Logistics & Supply Chain"},{"id":"log-02","text":"Where is the constraint in your network right now, and how did you know before the data showed it?","theme":"judgment","arc":"core","depth":"medium","industries":["logistics"],"lands_because":"Constraint-spotting ahead of the reporting is exactly what expertise looks like in this field, and it is a satisfying thing for a practitioner to explain.","followups":["Who told you? A person or a system?"],"tags":["expertise","constraints"],"pack":"Logistics & Supply Chain"},{"id":"log-03","text":"How much of this industry still runs on personal relationships and a phone call?","theme":"people","arc":"core","depth":"medium","industries":["logistics"],"lands_because":"The persistence of relationship-based capacity brokering inside a supposedly digitized industry is one of the best untold stories in logistics.","followups":["What can you get with a call that no platform will get you?"],"tags":["relationships","underasked","flagship"],"pack":"Logistics & Supply Chain"},{"id":"log-04","text":"Tell me about a shipment that went wrong in a way you had never seen before.","theme":"failure","arc":"core","depth":"medium","industries":["logistics"],"lands_because":"Logistics failures are concrete, geographically vivid, and often absurd. Reliable story generator with real systems insight underneath.","followups":["What did you change afterward?"],"tags":["story-generator","vivid"],"pack":"Logistics & Supply Chain"},{"id":"log-05","text":"What did the disruption years actually expose that was already fragile?","theme":"change","arc":"deep","depth":"medium","industries":["logistics"],"lands_because":"Reframes 2020-22 as revelation rather than cause, which is how people inside the industry think about it and how outsiders generally do not.","followups":["Has any of it actually been fixed, or just re-priced?"],"tags":["resilience","reframe","high-yield"],"pack":"Logistics & Supply Chain"},{"id":"log-06","text":"Who in this chain absorbs the cost when something goes wrong?","theme":"money","arc":"deep","depth":"probing","industries":["logistics"],"lands_because":"Follows the risk down the chain to drivers, small carriers, and warehouse labor. Structural framing makes it answerable without indicting anyone by name.","followups":["Is that where it should sit?"],"tags":["risk-asymmetry","labor","structural"],"pack":"Logistics & Supply Chain"},{"id":"mfg-01","text":"What does the process document say, and what does the line actually do?","theme":"craft","arc":"core","depth":"medium","industries":["manufacturing"],"lands_because":"The gap between documented and actual process is where all the real knowledge lives, and everyone on a floor knows it exists.","followups":["Who holds the undocumented version?"],"tags":["tacit-knowledge","flagship"],"pack":"Manufacturing"},{"id":"mfg-02","text":"Can you hear when something is wrong before the instruments say so?","theme":"craft","arc":"core","depth":"medium","industries":["manufacturing"],"lands_because":"Sensory expertise is real on a floor and delightful on audio. It also opens the broader question of what happens to that knowledge as sensors replace it.","followups":["Is that being lost as the equipment gets smarter?"],"tags":["sensory","vivid","audio-friendly"],"pack":"Manufacturing"},{"id":"mfg-03","text":"Tell me about a line-down. What actually happens in the first hour?","theme":"failure","arc":"core","depth":"medium","industries":["manufacturing"],"lands_because":"High-stakes, concrete, time-bounded, and expensive by the minute. Uses native vocabulary, which immediately establishes that you know the world.","followups":["Who gets called, in what order?"],"tags":["native-vocabulary","drama","story-generator"],"pack":"Manufacturing"},{"id":"mfg-04","text":"Where is the real tension between the floor and the office?","theme":"people","arc":"deep","depth":"medium","industries":["manufacturing"],"lands_because":"The defining social structure of a plant. Whichever side the guest sits on, they have a detailed and rarely solicited view of the other.","followups":["When has the other side been right?"],"tags":["org-dynamics","structural"],"pack":"Manufacturing"},{"id":"mfg-05","text":"What automation has actually worked in your plant, and what got quietly rolled back?","theme":"change","arc":"core","depth":"medium","industries":["manufacturing"],"lands_because":"The rollback half is the question nobody asks. Failed automation projects are common, instructive, and rarely discussed publicly.","followups":["Why did it fail - the technology or the implementation?"],"tags":["automation","failure","underasked"],"pack":"Manufacturing"},{"id":"mfg-06","text":"What quality problem have you seen shipped because the schedule won?","theme":"ethics","arc":"deep","depth":"probing","industries":["manufacturing"],"lands_because":"The core ethical pressure of production work, asked concretely enough to produce a real answer rather than a policy statement.","followups":["What happened downstream?"],"avoid_if":"The guest holds current quality authority at a named employer and the answer could create liability.","tags":["quality","pressure","high-yield"],"pack":"Manufacturing"},{"id":"med-01","text":"How do you decide a story is solid enough to publish?","theme":"judgment","arc":"core","depth":"medium","industries":["media-journalism"],"lands_because":"Verification standards are the profession's actual craft, and asking about the threshold rather than the scoop is a question they respect.","followups":["When did you hold something you wanted to run?"],"tags":["verification","craft","flagship"],"pack":"Media & Journalism"},{"id":"med-02","text":"What is the story you could not get, and what stopped it?","theme":"failure","arc":"deep","depth":"medium","industries":["media-journalism"],"lands_because":"Killed and unprovable stories are a genuine grief in the profession, and the reasons - sourcing, legal, resources, access - are individually revealing.","followups":["Do you think it was true?"],"avoid_if":"The story is still live or the answer would identify a source.","tags":["killed-stories","candid"],"pack":"Media & Journalism"},{"id":"med-03","text":"What does a source want from you, and how do you keep that from shaping the coverage?","theme":"ethics","arc":"deep","depth":"probing","industries":["media-journalism"],"lands_because":"The transactional reality of sourcing is well understood inside the profession and poorly understood outside. It respects the relationship without asking them to burn it.","followups":["Have you ever been used? Did you know at the time?"],"tags":["sourcing","ethics","high-yield"],"pack":"Media & Journalism"},{"id":"med-04","text":"How much of what you do is reporting, and how much is now audience and distribution work?","theme":"invisible","arc":"core","depth":"medium","industries":["media-journalism"],"lands_because":"The expansion of the job into promotion and metrics is universal and resented, and asking about it acknowledges a change nobody chose.","followups":["Does the metric change what you pitch?"],"tags":["scope-creep","metrics","current"],"pack":"Media & Journalism"},{"id":"med-05","text":"What does the public misunderstand about how an article actually gets made?","theme":"myths","arc":"core","depth":"medium","industries":["media-journalism"],"lands_because":"Headlines they did not write, editors, legal review, and space constraints - useful audience education and a chance for the guest to correct a grievance fairly.","followups":["What criticism of the press do you think is actually fair?"],"tags":["process","myth-correction","balanced"],"pack":"Media & Journalism"},{"id":"med-06","text":"Who is paying for journalism now, and what does that money want?","theme":"money","arc":"deep","depth":"probing","industries":["media-journalism"],"lands_because":"Subscriptions, philanthropy, events, and ownership each pull differently. Journalists analyze this constantly and are rarely asked to say it out loud.","followups":["What kind of story does that model make harder to do?"],"tags":["business-model","structural","high-yield"],"pack":"Media & Journalism"},{"id":"npo-01","text":"How do funder priorities change what your programs actually do?","theme":"money","arc":"deep","depth":"probing","industries":["nonprofit"],"lands_because":"The central structural tension of the sector. Framing it as a systemic force rather than a personal compromise gets a real answer.","followups":["What would you do differently with unrestricted money?"],"tags":["funding","structural","flagship"],"pack":"Nonprofit & Social Impact"},{"id":"npo-02","text":"What are you required to measure, and what actually tells you the work is working?","theme":"craft","arc":"core","depth":"medium","industries":["nonprofit"],"lands_because":"Outputs versus outcomes is a genuine methodological problem here, not a dodge, and practitioners have thought hard about the gap.","followups":["What is the signal you trust that would never make a grant report?"],"tags":["measurement","impact","high-yield"],"pack":"Nonprofit & Social Impact"},{"id":"npo-03","text":"What does the community you serve ask for that funders will not pay for?","theme":"ethics","arc":"deep","depth":"probing","industries":["nonprofit"],"lands_because":"Centers the people served as agents with their own account of what they need, and exposes the mismatch without making the guest attack a funder by name.","followups":["Have you ever funded it anyway?"],"tags":["participation","mismatch","high-yield"],"pack":"Nonprofit & Social Impact"},{"id":"npo-04","text":"What happens in your organization when a grant cycle ends and the need does not?","theme":"money","arc":"core","depth":"medium","industries":["nonprofit"],"lands_because":"Funding cliffs are the operational reality of the sector - staff losses, program shutdowns, relationships broken - and produce concrete stories.","followups":["What does that do to the people you were serving?"],"tags":["funding-cliff","operational","concrete"],"pack":"Nonprofit & Social Impact"},{"id":"npo-05","text":"How do you talk about the work to donors versus how you talk about it in the staff meeting?","theme":"myths","arc":"deep","depth":"probing","industries":["nonprofit"],"lands_because":"Names the two-register communication everyone in the sector performs, in a way that is understanding rather than accusatory.","followups":["Does the donor version ever start to distort the work itself?"],"tags":["narrative","candid","two-register"],"pack":"Nonprofit & Social Impact"},{"id":"npo-06","text":"What would it look like if your organization succeeded so completely that it should close?","theme":"future","arc":"closer","depth":"medium","industries":["nonprofit"],"lands_because":"The institutional self-perpetuation question, asked as an aspiration rather than an accusation. It reliably produces something thoughtful.","followups":["Is anything in the structure working against that?"],"tags":["mission","closer","provocative-but-kind"],"pack":"Nonprofit & Social Impact"},{"id":"gov-01","text":"When someone says 'why don't you just' about your agency, what is the actual answer?","theme":"craft","arc":"core","depth":"medium","industries":["public-sector"],"lands_because":"Invites the guest to explain the statutory and procedural machinery behind an apparent absurdity. It is the single most clarifying question you can ask a civil servant. The phrase is quoted here as the public's dismissal, not aimed at the guest - the question exists to let them answer it.","followups":["Who would have to change what for it to work differently?"],"tags":["constraints","flagship","clarifying"],"pack":"Public Sector & Government"},{"id":"gov-02","text":"What discretion do you actually have, and where does it run out?","theme":"judgment","arc":"core","depth":"medium","industries":["public-sector"],"lands_because":"Street-level discretion is where policy meets a person, and mapping its boundary is both fascinating and rarely solicited.","followups":["When did you use it in a way you are proud of?"],"tags":["discretion","distinctive"],"pack":"Public Sector & Government"},{"id":"gov-03","text":"What survives changes in administration, and what gets undone every few years?","theme":"change","arc":"deep","depth":"medium","industries":["public-sector"],"lands_because":"Lets career staff speak to institutional continuity without commenting on any party, which is exactly the space they can legitimately occupy.","followups":["What is the cost of that cycle?"],"tags":["continuity","nonpartisan-safe","high-yield"],"pack":"Public Sector & Government"},{"id":"gov-04","text":"What does the public experience of your agency feel like, and how much of that is by design?","theme":"ethics","arc":"deep","depth":"probing","industries":["public-sector"],"lands_because":"Administrative burden - forms, waits, proof requirements - is sometimes deliberate policy and sometimes accumulated neglect. Distinguishing them is genuinely revealing.","followups":["What would you simplify first?"],"tags":["administrative-burden","structural","high-yield"],"pack":"Public Sector & Government"},{"id":"gov-05","text":"What is the failure the public never hears about because the process worked?","theme":"invisible","arc":"core","depth":"medium","industries":["public-sector"],"lands_because":"Prevention is invisible by nature and public service is largely prevention. It gives the guest a rare chance to describe a success no one witnessed.","followups":["How do you defend the budget for something that succeeds silently?"],"tags":["prevention","invisible
