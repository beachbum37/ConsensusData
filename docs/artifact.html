ts, people's lives - is one of the genuinely distinctive features of military service and is easy to speak about with pride.","followups":["Were you ready? Who made sure you were?"],"tags":["responsibility","distinctive"],"pack":"Defense & Military"},{"id":"def-03","text":"How did you learn to lead people who did not choose you?","theme":"people","arc":"core","depth":"medium","industries":["defense-military"],"lands_because":"Leadership under assigned authority is the military's deepest institutional expertise, and it transfers directly to a civilian audience.","followups":["What did you get wrong at first?"],"tags":["leadership","transferable","audience-gift"],"pack":"Defense & Military"},{"id":"def-04","text":"What broke down between the plan and the reality, and how did you handle it?","theme":"judgment","arc":"core","depth":"medium","industries":["defense-military"],"lands_because":"Gets operational judgment and improvisation without asking about combat. The guest controls how close to the line they go.","followups":["Who did you rely on when it did?"],"tags":["operations","guest-controls-depth"],"pack":"Defense & Military"},{"id":"def-05","text":"What did civilian employers completely fail to understand about what you had done?","theme":"change","arc":"deep","depth":"medium","industries":["defense-military"],"lands_because":"Translation failure in the transition is a widely shared and rarely aired frustration, and it is useful to a listening audience of hiring managers.","followups":["What should they have asked you?"],"tags":["transition","practical","high-yield"],"pack":"Defense & Military"},{"id":"def-06","text":"What do you miss, and what are you glad to be done with?","theme":"personal","arc":"closer","depth":"medium","industries":["defense-military"],"lands_because":"The two-sided structure allows both the loss of cohesion and the relief of leaving, which is exactly the ambivalence most veterans actually feel.","followups":["Have you found anything like it since?"],"tags":["closer","ambivalence","warm"],"pack":"Defense & Military"},{"id":"edu-01","text":"What can you tell about a class in the first week that shapes the whole year?","theme":"craft","arc":"core","depth":"medium","industries":["education"],"lands_because":"Classroom read is a real and highly developed skill, and asking about it treats teaching as expertise rather than as vocation.","followups":["What do you do differently once you know?"],"tags":["craft","expertise","flagship"],"pack":"Education"},{"id":"edu-02","text":"What is the difference between a lesson that works and the same lesson falling flat?","theme":"craft","arc":"core","depth":"medium","industries":["education"],"lands_because":"Same material, different outcome - it isolates the teaching itself from the curriculum, which is exactly the thing that is hard to name and rarely credited.","followups":["Can you feel it going wrong in real time? What do you do?"],"tags":["craft","tacit-knowledge"],"pack":"Education"},{"id":"edu-03","text":"How much of your job is teaching, and what is the rest?","theme":"invisible","arc":"core","depth":"medium","industries":["education"],"lands_because":"Opens onto documentation, meetings, behavior management, counseling, and family communication - the parts that expanded without anyone deciding they should.","followups":["When did the rest start growing?"],"tags":["scope-creep","invisible-labor"],"pack":"Education"},{"id":"edu-04","text":"What does a student learn from you that no test will ever pick up?","theme":"craft","arc":"deep","depth":"medium","industries":["education"],"lands_because":"Lets a teacher speak about what they actually value, in direct contrast to the measurement regime they work under, without asking them to attack it.","followups":["Does anyone in the building measure that?"],"tags":["values","measurement","safe-dissent"],"pack":"Education"},{"id":"edu-05","text":"What reform arrived with a mandate and a training day and then quietly disappeared?","theme":"change","arc":"deep","depth":"medium","industries":["education"],"lands_because":"Teachers have watched a decade of these and are rarely asked to evaluate them. The answers are specific, funny, and often furious.","followups":["Was any of it good? What should have survived?"],"tags":["reform-cycle","candid","high-yield"],"pack":"Education"},{"id":"edu-06","text":"Which student do you still think about?","theme":"personal","arc":"closer","depth":"probing","industries":["education"],"lands_because":"Almost always produces the emotional center of the episode. Place it late, ask it quietly, and do not fill the silence.","followups":[],"avoid_if":"Early in the interview, or with a guest who has stayed formal. It needs a warmed-up room.","tags":["emotional","closer","silence-after"],"pack":"Education"},{"id":"eng-01","text":"Walk me through a storm restoration from the moment the lights go out.","theme":"craft","arc":"core","depth":"medium","industries":["energy"],"lands_because":"Mutual aid, crew logistics, prioritization, and public pressure all in one operational story. It is the most vivid material this industry has.","followups":["How do you decide whose power comes back first?"],"tags":["operations","story-generator","vivid"],"pack":"Energy & Utilities"},{"id":"eng-02","text":"How much of a project is engineering, and how much is permitting and interconnection?","theme":"invisible","arc":"core","depth":"medium","industries":["energy"],"lands_because":"Permitting and interconnection queues dominate project timelines and are invisible to the public. Naming them proves you know where the bottleneck actually is.","followups":["What would it take to shorten that?"],"tags":["permitting","signals-homework","flagship"],"pack":"Energy & Utilities"},{"id":"eng-03","text":"What does the public misunderstand about how the grid actually stays balanced?","theme":"myths","arc":"core","depth":"medium","industries":["energy"],"lands_because":"Grid operators genuinely enjoy explaining this, and second-by-second balancing is a great piece of audience education.","followups":["What is the scariest hour you have watched on the board?"],"tags":["education","myth-correction"],"pack":"Energy & Utilities"},{"id":"eng-04","text":"You cannot simply build what you think is best - who has to approve it, and how does that change the engineering?","theme":"change","arc":"core","depth":"medium","industries":["energy"],"lands_because":"Acknowledges regulatory constraint up front, which frees the guest to describe how rate cases and commissions actually shape technical decisions.","followups":["What would you build if the constraint disappeared?"],"tags":["regulation","signals-homework"],"pack":"Energy & Utilities"},{"id":"eng-05","text":"In a field where success is nothing happening, how do you know when you have done well?","theme":"craft","arc":"deep","depth":"medium","industries":["energy"],"lands_because":"Names the central psychological oddity of reliability work. It is a distinctive question that yields something genuinely reflective.","followups":["Does anyone outside ever notice?"],"tags":["reliability","distinctive","reflective"],"pack":"Energy & Utilities"},{"id":"eng-06","text":"What does the energy transition look like from inside operations, as opposed to from a conference stage?","theme":"change","arc":"deep","depth":"medium","industries":["energy"],"lands_because":"Invites the operational reality - interconnection, materials, workforce, dispatchability - without asking the guest to take a political position.","followups":["What is harder than people think? What is easier?"],"tags":["transition","operational","depoliticized"],"pack":"Energy & Utilities"},{"id":"fin-01","text":"How do you tell the difference between being wrong and being early?","theme":"judgment","arc":"core","depth":"medium","industries":["finance"],"lands_because":"The defining epistemics of the job, and a question anyone who takes risk has genuinely wrestled with. It gets past compliance because it is about method, not positioning.","followups":["What is your actual rule for cutting a losing position?"],"tags":["calibration","flagship","compliance-safe"],"pack":"Finance & Insurance"},{"id":"fin-02","text":"What does your model not capture, and how do you account for that?","theme":"craft","arc":"core","depth":"medium","industries":["finance"],"lands_because":"Every quantitative professional knows the boundary of their model, and describing it is the most honest form of expertise they can offer publicly.","followups":["When did that gap last cost you?"],"tags":["models","limits","honest"],"pack":"Finance & Insurance"},{"id":"fin-03","text":"Who bears the risk when you are wrong - you, the firm, or the client?","theme":"money","arc":"deep","depth":"probing","industries":["finance"],"lands_because":"Goes directly at the asymmetry that defines the industry's reputation, framed structurally so it can be answered without self-indictment.","followups":["Should that be different?"],"tags":["risk-asymmetry","structural","high-yield"],"pack":"Finance & Insurance"},{"id":"fin-04","text":"What is the most consequential thing you have to explain to clients that they consistently do not want to believe?","theme":"people","arc":"core","depth":"medium","industries":["finance"],"lands_because":"Works for advisors, underwriters, and adjusters alike, and produces practical value for the audience without touching a specific recommendation.","followups":["What actually gets through to them?"],"tags":["client-communication","audience-gift"],"pack":"Finance & Insurance"},{"id":"fin-05","text":"What behavior does your compensation structure produce that nobody would defend in the abstract?","theme":"money","arc":"deep","depth":"probing","industries":["finance"],"lands_because":"Everyone in finance has an answer - quarter-end behavior, gathering assets over serving them, volume over quality - and the abstract framing makes it safe to give.","followups":["Has anyone tried to fix it?"],"avoid_if":"The guest currently sets compensation policy at a named firm.","tags":["incentives","critique","high-yield"],"pack":"Finance & Insurance"},{"id":"fin-06","text":"What did 2008, or the closest equivalent in your corner of the industry, actually teach you - as opposed to what everyone says it taught them?","theme":"failure","arc":"deep","depth":"medium","industries":["finance"],"lands_because":"The clause rejecting the received lesson is what makes it work. It forces past the rehearsed narrative into what the guest personally changed.","followups":["What do you do differently now, concretely?"],"tags":["crisis","anti-narrative"],"pack":"Finance & Insurance"},{"id":"hc-01","text":"How much of your day is medicine, and how much is documentation, coding, and prior authorization?","theme":"invisible","arc":"core","depth":"medium","industries":["healthcare"],"lands_because":"Names the administrative load without editorializing. It signals immediately that you know the clinical work is not the whole job, which is what most interviewers miss.","followups":["What would you do with that time back?"],"tags":["administrative-burden","signals-homework"],"pack":"Healthcare & Medicine"},{"id":"hc-02","text":"What do you know within thirty seconds of walking into a room that you would struggle to justify on the chart?","theme":"craft","arc":"core","depth":"medium","industries":["healthcare"],"lands_because":"Clinical gestalt is real, taught informally, and hard to document. Asking about the gap between knowing and charting is deeply insider.","followups":["Has it ever been wrong in a way that mattered?"],"tags":["gestalt","tacit-knowledge","flagship"],"pack":"Healthcare & Medicine"},{"id":"hc-03","text":"How does your institution handle it when something goes wrong - and what is the difference between the formal process and what actually happens?","theme":"failure","arc":"deep","depth":"probing","industries":["healthcare"],"lands_because":"Morbidity and mortality review is one of the few genuinely institutionalized error cultures in professional life, and the gap between its form and its practice is the interesting part.","followups":["Who supports the clinician afterward?"],"avoid_if":"The guest has a pending case or is speaking on behalf of an employer.","tags":["error-culture","structural","second-victim"],"pack":"Healthcare & Medicine"},{"id":"hc-04","text":"When a patient's insurance dictates a course you disagree with, what actually happens next?","theme":"ethics","arc":"deep","depth":"medium","industries":["healthcare"],"lands_because":"Concrete and procedural rather than a broad political question about healthcare, so it produces a real story instead of a position statement.","followups":["How often do you win those?"],"tags":["payer-conflict","concrete","high-yield"],"pack":"Healthcare & Medicine"},{"id":"hc-05","text":"What do you tell patients that is true but incomplete, and how do you decide where to stop?","theme":"ethics","arc":"deep","depth":"probing","industries":["healthcare"],"lands_because":"Communication calibration is a genuine daily ethical practice, not a scandal, and framing it that way gets an honest answer rather than a defensive one.","followups":["Who taught you how to do that? Anyone?"],"tags":["disclosure","communication","nuanced"],"pack":"Healthcare & Medicine"},{"id":"hc-06","text":"Who on the care team knows the most about what is actually happening with a patient?","theme":"people","arc":"core","depth":"medium","industries":["healthcare"],"lands_because":"The answer is usually the bedside nurse or a tech, and the hierarchy question underneath it is one clinicians enjoy being asked honestly.","followups":["Does the structure make it easy for them to say so?"],"tags":["hierarchy","nursing","credit"],"pack":"Healthcare & Medicine"},{"id":"hos-01","text":"Anyone can execute one perfect plate. What does it take to do four hundred without a miss?","theme":"craft","arc":"core","depth":"medium","industries":["hospitality"],"lands_because":"Names consistency under volume as the real skill, which is the industry's own definition of excellence and the opposite of the television version.","followups":["Where does it break down first when it breaks down?"],"tags":["consistency","flagship","signals-homework"],"pack":"Hospitality & Food Service"},{"id":"hos-02","text":"Take me through the ten minutes when a service starts going wrong.","theme":"failure","arc":"core","depth":"medium","industries":["hospitality"],"lands_because":"Time-bounded, high-adrenaline, and vivid on audio. Everyone in the industry has lived it and can narrate it beat by beat.","followups":["Who pulls it back - and is it always the same person?"],"tags":["drama","story-generator","audio-friendly"],"pack":"Hospitality & Food Service"},{"id":"hos-03","text":"A full dining room does not mean a profitable one. Where does the money actually go?","theme":"money","arc":"core","depth":"medium","industries":["hospitality"],"lands_because":"Leading with the correction proves you understand the economics, and operators are eager to explain food cost, labor, and rent to someone who will listen.","followups":["What is the decision you make purely for margin that you wish you did not?"],"tags":["economics","signals-homework","flagship"],"pack":"Hospitality & Food Service"},{"id":"hos-04","text":"What is the relationship between front of house and back of house really like?","theme":"people","arc":"core","depth":"medium","industries":["hospitality"],"lands_because":"The central social divide of a restaurant, including the pay asymmetry between tipped and non-tipped staff. Asking about both halves signals you know there are two.","followups":["Does the tipping structure make that worse?"],"tags":["org-dynamics","tipping","structural"],"pack":"Hospitality & Food Service"},{"id":"hos-05","text":"What has changed about staffing since 2020, and what did the industry learn or refuse to learn?","theme":"change","arc":"deep","depth":"medium","industries":["hospitality"],"lands_because":"Labor is the live issue in the industry, and the 'refuse to learn' clause invites a real assessment instead of a defensive one.","followups":["What are you doing differently as an employer?"],"tags":["labor","current","candid"],"pack":"Hospitality & Food Service"},{"id":"hos-06","text":"What is the guest behavior that never makes it into the review but shapes the whole night?","theme":"invisible","arc":"core","depth":"medium","industries":["hospitality"],"lands_because":"Flips the review-driven power dynamic and lets the guest speak from the other side of it, which is both cathartic and genuinely informative.","followups":["What does a genuinely good guest do?"],"tags":["power-flip","cathartic","audience-gift"],"pack":"Hospitality & Food Service"},{"id":"law-01","text":"How much of your work is arguing, and how much is predicting what the other side will do?","theme":"craft","arc":"core","depth":"medium","industries":["law"],"lands_because":"Corrects the courtroom-drama frame from inside. Most legal work is anticipation and risk allocation, and lawyers appreciate an interviewer who already suspects that.","followups":["When did you get good at the predicting part?"],"tags":["myth-correction","signals-homework"],"pack":"Law"},{"id":"law-02","text":"What do you know about a case in the first meeting that the client does not want to hear yet?","theme":"judgment","arc":"core","depth":"medium","industries":["law"],"lands_because":"Early case assessment is a real skill, and the tension between honest evaluation and client management is the daily texture of practice.","followups":["How do you eventually tell them?"],"tags":["client-management","assessment"],"pack":"Law"},{"id":"law-03","text":"What does the billable hour do to how you work?","theme":"money","arc":"deep","depth":"probing","industries":["law"],"lands_because":"The central economic distortion of private practice, felt by everyone in it, and rarely discussed with an outsider who understands it is a structural question rather than an accusation.","followups":["Have you worked under a different model? Was it better?"],"avoid_if":"The guest is a public defender, judge, or in-house counsel - use a workload or caseload question instead.","tags":["incentives","billable-hour","high-yield"],"pack":"Law"},{"id":"law-04","text":"What is the most common misconception your clients arrive with about how the law works?","theme":"myths","arc":"core","depth":"light","industries":["law"],"lands_because":"Easy, generous, and it lets the guest be useful to the audience. Also surfaces the gap between legal reality and public understanding, which is the point of the episode.","followups":["Where does that idea come from?"],"tags":["easy","audience-gift"],"pack":"Law"},{"id":"law-05","text":"Where is the line between zealous advocacy and something you would not do?","theme":"ethics","arc":"deep","depth":"probing","industries":["law"],"lands_because":"Uses the profession's own language, which signals you know the duty is real and not a loophole. That framing gets a considered answer instead of a defensive one.","followups":["Have you watched someone cross it?"],"tags":["ethics","native-vocabulary","flagship"],"pack":"Law"},{"id":"law-06","text":"What does the system do well that critics miss, and what do the critics get right?","theme":"change","arc":"deep","depth":"medium","industries":["law"],"lands_because":"The two-sided structure lets a lawyer defend the institution and criticize it in the same answer, which is where their actual view usually lives.","followups":["What reform would you actually support?"],"tags":["balanced","reform","nuance"],"pack":"Law"},{"id":"log-01","text":"How much of your job is executing the plan versus handling everything that breaks it?","theme":"craft","arc":"core","depth":"medium","industries":["logistics"],"lands_because":"Exception handling is the actual work, and framing it that way immediately separates you from interviewers who think supply chain is a spreadsheet.","followups":["What broke this week?"],"tags":["exception-handling","flagship","signals-homework"],"pack":"Logistics & Supply Chain"},{"id":"log-02","text":"Where is the constraint in your network right now, and how did you know before the data showed it?","theme":"judgment","arc":"core","depth":"medium","industries":["logistics"],"lands_because":"Constraint-spotting ahead of the reporting is exactly what expertise looks like in this field, and it is a satisfying thing for a practitioner to explain.","followups":["Who told you? A person or a system?"],"tags":["expertise","constraints"],"pack":"Logistics & Supply Chain"},{"id":"log-03","text":"How much of this industry still runs on personal relationships and a phone call?","theme":"people","arc":"core","depth":"medium","industries":["logistics"],"lands_because":"The persistence of relationship-based capacity brokering inside a supposedly digitized industry is one of the best untold stories in logistics.","followups":["What can you get with a call that no platform will get you?"],"tags":["relationships","underasked","flagship"],"pack":"Logistics & Supply Chain"},{"id":"log-04","text":"Tell me about a shipment that went wrong in a way you had never seen before.","theme":"failure","arc":"core","depth":"medium","industries":["logistics"],"lands_because":"Logistics failures are concrete, geographically vivid, and often absurd. Reliable story generator with real systems insight underneath.","followups":["What did you change afterward?"],"tags":["story-generator","vivid"],"pack":"Logistics & Supply Chain"},{"id":"log-05","text":"What did the disruption years actually expose that was already fragile?","theme":"change","arc":"deep","depth":"medium","industries":["logistics"],"lands_because":"Reframes 2020-22 as revelation rather than cause, which is how people inside the industry think about it and how outsiders generally do not.","followups":["Has any of it actually been fixed, or just re-priced?"],"tags":["resilience","reframe","high-yield"],"pack":"Logistics & Supply Chain"},{"id":"log-06","text":"Who in this chain absorbs the cost when something goes wrong?","theme":"money","arc":"deep","depth":"probing","industries":["logistics"],"lands_because":"Follows the risk down the chain to drivers, small carriers, and warehouse labor. Structural framing makes it answerable without indicting anyone by name.","followups":["Is that where it should sit?"],"tags":["risk-asymmetry","labor","structural"],"pack":"Logistics & Supply Chain"},{"id":"mfg-01","text":"What does the process document say, and what does the line actually do?","theme":"craft","arc":"core","depth":"medium","industries":["manufacturing"],"lands_because":"The gap between documented and actual process is where all the real knowledge lives, and everyone on a floor knows it exists.","followups":["Who holds the undocumented version?"],"tags":["tacit-knowledge","flagship"],"pack":"Manufacturing"},{"id":"mfg-02","text":"Can you hear when something is wrong before the instruments say so?","theme":"craft","arc":"core","depth":"medium","industries":["manufacturing"],"lands_because":"Sensory expertise is real on a floor and delightful on audio. It also opens the broader question of what happens to that knowledge as sensors replace it.","followups":["Is that being lost as the equipment gets smarter?"],"tags":["sensory","vivid","audio-friendly"],"pack":"Manufacturing"},{"id":"mfg-03","text":"Tell me about a line-down. What actually happens in the first hour?","theme":"failure","arc":"core","depth":"medium","industries":["manufacturing"],"lands_because":"High-stakes, concrete, time-bounded, and expensive by the minute. Uses native vocabulary, which immediately establishes that you know the world.","followups":["Who gets called, in what order?"],"tags":["native-vocabulary","drama","story-generator"],"pack":"Manufacturing"},{"id":"mfg-04","text":"Where is the real tension between the floor and the office?","theme":"people","arc":"deep","depth":"medium","industries":["manufacturing"],"lands_because":"The defining social structure of a plant. Whichever side the guest sits on, they have a detailed and rarely solicited view of the other.","followups":["When has the other side been right?"],"tags":["org-dynamics","structural"],"pack":"Manufacturing"},{"id":"mfg-05","text":"What automation has actually worked in your plant, and what got quietly rolled back?","theme":"change","arc":"core","depth":"medium","industries":["manufacturing"],"lands_because":"The rollback half is the question nobody asks. Failed automation projects are common, instructive, and rarely discussed publicly.","followups":["Why did it fail - the technology or the implementation?"],"tags":["automation","failure","underasked"],"pack":"Manufacturing"},{"id":"mfg-06","text":"What quality problem have you seen shipped because the schedule won?","theme":"ethics","arc":"deep","depth":"probing","industries":["manufacturing"],"lands_because":"The core ethical pressure of production work, asked concretely enough to produce a real answer rather than a policy statement.","followups":["What happened downstream?"],"avoid_if":"The guest holds current quality authority at a named employer and the answer could create liability.","tags":["quality","pressure","high-yield"],"pack":"Manufacturing"},{"id":"med-01","text":"How do you decide a story is solid enough to publish?","theme":"judgment","arc":"core","depth":"medium","industries":["media-journalism"],"lands_because":"Verification standards are the profession's actual craft, and asking about the threshold rather than the scoop is a question they respect.","followups":["When did you hold something you wanted to run?"],"tags":["verification","craft","flagship"],"pack":"Media & Journalism"},{"id":"med-02","text":"What is the story you could not get, and what stopped it?","theme":"failure","arc":"deep","depth":"medium","industries":["media-journalism"],"lands_because":"Killed and unprovable stories are a genuine grief in the profession, and the reasons - sourcing, legal, resources, access - are individually revealing.","followups":["Do you think it was true?"],"avoid_if":"The story is still live or the answer would identify a source.","tags":["killed-stories","candid"],"pack":"Media & Journalism"},{"id":"med-03","text":"What does a source want from you, and how do you keep that from shaping the coverage?","theme":"ethics","arc":"deep","depth":"probing","industries":["media-journalism"],"lands_because":"The transactional reality of sourcing is well understood inside the profession and poorly understood outside. It respects the relationship without asking them to burn it.","followups":["Have you ever been used? Did you know at the time?"],"tags":["sourcing","ethics","high-yield"],"pack":"Media & Journalism"},{"id":"med-04","text":"How much of what you do is reporting, and how much is now audience and distribution work?","theme":"invisible","arc":"core","depth":"medium","industries":["media-journalism"],"lands_because":"The expansion of the job into promotion and metrics is universal and resented, and asking about it acknowledges a change nobody chose.","followups":["Does the metric change what you pitch?"],"tags":["scope-creep","metrics","current"],"pack":"Media & Journalism"},{"id":"med-05","text":"What does the public misunderstand about how an article actually gets made?","theme":"myths","arc":"core","depth":"medium","industries":["media-journalism"],"lands_because":"Headlines they did not write, editors, legal review, and space constraints - useful audience education and a chance for the guest to correct a grievance fairly.","followups":["What criticism of the press do you think is actually fair?"],"tags":["process","myth-correction","balanced"],"pack":"Media & Journalism"},{"id":"med-06","text":"Who is paying for journalism now, and what does that money want?","theme":"money","arc":"deep","depth":"probing","industries":["media-journalism"],"lands_because":"Subscriptions, philanthropy, events, and ownership each pull differently. Journalists analyze this constantly and are rarely asked to say it out loud.","followups":["What kind of story does that model make harder to do?"],"tags":["business-model","structural","high-yield"],"pack":"Media & Journalism"},{"id":"npo-01","text":"How do funder priorities change what your programs actually do?","theme":"money","arc":"deep","depth":"probing","industries":["nonprofit"],"lands_because":"The central structural tension of the sector. Framing it as a systemic force rather than a personal compromise gets a real answer.","followups":["What would you do differently with unrestricted money?"],"tags":["funding","structural","flagship"],"pack":"Nonprofit & Social Impact"},{"id":"npo-02","text":"What are you required to measure, and what actually tells you the work is working?","theme":"craft","arc":"core","depth":"medium","industries":["nonprofit"],"lands_because":"Outputs versus outcomes is a genuine methodological problem here, not a dodge, and practitioners have thought hard about the gap.","followups":["What is the signal you trust that would never make a grant report?"],"tags":["measurement","impact","high-yield"],"pack":"Nonprofit & Social Impact"},{"id":"npo-03","text":"What does the community you serve ask for that funders will not pay for?","theme":"ethics","arc":"deep","depth":"probing","industries":["nonprofit"],"lands_because":"Centers the people served as agents with their own account of what they need, and exposes the mismatch without making the guest attack a funder by name.","followups":["Have you ever funded it anyway?"],"tags":["participation","mismatch","high-yield"],"pack":"Nonprofit & Social Impact"},{"id":"npo-04","text":"What happens in your organization when a grant cycle ends and the need does not?","theme":"money","arc":"core","depth":"medium","industries":["nonprofit"],"lands_because":"Funding cliffs are the operational reality of the sector - staff losses, program shutdowns, relationships broken - and produce concrete stories.","followups":["What does that do to the people you were serving?"],"tags":["funding-cliff","operational","concrete"],"pack":"Nonprofit & Social Impact"},{"id":"npo-05","text":"How do you talk about the work to donors versus how you talk about it in the staff meeting?","theme":"myths","arc":"deep","depth":"probing","industries":["nonprofit"],"lands_because":"Names the two-register communication everyone in the sector performs, in a way that is understanding rather than accusatory.","followups":["Does the donor version ever start to distort the work itself?"],"tags":["narrative","candid","two-register"],"pack":"Nonprofit & Social Impact"},{"id":"npo-06","text":"What would it look like if your organization succeeded so completely that it should close?","theme":"future","arc":"closer","depth":"medium","industries":["nonprofit"],"lands_because":"The institutional self-perpetuation question, asked as an aspiration rather than an accusation. It reliably produces something thoughtful.","followups":["Is anything in the structure working against that?"],"tags":["mission","closer","provocative-but-kind"],"pack":"Nonprofit & Social Impact"},{"id":"gov-01","text":"When someone says 'why don't you just' about your agency, what is the actual answer?","theme":"craft","arc":"core","depth":"medium","industries":["public-sector"],"lands_because":"Invites the guest to explain the statutory and procedural machinery behind an apparent absurdity. It is the single most clarifying question you can ask a civil servant.","followups":["Who would have to change what for it to work differently?"],"tags":["constraints","flagship","clarifying"],"pack":"Public Sector & Government"},{"id":"gov-02","text":"What discretion do you actually have, and where does it run out?","theme":"judgment","arc":"core","depth":"medium","industries":["public-sector"],"lands_because":"Street-level discretion is where policy meets a person, and mapping its boundary is both fascinating and rarely solicited.","followups":["When did you use it in a way you are proud of?"],"tags":["discretion","distinctive"],"pack":"Public Sector & Government"},{"id":"gov-03","text":"What survives changes in administration, and what gets undone every few years?","theme":"change","arc":"deep","depth":"medium","industries":["public-sector"],"lands_because":"Lets career staff speak to institutional continuity without commenting on any party, which is exactly the space they can legitimately occupy.","followups":["What is the cost of that cycle?"],"tags":["continuity","nonpartisan-safe","high-yield"],"pack":"Public Sector & Government"},{"id":"gov-04","text":"What does the public experience of your agency feel like, and how much of that is by design?","theme":"ethics","arc":"deep","depth":"probing","industries":["public-sector"],"lands_because":"Administrative burden - forms, waits, proof requirements - is sometimes deliberate policy and sometimes accumulated neglect. Distinguishing them is genuinely revealing.","followups":["What would you simplify first?"],"tags":["administrative-burden","structural","high-yield"],"pack":"Public Sector & Government"},{"id":"gov-05","text":"What is the failure the public never hears about because the process worked?","theme":"invisible","arc":"core","depth":"medium","industries":["public-sector"],"lands_because":"Prevention is invisible by nature and public service is largely prevention. It gives the guest a rare chance to describe a success no one witnessed.","followups":["How do you defend the budget for something that succeeds silently?"],"tags":["prevention","invisible-labor"],"pack":"Public Sector & Government"},{"id":"gov-06","text":"Why did you stay in public service?","theme":"personal","arc":"closer","depth":"medium","industries":["public-sector"],"lands_because":"Career civil servants have absorbed years of public contempt for their work. Asking sincerely, at the end, usually produces something genuinely moving.","followups":["What would it take for you to leave?"],"tags":["closer","sincere","warm"],"pack":"Public Sector & Government"},{"id":"re-01","text":"How many people can kill a deal, and which one usually does?","theme":"craft","arc":"core","depth":"medium","industries":["real-estate"],"lands_because":"Frames the job as chain management rather than salesmanship, which is accurate and immediately signals you understand the work.","followups":["Tell me about one that died at the eleventh hour."],"tags":["deal-mechanics","flagship","story-generator"],"pack":"Real Estate & Development"},{"id":"re-02","text":"How long does the paperwork take compared to the building?","theme":"invisible","arc":"core","depth":"medium","industries":["real-estate"],"lands_because":"Entitlement, zoning, financing, and approvals routinely dwarf construction timelines, and almost nobody outside the industry knows that.","followups":["What is the single longest thing you have waited on?"],"tags":["entitlement","signals-homework"],"pack":"Real Estate & Development"},{"id":"re-03","text":"What do you know about a property in the first five minutes that the listing will never say?","theme":"craft","arc":"core","depth":"medium","industries":["real-estate"],"lands_because":"Rapid assessment is real expertise here - drainage, orientation, deferred maintenance, the neighbors - and it makes great concrete audio.","followups":["What do buyers fixate on that does not matter?"],"tags":["assessment","vivid","audience-gift"],"pack":"Real Estate & Development"},{"id":"re-04","text":"Whose interests are you actually representing, and does the client understand that?","theme":"ethics","arc":"deep","depth":"probing","industries":["real-estate"],"lands_because":"Agency, dual agency, and commission incentives are structurally confusing to consumers, and a straight answer here is a real public service.","followups":["How does the commission structure pull on that?"],"tags":["agency","incentives","high-yield"],"pack":"Real Estate & Development"},{"id":"re-05","text":"What have you built or sold that you would not want to live in or next to?","theme":"ethics","arc":"deep","depth":"probing","industries":["real-estate"],"lands_because":"Personal-stake framing gets past the standard defense of the product. It is sharp, so save it for a guest who has been genuinely candid.","followups":["What would you have changed if the numbers had allowed?"],"avoid_if":"The guest is currently marketing that specific project.","tags":["sharp","candor-required","quality"],"pack":"Real Estate & Development"},{"id":"re-06","text":"What do people blame developers for that is actually a zoning or financing constraint?","theme":"myths","arc":"core","depth":"medium","industries":["real-estate"],"lands_because":"Lets a developer redirect blame toward structure rather than defend themselves, which produces a far more informative answer about how housing actually gets built.","followups":["And what do developers actually deserve blame for?"],"tags":["myth-correction","balanced","housing"],"pack":"Real Estate & Development"},{"id":"ret-01","text":"You are converting cash into a bet on what people will want months from now. How do you make that call?","theme":"judgment","arc":"core","depth":"medium","industries":["retail-ecommerce"],"lands_because":"Frames buying as the forecasting problem it actually is. Buyers rarely get treated as the risk-takers they are and respond well to it.","followups":["What did you get badly wrong, and what did you learn from it?"],"tags":["buying","forecasting","flagship"],"pack":"Retail & E-commerce"},{"id":"ret-02","text":"What happens to the inventory that does not sell?","theme":"money","arc":"core","depth":"medium","industries":["retail-ecommerce"],"lands_because":"Markdowns, liquidation, returns processing, and destruction are the industry's least examined and most consequential machinery.","followups":["How much of your margin does that quietly eat?"],"tags":["markdowns","underasked"],"pack":"Retail & E-commerce"},{"id":"ret-03","text":"What does a great store manager do that would not show up in any report?","theme":"craft","arc":"core","depth":"medium","industries":["retail-ecommerce"],"lands_because":"Treats store operations as skilled work - scheduling, training, de-escalation, floor sense - which the industry's own corporate side often fails to do.","followups":["Does the company know who those people are?"],"tags":["store-ops","respect","invisible-labor"],"pack":"Retail & E-commerce"},{"id":"ret-04","text":"What did you learn about your customers from returns that you never learned from sales?","theme":"craft","arc":"core","depth":"medium","industries":["retail-ecommerce"],"lands_because":"Returns are a rich and under-discussed data source, and the operational cost of them is a story in itself.","followups":["What have you changed because of it?"],"tags":["returns","underasked","data"],"pack":"Retail & E-commerce"},{"id":"ret-05","text":"What does the platform you sell on take from you, and what do you get for it?","theme":"money","arc":"deep","depth":"probing","industries":["retail-ecommerce"],"lands_because":"Marketplace and ad-spend dependency is the defining economic condition for most sellers, and the honest accounting is rarely offered publicly.","followups":["What happens to your business if those terms change?"],"tags":["platform-dependency","economics","high-yield"],"pack":"Retail & E-commerce"},{"id":"ret-06","text":"What have you watched customer behavior do in the last few years that surprised you?","theme":"change","arc":"core","depth":"medium","industries":["retail-ecommerce"],"lands_because":"Frontline retail is a genuine sensor for economic and social change, and operators notice patterns long before they appear in the data.","followups":["Do you think that is permanent?"],"tags":["consumer-behavior","sensor"],"pack":"Retail & E-commerce"},{"id":"sci-01","text":"What has not worked, and how long have you been at it?","theme":"failure","arc":"core","depth":"medium","industries":["science-research"],"lands_because":"Failure is the daily condition of research and asking about it directly is a relief rather than an insult. It also produces a real sense of scientific time.","followups":["How do you decide when to abandon a line of work?"],"tags":["failure","flagship","honest"],"pack":"Science & Research"},{"id":"sci-02","text":"How much of your week is science, and how much is applying for the ability to do science?","theme":"invisible","arc":"core","depth":"medium","industries":["science-research"],"lands_because":"The grant-writing load is enormous, universally resented, and rarely visible to the public. Naming it earns immediate credibility.","followups":["What is your funding hit rate?"],"tags":["grants","signals-homework","high-yield"],"pack":"Science & Research"},{"id":"sci-03","text":"What does your field reward that is not the same as what is true?","theme":"ethics","arc":"deep","depth":"probing","industries":["science-research"],"lands_because":"Novelty over replication, positive results over null results, volume over care. Researchers discuss this constantly among themselves and welcome an outsider who already knows.","followups":["Have you felt that pull on your own work?"],"tags":["incentives","structural","flagship"],"pack":"Science & Research"},{"id":"sci-04","text":"What is a result in your field that you privately doubt?","theme":"judgment","arc":"deep","depth":"probing","industries":["science-research"],"lands_because":"Gets at the informal reputational knowledge - whose data holds up - that never appears in the literature. Handle carefully; let them keep it general.","followups":["What would it take to settle it?"],"avoid_if":"The guest would have to name a specific rival or lab. Offer them the general version first.","tags":["replication","sharp","handle-with-care"],"pack":"Science & Research"},{"id":"sci-05","text":"How do you talk about uncertainty to people who want a yes or a no?","theme":"craft","arc":"core","depth":"medium","industries":["science-research"],"lands_because":"Science communication under pressure is a skill scientists have had to develop recently and painfully. It is timely without being political.","followups":["When did that go badly for you?"],"tags":["communication","timely"],"pack":"Science & Research"},{"id":"sci-06","text":"What question in your field would you most want answered, even if someone else answered it?","theme":"future","arc":"closer","depth":"medium","industries":["science-research"],"lands_because":"The 'even if someone else' clause moves past career positioning to genuine curiosity, and closes the episode on what drew them in.","followups":["What is standing in the way of it?"],"tags":["closer","curiosity","warm"],"pack":"Science & Research"},{"id":"trd-01","text":"How much of the job is the physical work, and how much is figuring out what is actually wrong?","theme":"craft","arc":"core","depth":"medium","industries":["skilled-trades"],"lands_because":"Reframes the trade as diagnostic work, which is how tradespeople see themselves and how outsiders almost never do. It changes the whole tenor of the interview.","followups":["What is the hardest diagnosis you have made?"],"tags":["diagnosis","reframe","flagship"],"pack":"Skilled Trades & Construction"},{"id":"trd-02","text":"What is the worst thing you have opened up a wall and found?","theme":"craft","arc":"warmup","depth":"light","industries":["skilled-trades"],"lands_because":"Every tradesperson has this story and enjoys telling it. Perfect early-episode material, and it establishes the improvisation the job requires.","followups":["Who did that, and were they licensed?"],"tags":["story-generator","fun","warmup"],"pack":"Skilled Trades & Construction"},{"id":"trd-03","text":"How do you price a job when you cannot know what you will find?","theme":"money","arc":"core","depth":"medium","industries":["skilled-trades"],"lands_because":"Bidding under uncertainty is the central business risk of the trades, and it is a genuinely interesting decision problem that nobody asks about.","followups":["When did you last eat a mistake on a bid?"],"tags":["pricing","business","underasked"],"pack":"Skilled Trades & Construction"},{"id":"trd-04","text":"What do you see on a job that tells you who worked on it before you, and what they were like?","theme":"craft","arc":"core","depth":"medium","industries":["skilled-trades"],"lands_because":"Reading another tradesperson's work is a form of connoisseurship, and hearing it described makes the audience see a building differently forever.","followups":["What will the next person say about your work?"],"tags":["connoisseurship","vivid","flagship"],"pack":"Skilled Trades & Construction"},{"id":"trd-05","text":"What is the code requirement you follow that customers fight you on?","theme":"ethics","arc":"core","depth":"medium","industries":["skilled-trades"],"lands_because":"Puts the guest in the position of the professional defending a standard against pressure, which is both accurate and flattering.","followups":["What happens when they go find someone who will?"],"tags":["standards","pressure","customer-conflict"],"pack":"Skilled Trades & Construction"},{"id":"trd-06","text":"What does this work do to a body over twenty years, and what are you doing about it?","theme":"personal","arc":"deep","depth":"probing","industries":["skilled-trades"],"lands_because":"The physical cost is universal in the trades and rarely discussed with outsiders. The second clause keeps it from being pitying.","followups":["Do the younger guys listen?"],"tags":["physical-cost","candid","sustainability"],"pack":"Skilled Trades & Construction"},{"id":"spt-01","text":"What does the work look like on a Tuesday in the off-season?","theme":"craft","arc":"core","depth":"medium","industries":["sports"],"lands_because":"Moves straight past the game to the repetition that actually constitutes the profession, which is what athletes and coaches mostly do and rarely get asked about.","followups":["What is the most tedious part that matters most?"],"tags":["preparation","anti-highlight","flagship"],"pack":"Sports & Athletics"},{"id":"spt-02","text":"What do you see on film that a knowledgeable fan watching the same play would miss?","theme":"craft","arc":"core","depth":"medium","industries":["sports"],"lands_because":"Specifying a knowledgeable fan raises the bar and produces genuine technical detail rather than a generic answer about hard work.","followups":["Teach me what to look for next time I watch."],"tags":["technical","audience-gift","flagship"],"pack":"Sports & Athletics"},{"id":"spt-03","text":"How do you manage knowing the career has a fixed end?","theme":"personal","arc":"deep","depth":"probing","industries":["sports"],"lands_because":"Career brevity shapes everything - money, injury decisions, identity - and athletes think about it constantly while mostly being asked about the next game.","followups":["What are you building for after?"],"tags":["career-length","identity","high-yield"],"pack":"Sports & Athletics"},{"id":"spt-04","text":"What is the injury decision you have made that you would make differently now?","theme":"judgment","arc":"deep","depth":"probing","industries":["sports"],"lands_because":"Playing through injury sits at the intersection of pressure, money, and medical advice. It is honest and concrete without requiring the guest to blame anyone.","followups":["Who was in your ear at the time?"],"avoid_if":"The guest is currently in a contract negotiation or dealing with an active injury.","tags":["injury","pressure","candid"],"pack":"Sports & Athletics"},{"id":"spt-05","text":"What does the locker room know about a teammate that the coaching staff does not?","theme":"people","arc":"deep","depth":"medium","industries":["sports"],"lands_because":"Information asymmetry inside a team is real and fascinating, and it can be answered in general terms without betraying anyone.","followups":["Should the staff know?"],"tags":["team-dynamics","insider"],"pack":"Sports & Athletics"},{"id":"spt-06","text":"What do you understand about the business of this sport now that you did not at the start?","theme":"money","arc":"core","depth":"medium","industries":["sports"],"lands_because":"Contracts, agents, media obligations, and revenue structures are a genuine education athletes acquire the hard way, and it moves the interview off the field.","followups":["What do you tell younger players about it?"],"tags":["business","candid"],"pack":"Sports & Athletics"},{"id":"tech-01","text":"What is the oldest system you depend on, and what happens when it finally goes?","theme":"craft","arc":"core","depth":"medium","industries":["technology"],"lands_because":"Legacy dependency is the actual condition of the industry and almost never the subject of an interview. It produces both a great story and a real insight.","followups":["Does anyone still understand it?"],"tags":["legacy","underasked","flagship"],"pack":"Technology"},{"id":"tech-02","text":"Walk me through an incident. Not the postmortem version - what the first twenty minutes actually felt like.","theme":"failure","arc":"core","depth":"medium","industries":["technology"],"lands_because":"Rejecting the sanitized postmortem is what unlocks it. Incident response is genuinely dramatic and technologists rarely get asked for the experience rather than the writeup.","followups":["Who was in the channel, and who should have been?","What did the postmortem leave out?"],"tags":["incidents","drama","anti-narrative"],"pack":"Technology"},{"id":"tech-03","text":"What technical decision are you living with that you would make differently now?","theme":"judgment","arc":"core","depth":"medium","industries":["technology"],"lands_because":"Technical debt as autobiography. Engineers are unusually honest about this because owning a bad call is high-status among peers.","followups":["Was it wrong then, or only wrong later?"],"tags":["tech-debt","honest","reliable"],"pack":"Technology"},{"id":"tech-04","text":"What does your team spend time on that produces no visible output but would be catastrophic to stop?","theme":"invisible","arc":"core","depth":"medium","industries":["technology"],"lands_because":"Names the maintenance and reliability work that never appears in a roadmap or a launch post, which is most of what keeps software alive.","followups":["How do you justify that work upward?"],"tags":["maintenance","invisible-labor"],"pack":"Technology"},{"id":"tech-05","text":"Where in your work does the current wave of AI tooling actually help, and where does it quietly create work?","theme":"change","arc":"core","depth":"medium","industries":["technology"],"lands_because":"The two-sided framing gets past both boosterism and dismissal to a practitioner's real ledger, which is what listeners actually want.","followups":["What has it changed about how you hire or train juniors?"],"tags":["ai","balanced","current"],"pack":"Technology"},{"id":"tech-06","text":"Who in your organization can veto an engineering decision, and should they be able to?","theme":"people","arc":"deep","depth":"probing","industries":["technology"],"lands_because":"Gets at the real authority structure between engineering, product, security, and legal - the source of most of the frustration and most of the interesting stories.","followups":["Tell me about a time that veto was right."],"tags":["authority","org-dynamics"],"pack":"Technology"}],"profiles":[{"slug":"healthcare","label":"Healthcare & Medicine","vocabulary":{"craft":"clinical practice","work_unit":"case","peer":"colleague","customer":"patient","bad_outcome":"adverse event","crunch":"bad night in the ED"},"status_axis":"Specialty prestige, procedural skill, and how calm you are in a code. Publishing matters in academic settings and almost nowhere else.","earns_trust":"Knowing that documentation and prior authorization eat more of the day than medicine does. Distinguishing what the clinician controls from what the system imposes.","landmines":["Asking for a specific patient story without noting that they should keep it de-identified.","Treating 'burnout' as a personal resilience failure rather than a workload and autonomy problem.","Assuming doctors set prices or control billing."],"also_called":["encounter","consult","the unit","attending","resident"]},{"slug":"law","label":"Law","vocabulary":{"craft":"practice","work_unit":"matter","peer":"opposing counsel","customer":"client","bad_outcome":"adverse ruling","crunch":"week before trial"},"status_axis":"Firm tier and partnership track in private practice; trial record in litigation; clerkships early on. Public-interest lawyers run an entirely different status game.","earns_trust":"Understanding that most litigation never reaches trial and most transactional work is risk allocation, not argument. Knowing privilege limits what they can tell you.","landmines":["Asking them to comment on a live matter.","Conflating 'defended someone guilty' with a moral failure - it is the job and they have answered it a thousand times.","Assuming every lawyer goes to court."],"also_called":["case","deal","the bench","associate","partner","discovery"]},{"slug":"finance","label":"Finance & Insurance","vocabulary":{"craft":"the book","work_unit":"deal","peer":"the desk","customer":"client","bad_outcome":"blowup","crunch":"quarter close"},"status_axis":"P&L attribution and proximity to risk-taking. Being right when consensus was wrong is the currency; being right with consensus counts for little.","earns_trust":"Asking about process rather than picks. Recognizing compliance constraints on what they can say about positions or clients.","landmines":["Asking for stock tips or current positioning - it can be a regulatory problem, not just a dodge.","Treating all of finance as one job. A claims adjuster, a quant, and a CFP share almost nothing.","Assuming high pay means the work is easy or the person is unserious."],"also_called":["position","trade","mandate","counterparty","drawdown","market dislocation"]},{"slug":"technology","label":"Technology","vocabulary":{"craft":"engineering","work_unit":"project","peer":"teammate","customer":"user","bad_outcome":"outage","crunch":"launch week"},"status_axis":"Scope of systems owned and technical judgment respected by peers. Titles are noisy across companies and everyone knows it.","earns_trust":"Asking about maintenance, migration, and legacy systems rather than only about the new and shiny.","landmines":["Assuming everyone in tech is a startup founder or wants to be.","Asking 'how do I learn to code' as a substitute for a real question.","Treating the last eighteen months of AI news as the whole of the field."],"also_called":["ticket","sprint","service","on-call","incident","postmortem"]},{"slug":"manufacturing","label":"Manufacturing","vocabulary":{"craft":"the process","work_unit":"run","peer":"operator","customer":"buyer","bad_outcome":"line-down","crunch":"changeover"},"status_axis":"Being the person who can actually fix the machine. Tenure on a specific line is real authority regardless of title.","earns_trust":"Knowing that yield, takt time, and scrap are the daily scoreboard, and that a plant runs on relationships between the floor and the office.","landmines":["Nostalgia framing - treating manufacturing as a museum piece rather than a live, automated, technical field.","Assuming offshoring is a simple cost decision.","Talking to a plant manager as if they set the product roadmap."],"also_called":["lot","batch","the line","the OEM","recall","scrap","takt time","launch build"]},{"slug":"skilled-trades","label":"Skilled Trades & Construction","vocabulary":{"craft":"the trade","work_unit":"job","peer":"crew member","customer":"homeowner","bad_outcome":"callback","crunch":"hard deadline"},"status_axis":"Clean work that holds up, and the ability to solve a problem nobody else on site can. License level and years in matter; formal education does not.","earns_trust":"Asking about the parts of the job that are diagnosis rather than labor. Acknowledging the body cost and the business side of running a small shop.","landmines":["Framing the trades as a fallback for people who could not do college.","Assuming the work is unskilled repetition rather than constant improvisation against old buildings.","Asking for free advice about your own house instead of asking about their work."],"also_called":["punch list","the crew","the GC","the inspector","rough-in","warranty call"]},{"slug":"agriculture","label":"Agriculture & Food Production","vocabulary":{"craft":"the operation","work_unit":"season","peer":"neighbor","customer":"buyer","bad_outcome":"lost crop","crunch":"harvest"},"status_axis":"Land stewardship over generations, and yields nobody had to bail you out for. Debt discipline is quietly the whole game.","earns_trust":"Understanding that they are price takers, not price setters, and that weather, commodity markets, and input costs are three separate risks.","landmines":["Casual moralizing about industrial versus organic without knowing their economics.","Assuming farming is low-technology.","Treating subsidies as a handout without asking how the program actually works."],"also_called":["field","herd","the co-op","the processor","calving","planting window"]},{"slug":"education","label":"Education","vocabulary":{"craft":"teaching","work_unit":"unit","peer":"colleague","customer":"student","bad_outcome":"losing a kid","crunch":"testing season"},"status_axis":"Respect from other teachers, which is earned by classroom management and results with hard students - not by administration's metrics.","earns_trust":"Distinguishing the teaching from the paperwork, the policy, and the parenting the job now absorbs.","landmines":["'Those who can't do, teach' energy in any form.","Assuming test scores measure the thing they care about.","Asking a teacher to speak for all of education policy."],"also_called":["lesson","semester","the department","families","IEP","the first three weeks"]},{"slug":"hospitality","label":"Hospitality & Food Service","vocabulary":{"craft":"service","work_unit":"service","peer":"line cook","customer":"guest","bad_outcome":"comped table","crunch":"a Saturday double"},"status_axis":"Consistency under volume. Anyone can cook one great plate; running four hundred covers without a miss is the flex.","earns_trust":"Knowing the margins are thin, the labor math is brutal, and the romantic chef narrative is mostly a media product.","landmines":["Asking about their 'passion for food' as an opener - it is the most exhausted question in the industry.","Ignoring the back-of-house, or ignoring the front-of-house.","Assuming a full restaurant means a profitable one."],"also_called":["shift","cover","the pass","front of house","back of house","a full book"]},{"slug":"logistics","label":"Logistics & Supply Chain","vocabulary":{"craft":"the network","work_unit":"load","peer":"carrier","customer":"shipper","bad_outcome":"missed delivery window","crunch":"peak season"},"status_axis":"Knowing where the real constraint is before anyone else does, and having the relationships to get capacity when there is none.","earns_trust":"Understanding that the job is exception handling, not planning, and that most of the system runs on phone calls and trust.","landmines":["Assuming 2020-21 was the first time supply chains were hard.","Treating drivers as interchangeable labor when talking to anyone who has driven.","Believing software solved this."],"also_called":["lane","shipment","the broker","the driver","dwell time","detention"]},{"slug":"energy","label":"Energy & Utilities","vocabulary":{"craft":"operations","work_unit":"project","peer":"lineman","customer":"ratepayer","bad_outcome":"unplanned outage","crunch":"storm restoration"},"status_axis":"Safety record and reliability. In this field, an uneventful career is the mark of excellence, which is hard to talk about on a podcast.","earns_trust":"Separating the engineering from the politics. Knowing that regulated utilities cannot simply choose what to build.","landmines":["Asking someone to defend or attack their entire sector as a proxy for climate politics.","Assuming the grid is a single thing rather than interconnections, markets, and regulators.","Underestimating how much of the job is permitting."],"also_called":["outage","the control room","offtaker","interconnection queue","peak load day"]},{"slug":"creative-arts","label":"Creative Arts","vocabulary":{"craft":"the work","work_unit":"piece","peer":"collaborator","customer":"audience","bad_outcome":"a piece that died","crunch":"deadline"},"status_axis":"Peer respect and the ability to keep making work. Commercial success is real but sits uneasily next to it.","earns_trust":"Asking about process and revision rather than inspiration. Taking the business side seriously - rights, royalties, and who owns what.","landmines":["'Where do you get your ideas' in any phrasing.","Assuming they can live on the art alone, or assuming they cannot.","Asking them to explain the meaning of a specific work as if there is an answer key."],"also_called":["record","project","commission","the client","the gallery","release week"]},{"slug":"media-journalism","label":"Media & Journalism","vocabulary":{"craft":"reporting","work_unit":"story","peer":"editor","customer":"reader","bad_outcome":"correction","crunch":"breaking news cycle"},"status_axis":"Scoops and sourcing. Being first and right. Beat expertise ages into authority.","earns_trust":"Understanding sourcing rules and why they will not burn one. Knowing the business model collapse is not an abstraction to them.","landmines":["Asking them to reveal a source, even hypothetically.","Treating 'the media' as a monolith with a single agenda.","Assuming reporters write their own headlines."],"also_called":["piece","the desk","subscriber","source","the spike","close"]},{"slug":"nonprofit","label":"Nonprofit & Social Impact","vocabulary":{"craft":"the program","work_unit":"program year","peer":"partner organization","customer":"participant","bad_outcome":"a program that did not move the needle","crunch":"reporting deadline"},"status_axis":"Proximity to the actual work versus proximity to the money - and the tension between the two is a live wire worth pulling.","earns_trust":"Knowing that funder priorities distort programs, and that overhead ratios are a bad metric everyone is forced to perform.","landmines":["Assuming low pay means the work is not professionalized.","Framing beneficiaries as passive recipients.","Treating impact measurement as simple."],"also_called":["grant cycle","the community served","the funder","the board","funding cliff"]},{"slug":"public-sector","label":"Public Sector & Government","vocabulary":{"craft":"administration","work_unit":"case","peer":"colleague","customer":"constituent","bad_outcome":"process failure","crunch":"end of fiscal year"},"status_axis":"Institutional memory and the ability to make the machine actually move. Career staff quietly outlast appointees and know it.","earns_trust":"Understanding that constraints are statutory, not chosen, and that 'why don't you just' has an answer that is usually a law.","landmines":["Lazy bureaucrat framing.","Asking a civil servant to comment on elected officials or partisan politics - many genuinely cannot.","Assuming they have discretion they do not have."],"also_called":["permit","docket","the agency","the regulated party","legislative session"]},{"slug":"retail-ecommerce","label":"Retail & E-commerce","vocabulary":{"craft":"merchandising","work_unit":"season","peer":"store manager","customer":"shopper","bad_outcome":"dead inventory","crunch":"Q4"},"status_axis":"A buyer's instinct that turns into sell-through. In stores, the manager who can run a holiday weekend without drama.","earns_trust":"Knowing inventory is the whole business - cash converted into guesses about the future - and that returns and shrink quietly eat margin.","landmines":["Retail apocalypse framing.","Assuming store work is unskilled.","Talking about brand while ignoring unit economics, or the reverse."],"also_called":["drop","assortment","the vendor","the buyer","stockout","shrink","sell-through"]},{"slug":"real-estate","label":"Real Estate & Development","vocabulary":{"craft":"the deal","work_unit":"transaction","peer":"broker","customer":"buyer","bad_outcome":"a deal that dies at closing","crunch":"closing"},"status_axis":"Deals closed and capital raised. In development, what you have actually built and whether it still stands up.","earns_trust":"Knowing that entitlement and financing take longer than construction, and that most of the work is managing a chain of people who can each kill the deal.","landmines":["Treating agents as glorified door openers.","Assuming developers control zoning or timelines.","Asking for market predictions as the main event."],"also_called":["project","the asset","tenant","investor","entitlement","capital call"]},{"slug":"science-research","label":"Science & Research","vocabulary":{"craft":"the science","work_unit":"study","peer":"collaborator","customer":"the field","bad_outcome":"a result that will not replicate","crunch":"grant deadline"},"status_axis":"Publication venue and citation, plus a quieter reputation for whose data holds up. Grant funding is survival and everyone knows the ratio.","earns_trust":"Understanding that most of research is failed experiments and grant writing, and that the incentive structure is a known and painful topic.","landmines":["Asking for certainty they will not give.","Treating one preprint as settled science.","Assuming a PI still does bench work."],"also_called":["experiment","paper","the lab","reviewer","the funder","submission window"]},{"slug":"sports","label":"Sports & Athletics","vocabulary":{"craft":"the game","work_unit":"season","peer":"teammate","customer":"the organization","bad_outcome":"injury","crunch":"the playoff run"},"status_axis":"Performance under scrutiny, and the locker-room read on whether you are a pro. Contracts are public and that shapes everything.","earns_trust":"Asking about preparation, film, and the boring repetition rather than only the highlight. Taking the labor and business side seriously.","landmines":["Asking an athlete to relive a career-defining failure without warning.","Treating the body as a machine and ignoring the career-length anxiety.","Assuming coaches control roster decisions."],"also_called":["game","camp","the staff","the fans","film session","the trade deadline"]},{"slug":"defense-military","label":"Defense & Military","vocabulary":{"craft":"the mission","work_unit":"deployment","peer":"unit member","customer":"the command","bad_outcome":"mission failure","crunch":"deployment workup"},"status_axis":"Competence under load and what you did for the people next to you. Rank is formal authority; reputation in the unit is the real one.","earns_trust":"Knowing the difference between what is classified, what is sensitive, and what is simply not yours to ask. Asking about the job, not the war stories.","landmines":["'Did you ever kill anyone.' Never.","Thank-you-for-your-service framing as a substitute for a real question.","Assuming combat arms is the whole military - most of it is logistics, maintenance, and administration."],"also_called":["operation","the unit","the taxpayer","casualty","rotation","field exercise"]}],"taxonomy":{"arc":{"opener":"First 5 minutes. Low stakes, high specificity. Gets the guest talking in concrete detail before they can retreat into talking points.","warmup":"Minutes 5-15. Establishes the world and its vocabulary for the audience. Still safe for the guest.","core":"The body of the episode. Substantive but not confrontational. Most questions live here.","deep":"Requires earned trust. Ask after the guest has relaxed and after you have demonstrated you understand their world.","pivot":"Redirects a stalled or evasive stretch. Use out of order, on demand.","closer":"Last 10 minutes. Wide aperture, forward-looking, or reflective. Gives the guest a good last taste."},"depth":{"light":"Answerable in a sentence or two. Low risk of an evasive answer.","medium":"Needs a story or a worked example. The guest has to think.","probing":"Touches ego, money, blame, or professional consensus. Can go wrong. Ask deliberately."},"theme":{"origin":"How they got here, the path in, the accident or intention of it.","craft":"The actual work. Skill, tools, taste, tacit knowledge, what mastery looks like from inside.","judgment":"Decision-making under uncertainty, tradeoffs, the calls that don't have a right answer.","failure":"Mistakes, near-misses, repair, and what the field does with its errors.","people":"Teams, hierarchy, mentorship, clients, status, who holds power and how.","money":"Compensation, incentives, business model, who pays and what that distorts.","change":"How the field is shifting - technology, regulation, demographics, expectations.","ethics":"The lines, the gray zones, the pressure to cross them.","myths":"What outsiders get wrong, what the field misrepresents about itself.","invisible":"The unglamorous, unrecorded, or unpaid labor the job actually consists of.","future":"Where it goes next, what the guest would change, advice and legacy.","personal":"Cost, identity, sustainability, the life around the work."},"industries":{"universal":"Written to land on any professional. The backbone of the database.","healthcare":"Clinicians, nurses, hospital administrators, public health, allied health.","law":"Litigators, transactional lawyers, judges, public defenders, in-house counsel.","finance":"Banking, investing, accounting, insurance underwriting, financial advising.","technology":"Software, hardware, IT, security, data, product.","manufacturing":"Factory operations, industrial engineering, quality, plant management.","skilled-trades":"Electricians, plumbers, welders, machinists, construction, HVAC.","agriculture":"Farming, ranching, agronomy, fisheries, food production.","education":"K-12 teaching, higher ed, administration, training, curriculum.","hospitality":"Restaurants, hotels, bars, catering, events, tourism.","logistics":"Freight, warehousing, supply chain, procurement, last-mile delivery.","energy":"Oil and gas, utilities, renewables, grid operations, nuclear.","creative-arts":"Musicians, writers, designers, filmmakers, visual artists, performers.","media-journalism":"Reporters, editors, producers, publishers, broadcast.","nonprofit":"Direct service, philanthropy, advocacy, community organizing.","public-sector":"Civil service, policy, regulators, municipal government, emergency services.","retail-ecommerce":"Store operations, merchandising, buying, DTC brands, marketplaces.","real-estate":"Brokerage, development, property management, appraisal, construction finance.","science-research":"Academic and industrial research, labs, R&D, clinical trials.","sports":"Athletes, coaches, trainers, scouts, front office, officials.","defense-military":"Active and veteran service members, defense contracting, intelligence."},"roles":{"middle-manager":"The person responsible for delivery, holding a team below and executives above. Has authority over the work but rarely over the constraints.","ai-leader":"Whoever owns AI strategy, adoption or enablement - director, head of AI, transformation lead. Adjacent authority rather than a manager in the middle, and often the source of the pressure managers feel."}}};

  const ARC_ORDER = ["opener", "warmup", "core", "deep", "closer", "pivot"];
  // Target count per stage when assembling a brief.
  const BRIEF_SHAPE = [["opener", 2], ["warmup", 2], ["core", 8], ["deep", 5], ["closer", 3]];

  const profiles = Object.fromEntries(DATA.profiles.map(p => [p.slug, p]));

  const state = {
    industry: "",
    role: "",
    mode: "browse",
    search: "",
    depth: new Set(),
    arc: new Set(),
    theme: new Set(),
    industryOnly: false
  };

  /* ---------------------------------------------------------- slot filling */

  const CONSONANT_SOUNDED_VOWEL = /^(?:u(?:n[ei]|se|ti|ni)|eu|one\b)/i;
  const VOWEL_SOUNDED_CONSONANT = /^(?:hour|honest|honou?r|heir)/i;

  function articleFor(word) {
    if (VOWEL_SOUNDED_CONSONANT.test(word)) return "an";
    if (CONSONANT_SOUNDED_VOWEL.test(word)) return "a";
    return /^[aeiou]/i.test(word) ? "an" : "a";
  }

  function fillSlots(text, profile) {
    if (!profile) return text;
    const vocab = profile.vocabulary || {};
    return text
      .replace(/\b(a|A)\s+\{(\w+)\}/g, (whole, article, slot) => {
        const word = vocab[slot];
        if (!word) return whole;
        if (/^(a|an|the)\b/i.test(word)) return word;
        const chosen = articleFor(word);
        return (article === "A" ? chosen[0].toUpperCase() + chosen.slice(1) : chosen) + " " + word;
      })
      .replace(/\{(\w+)\}/g, (whole, slot) => vocab[slot] || whole);
  }

  /* -------------------------------------------------------------- filtering */

  function visible() {
    const needle = state.search.trim().toLowerCase();
    return DATA.questions.filter(q => {
      if (state.industry) {
        const own = q.industries.includes(state.industry);
        if (state.industryOnly ? !own : !(own || q.industries.includes("universal"))) return false;
      } else if (state.industryOnly) {
        return false;
      }
      // Role behaves like industry: picking one narrows to that role plus the
      // unscoped questions; picking none constrains nothing.
      if (state.role) {
        const roles = q.roles || [];
        if (!roles.includes(state.role) && roles.length) return false;
      }
      if (state.depth.size && !state.depth.has(q.depth)) return false;
      if (state.arc.size && !state.arc.has(q.arc)) return false;
      if (state.theme.size && !state.theme.has(q.theme)) return false;
      if (needle) {
        const hay = [q.text, q.lands_because || "", (q.followups || []).join(" "), (q.tags || []).join(" ")]
          .join(" ").toLowerCase();
        if (!hay.includes(needle)) return false;
      }
      return true;
    });
  }

  /* Deterministic shuffle so a brief is stable across reloads - you can print
     it, close the tab, and get the same running order back. */
  function seededShuffle(items, seed) {
    let s = seed >>> 0;
    const out = items.slice();
    for (let i = out.length - 1; i > 0; i--) {
      s = (s * 1664525 + 1013904223) >>> 0;
      const j = s % (i + 1);
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }

  function buildBrief() {
    const seed = [...(state.industry + state.role)].reduce((a, c) => a + c.charCodeAt(0), 7);
    const picked = [];
    for (const [arc, want] of BRIEF_SHAPE) {
      // Written for this guest: their industry, or their role in any industry.
      const specific = seededShuffle(DATA.questions.filter(q => q.arc === arc &&
        (q.industries.includes(state.industry) ||
         (state.role && (q.roles || []).includes(state.role)))), seed + arc.length);
      // The unscoped core. Questions aimed at some other role are excluded -
      // an AI-leader question does not belong in a manager's brief.
      const generic = seededShuffle(DATA.questions.filter(q => q.arc === arc &&
        q.industries.includes("universal") && !(q.roles || []).length), seed + arc.length);

      const picks = specific.slice(0, Math.max(1, want >> 1));
      for (const q of generic.concat(specific)) {
        if (picks.length >= want) break;
        if (!picks.includes(q)) picks.push(q);
      }
      picked.push(...picks);
    }
    return picked;
  }

  /* -------------------------------------------------------------- rendering */

  const el = (tag, props = {}, kids = []) => {
    const node = Object.assign(document.createElement(tag), props);
    for (const kid of [].concat(kids)) {
      if (kid) node.append(kid);
    }
    return node;
  };

  function card(q, index, profile) {
    const node = el("article", { className: "card" });
    node.dataset.depth = q.depth;

    node.append(el("span", { className: "seq", textContent: String(index).padStart(2, "0") }));
    node.append(el("p", { className: "q", textContent: fillSlots(q.text, profile) }));

    const meta = el("div", { className: "meta" });
    meta.append(el("span", { className: "depth", textContent: q.depth }));
    meta.append(el("span", { textContent: q.arc }));
    meta.append(el("span", { textContent: q.theme }));
    if (state.industry && q.industries.includes(state.industry)) {
      meta.append(el("span", { textContent: "· industry pack" }));
    }
    if (state.role && (q.roles || []).includes(state.role)) {
      meta.append(el("span", { textContent: "· role pack" }));
    }
    meta.append(el("span", { textContent: q.id }));
    node.append(meta);

    const notes = el("div", { className: "notes" });
    if (q.lands_because) notes.append(el("p", { className: "why", textContent: q.lands_because }));
    if (q.followups && q.followups.length) {
      notes.append(el("ul", {}, q.followups.map(f =>
        el("li", { textContent: fillSlots(f, profile) }))));
    }
    if (q.avoid_if) {
      const warn = el("div", { className: "warn" });
      warn.append(el("b", { textContent: "Careful" }));
      warn.append(el("span", { textContent: q.avoid_if }));
      notes.append(warn);
    }
    if (notes.childElementCount) node.append(notes);

    const copy = el("button", { className: "copy", type: "button", textContent: "copy" });
    copy.title = "Copy this question";
    copy.addEventListener("click", () => {
      navigator.clipboard.writeText(fillSlots(q.text, profile)).then(
        () => toast("Question copied"),
        () => toast("Could not reach the clipboard")
      );
    });
    node.append(copy);
    return node;
  }

  function profilePanel(profile) {
    const panel = el("section", { className: "profile" });
    panel.append(el("h2", { textContent: profile.label }));

    const dl = el("dl");
    const row = (term, value, cls) => {
      dl.append(el("dt", { textContent: term }));
      dl.append(el("dd", { className: cls || "", textContent: value }));
    };
    row("Status is earned by", profile.status_axis);
    row("You sound prepared when you", profile.earns_trust);

    dl.append(el("dt", { textContent: "Landmines" }));
    dl.append(el("dd", { className: "landmines" }, [
      el("ul", {}, profile.landmines.map(l => el("li", { textContent: l })))
    ]));
    panel.append(dl);

    const vocab = el("dl", { className: "vocab" });
    for (const [slot, word] of Object.entries(profile.vocabulary)) {
      vocab.append(el("dt", { textContent: "{" + slot + "}" }));
      vocab.append(el("dd", { textContent: word }));
    }
    panel.append(vocab);

    if (profile.also_called && profile.also_called.length) {
      const also = el("dl");
      also.append(el("dt", { textContent: "Other native terms" }));
      also.append(el("dd", { textContent: profile.also_called.join(" · ") }));
      panel.append(also);
    }
    return panel;
  }

  function stage(name, hint, questions, profile, offset) {
    const section = el("section", { className: "stage" });
    const head = el("header");
    head.append(el("h2", { textContent: name }));
    head.append(el("span", { className: "hint", textContent: hint }));
    section.append(head);
    questions.forEach((q, i) => section.append(card(q, offset + i + 1, profile)));
    return section;
  }

  function render() {
    const results = document.getElementById("results");
    const profile = profiles[state.industry] || null;
    results.replaceChildren();

    if (state.mode === "brief") {
      if (!profile && !state.role) {
        results.append(el("p", {
